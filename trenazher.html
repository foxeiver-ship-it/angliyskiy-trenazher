а часа</li><li><b>yesterday&#x27;s</b> meeting, <b>this year&#x27;s</b> results</li></ul><h3>Ловушки этой темы (из банка)</h3><p><b>en-0005. Can I give you ... ?</b> — «Можно дать вам совет?» Верно: <b>a piece of advice</b>.</p><ul><li>an advice — advice неисчисляемо, артикль a/an к нему не цепляется вообще.</li><li>some advices — множественного числа у advice не существует.</li><li>a few advice — a few только с исчисляемыми; к advice подошло бы a little, но правильный ответ здесь — партитив.</li></ul><p><b>en-0017. ... has lived in this house for a long time.</b> — «Здесь давно никто не живёт». Верно: <b>Nobody</b>.</p><ul><li>Something — про предметы, а жить может человек.</li><li>Some — определитель, ему нужно существительное после себя (some people), сам по себе подлежащим не работает.</li><li>Anybody — грамматически подлежащим быть может, но тогда потребовалось бы отрицание в глаголе (hasn&#x27;t), а глагол в задании утвердительный has lived. Anybody has lived значит «кто-то жил», смысл противоположный.</li><li>Nobody уже содержит отрицание внутри, поэтому глагол остаётся утвердительным, и он в единственном числе: has, не have.</li></ul><p><b>en-0019. ... money ... Charitable Fund.</b> — «Эти деньги принадлежат благотворительному фонду». Верно: <b>This ... belongs to</b>.</p><ul><li>That belongs — форма правильная, но потерян предлог: belong всегда <b>to</b>.</li><li>These belong to — money не имеет множественного числа, значит these и belong отпадают.</li><li>Those are belonging for — сразу три ошибки: множественное число, Continuous (belong — глагол состояния, в Continuous не ставится) и предлог for вместо to.</li></ul><p><b>en-0024. I have never seen ... an interesting film.</b> — «Я никогда не видел такого интересного фильма». Верно: <b>such</b>.</p><ul><li>so — работает только там, где после прилагательного нет существительного; здесь есть film.</li><li>very и too — по смыслу «очень» и «слишком», а нужно «такой». Плюс с ними артикль встал бы перед: a very interesting film, а в задании an уже стоит после пропуска — значит на его место годится только such.</li></ul><h3>Мини-чек перед ответом</h3><ol><li>Слово из списка advice / information / money / news / furniture? Тогда без -s, без a, глагол в единственном числе.</li><li>Считается? Тогда many / a few. Не считается? much / a little.</li><li>Есть not или n&#x27;t в глаголе? Дальше anything, а не nothing.</li><li>Подлежащее на -body / -one / -thing? Глагол с -s.</li><li>Есть существительное после прилагательного? such. Нет? so.</li><li>Место как функция (home, school, work, bed) — без артикля.</li><li>После местоимения идёт существительное? my, your, their. Не идёт? mine, yours, theirs.</li><li>Пишешь its / their / whose — подставь полную форму. Разворачивается в it is, they are, who is? Тогда апостроф: it&#x27;s, they&#x27;re, who&#x27;s.</li><li>Действие возвращается на подлежащее — myself, himself. Но feel, relax, concentrate, wash, dress возвратными не бывают.</li><li>Слово из списка data / criteria / phenomena / analyses? Это уже множественное число, глагол are.</li><li>Принадлежность: одушевлённое — &#x27;s, неодушевлённое — of. Множественное на -s берёт только апостроф.</li></ol>", "5": "<h2>Степени сравнения и наречия</h2><p>Эта тема про две вещи: как правильно сравнить (better, the best, чем-тем) и когда ставить форму на -ly. Неверные варианты почти всегда либо удваивают степень сравнения, либо подсовывают прилагательное туда, где нужно наречие.</p><h3>1. Как образуются степени сравнения</h3><p>Правило: <b>короткое слово получает -er/-est, длинное — more/most.</b></p><table><thead><tr><th>Тип слова</th><th>Сравнительная</th><th>Превосходная</th></tr></thead><tbody><tr><td>Один слог: long, big, fast</td><td>longer, bigger, faster</td><td>the longest, the biggest</td></tr><tr><td>Два слога на -y: easy, happy</td><td>easier, happier</td><td>the easiest, the happiest</td></tr><tr><td>Два слога и больше: modern, difficult</td><td>more modern, more difficult</td><td>the most difficult</td></tr><tr><td>Наречия на -ly: quickly, easily</td><td>more quickly, more easily</td><td>the most easily</td></tr></tbody></table><p>Мелочи написания: big → bigger (согласная удваивается), easy → easier (y меняется на i), nice → nicer (одна e).</p><p>Неправильные формы, их просто выучить:</p><table><thead><tr><th>Слово</th><th>Сравнительная</th><th>Превосходная</th></tr></thead><tbody><tr><td>good / well</td><td>better</td><td>the best</td></tr><tr><td>bad / badly</td><td>worse</td><td>the worst</td></tr><tr><td>little</td><td>less</td><td>the least</td></tr><tr><td>much / many</td><td>more</td><td>the most</td></tr><tr><td>far</td><td>farther / further</td><td>the farthest / the furthest</td></tr></tbody></table><ul><li>This job is <b>better</b> than the last one. — Эта работа лучше предыдущей.</li><li>It was <b>the worst</b> day of my year. — Это был худший день года.</li></ul><p><b>Перед превосходной степенью почти всегда стоит the</b>: the best, the most interesting, the least likely.</p><p>Сравнение с «чем» — через <b>than</b>: bigger <b>than</b> mine. Равенство — <b>as … as</b>: as big <b>as</b> mine; отрицание равенства — not as/so … as.</p><h3>2. Правило одной степени за раз</h3><p>Правило: <b>степень сравнения выражается один раз — либо окончанием, либо словом more/most, но не обоими сразу.</b></p><ul><li>It&#x27;s <b>easier</b> now. — Сейчас проще. (не ~~more easier~~)</li><li>It&#x27;s <b>more difficult</b> now. — Сейчас сложнее. (не ~~more difficulter~~)</li><li>She is <b>the best</b> student. — Она лучшая студентка. (не ~~the most best~~)</li></ul><p>Ошибка: more easier, more better, most easiest, more worse. По-русски мы говорим «более лёгкий», и рука сама тянется добавить more к уже готовому easier. Проверка простая: если в слове уже есть -er или -est, слова more и most рядом стоять не могут.</p><p>Единственное, что законно ставится рядом со сравнительной степенью, — усилители <b>much, far, a lot, a bit, slightly</b>: much better, far more difficult, a bit easier.</p><h3>3. Конструкция the more … the less</h3><p>Правило: <b>«чем …, тем …» = the + сравнительная степень, запятая, the + сравнительная степень. Прямой порядок слов в обеих частях, время — Present Simple даже про будущее.</b></p><ul><li><b>The more</b> you read, <b>the more</b> you know. — Чем больше читаешь, тем больше знаешь.</li><li><b>The better</b> educated one is, <b>the less</b> likely one is to be unemployed. — Чем лучше человек образован, тем меньше вероятность, что он окажется безработным.</li><li><b>The sooner</b>, <b>the better</b>. — Чем скорее, тем лучше.</li></ul><p>Три вещи, которые ломают эту конструкцию у всех:</p><ul><li><b>Инверсия запрещена.</b> The less likely <b>one is</b> — правильно; ~~the less likely is one~~ — неверно, хотя звучит «книжно».</li><li><b>Будущего времени тут нет.</b> Русское «будет» переводится настоящим: The better educated one <b>is</b>, не ~~will be~~.</li><li><b>Обе части обязательно в сравнительной степени.</b> ~~The best educated people will be~~ — превосходная степень в этой конструкции не работает.</li></ul><p>Слово <b>the</b> тут не артикль, а часть конструкции, поэтому оно нужно в обеих половинках.</p><h3>4. Наречие против прилагательного</h3><p>Правило: <b>прилагательное описывает существительное (какой?), наречие описывает глагол (как?). Наречие обычно на -ly.</b></p><ul><li>She is a <b>careful</b> driver. — Она аккуратный водитель. (какой — прилагательное)</li><li>She drives <b>carefully</b>. — Она водит аккуратно. (как — наречие)</li><li>Her new job started <b>appropriately</b> enough. — Её работа началась, что вполне уместно.</li></ul><p>Ошибка: ~~She drives careful~~, ~~started appropriate~~. Проверка: найди слово, к которому относится пропуск. Если это глагол (started, works, speaks) — форма на -ly.</p><p>Исключение: после глаголов состояния <b>be, look, seem, feel, sound, taste, smell, become, get</b> ставится прилагательное, а не наречие, потому что описывается подлежащее, а не действие.</p><ul><li>She looks <b>happy</b>. — Она выглядит счастливой. (не ~~happily~~)</li><li>The soup tastes <b>good</b>. — Суп вкусный.</li></ul><p>Слово <b>enough</b> ведёт себя нестандартно: <b>после</b> прилагательного и наречия, но <b>перед</b> существительным.</p><ul><li>good <b>enough</b> — достаточно хорошо; appropriately <b>enough</b> — что вполне уместно;</li><li><b>enough</b> money — достаточно денег.</li></ul><p>Ошибка: ~~enough good~~, ~~money enough~~.</p><h3>5. Пары-ловушки: слово с -ly и без -ly значат разное</h3><p>Правило: <b>у части наречий есть две формы, и они не синонимы.</b></p><table><thead><tr><th>Без -ly</th><th>Перевод</th><th>С -ly</th><th>Перевод</th></tr></thead><tbody><tr><td>hard</td><td>усердно, тяжело</td><td>hardly</td><td>едва, почти не</td></tr><tr><td>late</td><td>поздно</td><td>lately</td><td>в последнее время</td></tr><tr><td>near</td><td>близко</td><td>nearly</td><td>почти</td></tr><tr><td>high</td><td>высоко (физически)</td><td>highly</td><td>весьма, очень</td></tr><tr><td>deep</td><td>глубоко (физически)</td><td>deeply</td><td>глубоко (о чувствах)</td></tr><tr><td>free</td><td>бесплатно</td><td>freely</td><td>свободно</td></tr><tr><td>most</td><td>больше всего</td><td>mostly</td><td>в основном</td></tr><tr><td>pretty</td><td>довольно</td><td>prettily</td><td>красиво</td></tr></tbody></table><ul><li>He works <b>hard</b>. — Он много работает.</li><li>He <b>hardly</b> works. — Он почти не работает. (смысл противоположный!)</li><li>She came home <b>late</b>. — Она пришла домой поздно.</li><li>She has been busy <b>lately</b>. — В последнее время она занята.</li><li>I <b>nearly</b> missed the train. — Я чуть не опоздал на поезд.</li></ul><p>Важно: <b>hardly, scarcely, barely — это уже отрицание.</b> Второе отрицание рядом не ставится: I can hardly see <b>anything</b>, а не ~~nothing~~.</p><p>Отдельно: <b>good</b> — прилагательное, <b>well</b> — наречие. He is a good singer. He sings well. Но well ещё значит «здоровый»: I don&#x27;t feel well.</p><h3>6. Паронимы, которые подсовывают вместо нужного наречия</h3><p>Экзамен любит поставить в варианты похожее по звучанию слово с другим значением. Держи в голове разницу корней:</p><table><thead><tr><th>Слово</th><th>Значение</th></tr></thead><tbody><tr><td>appropriate / appropriately</td><td>уместный / уместно</td></tr><tr><td>approximate / approximately</td><td>приблизительный / приблизительно</td></tr><tr><td>alternative / alternatively</td><td>другой вариант / или же</td></tr><tr><td>likely</td><td>вероятный, вероятно</td></tr><tr><td>unlikely</td><td>маловероятный (противоположность!)</td></tr></tbody></table><p><b>Осторожно с un-</b>: less likely — «менее вероятно», less unlikely — «менее маловероятно», то есть «более вероятно». Приставка переворачивает смысл, и на этом строят неверный вариант.</p><h3 class=\"prog\">7. Разряды наречий и их место в предложении</h3><p>Правило: <b>наречие отвечает на вопросы когда, где, как, как часто и насколько, и от разряда зависит, куда его ставить.</b></p><table><thead><tr><th>Разряд</th><th>Вопрос</th><th>Слова</th></tr></thead><tbody><tr><td>Времени</td><td>когда?</td><td>now, then, yesterday, today, already, yet, still, soon</td></tr><tr><td>Места</td><td>где? куда?</td><td>here, there, everywhere, abroad, outside</td></tr><tr><td>Образа действия</td><td>как?</td><td>quickly, well, carefully, badly, slowly</td></tr><tr><td>Частотности</td><td>как часто?</td><td>always, usually, often, sometimes, rarely, never</td></tr><tr><td>Степени</td><td>насколько?</td><td>very, quite, rather, extremely, almost, hardly</td></tr><tr><td>Связи текста</td><td>связка мыслей</td><td>however, therefore, moreover, nevertheless, thus</td></tr></tbody></table><p>Наречия связи особенно важны в академических текстах: however — однако, therefore — поэтому, moreover — более того, nevertheless — тем не менее, thus — таким образом. Их часто дают в заданиях на выбор связки.</p><p><b>Частотность: перед смысловым глаголом, но после be.</b></p><ul><li>He <b>often</b> works at weekends. — Он часто работает по выходным.</li><li>He is <b>often</b> late. — Он часто опаздывает. (после be, не ~~He often is late~~)</li><li>He has <b>never</b> been there. — Он никогда там не был. (после первого вспомогательного)</li><li>She does <b>not usually</b> answer at night. — Обычно она не отвечает ночью.</li></ul><p><b>Образ действия: после глагола или после дополнения, но не между ними.</b></p><ul><li>He read the letter <b>carefully</b>. — Он внимательно прочитал письмо. (не ~~He read carefully the letter~~)</li><li>She speaks <b>quietly</b>. — Она говорит тихо.</li></ul><p>Это частая калька с русского: по-русски «он внимательно прочитал письмо» звучит нормально, по-английски наречие нельзя вклинить между глаголом и его дополнением.</p><p><b>Порядок нескольких обстоятельств: образ действия — место — время.</b></p><ul><li>She worked <b>hard at home yesterday</b>. — Вчера она усердно работала дома.</li><li>They played <b>well in Moscow last year</b>. — В прошлом году они хорошо играли в Москве.</li></ul><p><b>Начало предложения.</b> Наречия связи и наречия времени могут стоять в начале, наречия связи при этом отделяются запятой.</p><ul><li><b>However,</b> the results were different. — Однако результаты оказались другими.</li><li><b>Therefore,</b> we changed the plan. — Поэтому мы изменили план.</li><li><b>Yesterday</b> she called me twice. — Вчера она звонила мне дважды.</li></ul><p><b>already / yet / still</b> — три соседних по смыслу слова с разными местами:</p><table><thead><tr><th>Слово</th><th>Где употребляется</th><th>Место</th></tr></thead><tbody><tr><td>already (уже)</td><td>утверждение</td><td>перед смысловым глаголом или после be/вспомогательного</td></tr><tr><td>yet (уже / ещё не)</td><td>вопрос и отрицание</td><td>в конце предложения</td></tr><tr><td>still (всё ещё)</td><td>утверждение, вопрос, отрицание</td><td>перед смысловым глаголом, после be</td></tr></tbody></table><ul><li>I have <b>already</b> finished. — Я уже закончил.</li><li>Have you finished <b>yet</b>? — Ты уже закончил?</li><li>He hasn&#x27;t finished <b>yet</b>. — Он ещё не закончил.</li><li>She <b>still</b> works there. — Она всё ещё там работает.</li><li>She is <b>still</b> at work. — Она всё ещё на работе.</li></ul><h3 class=\"prog\">8. Субстантивированные прилагательные</h3><p>Правило: <b>the + прилагательное = вся группа людей; глагол при таком подлежащем стоит во множественном числе.</b></p><ul><li>The <b>rich</b> get richer. — Богатые становятся богаче. (get, не ~~gets~~)</li><li>The <b>unemployed</b> need support. — Безработные нуждаются в поддержке.</li><li>The <b>young</b> are more optimistic. — Молодые настроены более оптимистично.</li><li>The <b>elderly</b> live longer now. — Пожилые живут дольше.</li></ul><p>Так работают: the poor, the rich, the young, the old, the elderly, the disabled, the unemployed, the homeless, the blind.</p><p>Две вещи, на которых ловят:</p><ul><li><b>Окончание -s не добавляется.</b> ~~the riches~~, ~~the unemployeds~~ — неверно (riches существует, но значит «богатства», а не «богатые люди»).</li><li><b>Это всегда группа, а не один человек.</b> Про одного — с существительным: <b>a rich man</b>, <b>an unemployed person</b>, а не ~~a rich~~.</li></ul><p>Отдельно <b>the + национальность</b> на -sh, -ch, -ese: <b>the British</b> — британцы, <b>the French</b> — французы, <b>the Chinese</b> — китайцы. Тоже множественное число: The French <b>are</b> proud of their cuisine.</p><p>Слово unemployed в этом значении встречается в разборе вопроса en-0039 ниже.</p><h3>Ловушки этой темы (из банка)</h3><p><b>en-0016. Her new job started ... enough, on the first of February.</b> — «Её новая работа началась, что весьма кстати, первого февраля». Верно: <b>appropriately</b>.</p><ul><li>appropriate — прилагательное, а определяется глагол started, значит нужна форма на -ly. Это главный признак.</li><li>approximate — не только прилагательное, но и не то слово: «приблизительный».</li><li>alternatively — наречие, форма подходит, но смысл «или же, как вариант» в предложение не встаёт.</li><li>Обрати внимание на порядок: enough стоит после наречия — appropriately enough, это устойчивый оборот «что вполне уместно».</li></ul><p><b>en-0039. ... unemployed.</b> — «Чем лучше человек образован, тем меньше вероятность, что он окажется безработным». Верно: <b>The better educated one is, the less likely one is to be</b>.</p><ul><li>The <b>best</b> educated people will be… — превосходная степень вместо сравнительной, конструкция «чем-тем» так не строится; плюс порядок слов сломан.</li><li>The better educated a person <b>will be</b>… the less <b>unlikely</b> — две ошибки: будущее время (нужен Present Simple) и un-, которое переворачивает смысл на «тем более вероятно».</li><li>The better educated <b>is one</b>, the less likely <b>is he</b> — инверсия. Смысл тот же, но в этой конструкции порядок слов строго прямой: подлежащее, потом глагол.</li></ul><h3>Мини-чек перед ответом</h3><ol><li>В слове уже есть -er или -est? Тогда more и most рядом быть не может.</li><li>Превосходная степень? Поставь the.</li><li>Конструкция «чем …, тем …»? Обе части: the + сравнительная, прямой порядок слов, Present Simple.</li><li>Пропуск относится к глаголу? Ставь форму на -ly. К существительному или после look/seem/feel — прилагательное.</li><li>Enough стоит после прилагательного и наречия, перед существительным.</li><li>Видишь hardly / lately / nearly — проверь, не подменили ли смысл на противоположный.</li><li>Наречие частотности? Перед смысловым глаголом, после be и после первого вспомогательного. Наречие образа действия между глаголом и дополнением не вставляй.</li><li>The + прилагательное — это группа людей: глагол во множественном числе, окончания -s у прилагательного нет.</li></ol>", "6": "<h2>Словообразование и паронимы</h2><p>Эта тема учит узнавать слово по хвосту (какая это часть речи) и не путать близнецов вроде sensitive и sensible — в банке на этом построены все пять вопросов темы.</p><h3>Главная мысль</h3><p>В таких заданиях в пропуск почти всегда лезут четыре слова с одинаковым корнем или похожим звучанием. Побеждает не тот, кто «чувствует язык», а тот, кто задаёт два вопроса подряд:</p><ol><li>Какая часть речи нужна в пропуске? Смотрим на соседей: перед существительным — прилагательное, при глаголе — наречие.</li><li>Какое из похожих слов значит именно то, что нужно по смыслу?</li></ol><p>Часто одного первого вопроса уже хватает: половина вариантов отваливается, потому что они не той части речи.</p><h3>Хвост выдаёт часть речи</h3><h4>Существительное</h4><table><thead><tr><th>Суффикс</th><th>Пример</th><th>Перевод</th></tr></thead><tbody><tr><td>-tion / -sion</td><td>discussion, decision</td><td>обсуждение, решение</td></tr><tr><td>-ation</td><td>valuation, information</td><td>оценка, сведения</td></tr><tr><td>-ment</td><td>development, agreement</td><td>развитие, соглашение</td></tr><tr><td>-ness</td><td>darkness, weakness</td><td>темнота, слабость</td></tr><tr><td>-ity</td><td>ability, similarity</td><td>способность, сходство</td></tr><tr><td>-ance / -ence</td><td>importance, difference</td><td>важность, различие</td></tr><tr><td>-er / -or / -ist</td><td>teacher, investor, socialist</td><td>учитель, инвестор, социалист</td></tr><tr><td>-ship / -hood</td><td>leadership, childhood</td><td>руководство, детство</td></tr></tbody></table><p>Приём: если в пропуске нужно существительное (перед ним стоит артикль, a wide ... of, или оно идёт после as well as рядом с другим существительным), сразу ищи вариант с таким хвостом.</p><h4>Прилагательное</h4><table><thead><tr><th>Суффикс</th><th>Пример</th><th>Перевод</th></tr></thead><tbody><tr><td>-ous / -ious</td><td>laborious, dangerous</td><td>трудоёмкий, опасный</td></tr><tr><td>-ive</td><td>sensitive, effective</td><td>чувствительный, действенный</td></tr><tr><td>-able / -ible</td><td>sociable, sensible</td><td>общительный, разумный</td></tr><tr><td>-al</td><td>social, structural</td><td>общественный, структурный</td></tr><tr><td>-ful / -less</td><td>useful, useless</td><td>полезный, бесполезный</td></tr><tr><td>-ic</td><td>economic, basic</td><td>экономический, базовый</td></tr><tr><td>-y</td><td>hardy, sunny</td><td>выносливый, солнечный</td></tr></tbody></table><h4>Наречие</h4><p>Хвост -ly: appropriately (уместно), easily (легко), hardly (едва). Наречие отвечает на вопрос «как» и цепляется к глаголу: started appropriately, attract more easily.</p><p>Ловушка: -ly бывает и у прилагательных — friendly, lonely, likely, lovely. Но в экзамене это редкость; если выбираешь между appropriate и appropriately при глаголе, бери форму на -ly.</p><h4>Глагол</h4><p>Хвосты -ise / -ize (organise), -ify (simplify), -en (strengthen), -ate (regulate). Глагол узнаётся ещё и по определению: если формулировка начинается с to или сразу с действия (break a law, control and manage), это глагол.</p><h3>Приставки отрицания: почему нет слова «inusual»</h3><p>Отрицательных приставок несколько, и они не взаимозаменяемы. За каждым словом закреплена своя, менять её нельзя.</p><table><thead><tr><th>Приставка</th><th>Где живёт</th><th>Примеры</th></tr></thead><tbody><tr><td>un-</td><td>германские, «обычные» слова</td><td>unusual (необычный), unhappy, unable, unknown</td></tr><tr><td>in-</td><td>латинские корни</td><td>incorrect, invisible, informal, insufficient</td></tr><tr><td>im-</td><td>перед p, b, m</td><td>impossible, impatient, immoral</td></tr><tr><td>il-</td><td>перед l</td><td>illegal, illogical</td></tr><tr><td>ir-</td><td>перед r</td><td>irregular, irresponsible</td></tr><tr><td>dis-</td><td>глаголы и их производные</td><td>disagree, dishonest, disappear</td></tr><tr><td>non-</td><td>нейтральное отрицание</td><td>non-standard, non-profit</td></tr></tbody></table><p>Usual берёт только un-: unusual — необычный. Формы inusual в языке нет вообще, это придуманный экзаменом вариант-обманка (вопрос en-0009). Проверка простая: если приставка перед p/b/m — im-, перед l — il-, перед r — ir-; в остальных сомнительных случаях у бытовых слов почти всегда un-.</p><p>И отдельно: unique — это не отрицание. Un- здесь не приставка, слово целиком значит «единственный в своём роде, неповторимый». Именно оно нужно там, где хвалят: his unique sense of humour — его неповторимое чувство юмора.</p><h3>Паронимы из банка</h3><table><thead><tr><th>Слово</th><th>Перевод</th><th>Пример</th></tr></thead><tbody><tr><td>sensitive</td><td>чувствительный, реагирующий на малейшее воздействие</td><td>an extremely sensitive instrument — крайне чувствительный прибор</td></tr><tr><td>sensible</td><td>здравомыслящий, разумный</td><td>a sensible decision — разумное решение</td></tr><tr><td>sensual</td><td>чувственный, телесный</td><td>sensual pleasure — телесное удовольствие</td></tr><tr><td>sensuous</td><td>приятный для чувств, эстетичный</td><td>sensuous music — музыка, ласкающая слух</td></tr><tr><td>social</td><td>общественный, социальный</td><td>new social facilities — новые общественные заведения</td></tr><tr><td>sociable</td><td>общительный (только о человеке)</td><td>a sociable neighbour — общительный сосед</td></tr><tr><td>socialist</td><td>социалистический</td><td>a socialist party — социалистическая партия</td></tr><tr><td>appropriate</td><td>уместный, подходящий (прилагательное)</td><td>an appropriate answer — уместный ответ</td></tr><tr><td>appropriately</td><td>уместно (наречие)</td><td>appropriately enough — что весьма кстати</td></tr><tr><td>approximate</td><td>приблизительный</td><td>an approximate figure — приблизительная цифра</td></tr><tr><td>hard</td><td>трудный; усердно</td><td>hard work — тяжёлая работа</td></tr><tr><td>hardy</td><td>выносливый, стойкий</td><td>a hardy plant — выносливое растение</td></tr><tr><td>hardly</td><td>едва, почти не (наречие)</td><td>I hardly know him — я его почти не знаю</td></tr><tr><td>laborious</td><td>трудоёмкий, кропотливый</td><td>slow and laborious work — медленная и кропотливая работа</td></tr><tr><td>syllabus</td><td>программа учебного курса</td><td>to cover the syllabus — пройти программу</td></tr><tr><td>syllable</td><td>слог</td><td>a word of three syllables — трёхсложное слово</td></tr><tr><td>channel</td><td>пролив; естественное русло; телеканал</td><td>the English Channel — Ла-Манш</td></tr><tr><td>canal</td><td>канал, прорытый людьми</td><td>the Suez Canal — Суэцкий канал</td></tr><tr><td>unique</td><td>неповторимый</td><td>a unique voice — неповторимый голос</td></tr><tr><td>unusual</td><td>необычный</td><td>an unusual request — необычная просьба</td></tr><tr><td>usual</td><td>обычный, привычный</td><td>the usual place — обычное место</td></tr><tr><td>visual</td><td>зрительный, визуальный</td><td>visual memory — зрительная память</td></tr></tbody></table><h3>Ещё десяток пар, которые любят на экзамене</h3><table><thead><tr><th>Пара</th><th>Перевод и разница</th><th>Пример</th></tr></thead><tbody><tr><td>economic / economical</td><td>экономический (про экономику) / экономный</td><td>economic growth — экономический рост; an economical car — экономичная машина</td></tr><tr><td>historic / historical</td><td>исторический = важный / относящийся к истории</td><td>a historic day — исторический день; historical documents — исторические документы</td></tr><tr><td>effective / efficient</td><td>действенный (даёт результат) / эффективный (без потерь)</td><td>an effective method; an efficient worker</td></tr><tr><td>industrial / industrious</td><td>промышленный / трудолюбивый</td><td>industrial area — промышленный район; an industrious student — трудолюбивый студент</td></tr><tr><td>considerable / considerate</td><td>значительный / внимательный к другим</td><td>a considerable sum; a considerate host</td></tr><tr><td>literal / literary / literate</td><td>буквальный / литературный / грамотный</td><td>a literal translation; a literary style; a literate adult</td></tr><tr><td>respectable / respectful / respective</td><td>приличный / почтительный / соответствующий</td><td>a respectable job; a respectful tone; their respective rooms</td></tr><tr><td>successful / successive</td><td>успешный / следующий один за другим</td><td>a successful launch; three successive years</td></tr><tr><td>personal / personnel</td><td>личный / персонал</td><td>personal data; the personnel department</td></tr><tr><td>principal / principle</td><td>главный; директор / принцип</td><td>the principal reason; a matter of principle</td></tr><tr><td>lie / lay</td><td>лежать / класть</td><td>to lie on the sofa; to lay the table</td></tr><tr><td>raise / rise</td><td>поднимать что-то / подниматься самому</td><td>to raise prices; prices rise</td></tr><tr><td>affect / effect</td><td>влиять (глагол) / следствие (существительное)</td><td>it affects sales; the effect on sales</td></tr><tr><td>advice / advise</td><td>совет (сущ.) / советовать (глагол)</td><td>good advice; I advise you to wait</td></tr><tr><td>practice / practise</td><td>практика (сущ.) / практиковаться (глагол)</td><td>daily practice; to practise English</td></tr></tbody></table><h3>Ловушки этой темы</h3><p>Обманка «слова не существует». В en-0009 среди вариантов стоит inusual. Такого слова нет — это склеенная из in- и usual пустышка. Так же работают make in, make through, sort about, sort off в других вопросах. Если форма выглядит логично, но вы её никогда не видели, это скорее всего ловушка.</p><p>Разница в одну букву меняет всё. В en-0007 выбирают между syllabus и syllable. Cover the rest of the syllabus — пройти остаток программы курса; со «слогом» предложение просто не имеет смысла. Держите в голове: если два варианта отличаются одной буквой, значит именно на них и рассчитана ошибка.</p><p>Прилагательное вместо наречия. В en-0038 hardly выглядит как «трудно» — по-русски напрашивается «трудная работа». Но hardly значит «едва», и это наречие, а перед work нужно прилагательное. Подходит laborious, от labour — «труд».</p><p>Свойство человека приписывают предмету. В en-0011 sociable значит «общительный», и так говорят только о людях. Facilities (здания, площадки) общительными не бывают, поэтому social facilities — общественные заведения.</p><p>Прибор и человек. В en-0027 сейсмограф — sensitive: он реагирует на слабейшие толчки. Sensible — про голову, а не про технику: sensible person, sensible advice.</p><p>Природа или люди. В en-0003 подсказка спрятана в was built. Построить можно только рукотворное, поэтому the Suez Canal. Channel — то, что промыла сама вода.</p><h3>Как проверять себя за 10 секунд</h3><ul><li>Посмотрите на слово справа и слева от пропуска. Есть существительное справа — нужно прилагательное. Есть глагол слева — нужно наречие на -ly.</li><li>Отбросьте всё, что не той части речи. Обычно остаётся два варианта.</li><li>Из двух выбирайте по смыслу, переведя каждый вслух: «крайне разумный прибор» звучит нелепо, значит остаётся «чувствительный».</li><li>Если один вариант вы никогда не встречали, скорее всего его не существует.</li></ul>", "7": "<h2>Лексика и устойчивые сочетания</h2><p>Самая большая тема банка: десять вопросов, где всё решает не грамматика, а то, какие слова в английском ходят парами и какой предлог за каким словом закреплён.</p><h3>Главная мысль</h3><p>В английском огромная часть речи собрана из готовых блоков. Reach a peak, a wide range of, sort out, objection to — это не свободные сочетания, где можно подставить синоним. Каждый блок либо стоит целиком, либо не стоит вовсе.</p><p>Отсюда стратегия: не переводите пропуск с русского. Ищите слово, которое стоит рядом с пропуском, и вспоминайте, с чем оно обычно ходит. В en-0035 подсказка — слово peak, в en-0030 — слово wide, в en-0003 — слово built.</p><h3>Фразовые глаголы</h3><p>Фразовый глагол — это глагол плюс маленькое слово, и вместе они значат совсем не то, что по отдельности. Частица несёт смысл, поэтому её и спрашивают.</p><h4>Из банка</h4><table><thead><tr><th>Глагол</th><th>Перевод</th><th>Пример</th></tr></thead><tbody><tr><td>make out</td><td>разобрать, различить, расслышать</td><td>I couldn&#x27;t make out what they were talking about — я не мог разобрать, о чём они говорили</td></tr><tr><td>sort out</td><td>уладить, разобраться, привести в порядок</td><td>I&#x27;m trying to sort things out with IT — я пытаюсь утрясти дела с ИТ-отделом</td></tr><tr><td>put down</td><td>записать, занести на бумагу</td><td>It is useful to put down the most important points — полезно записывать самые важные мысли</td></tr><tr><td>come from</td><td>быть родом из</td><td>Where do you come from? — откуда вы родом?</td></tr><tr><td>point out</td><td>указать на, отметить</td><td>to point out drawbacks — указывать на недостатки</td></tr></tbody></table><h4>Что значат частицы</h4><p>Out — «наружу, до полной ясности»: make out (выудить смысл), sort out (вытащить порядок наружу), work out (вычислить), figure out (додуматься), find out (выяснить), carry out (выполнить). Если по смыслу нужно «разобраться до конца», почти наверняка out.</p><p>Down — «вниз, на бумагу»: put down, write down, note down, take down (все — записать); также cut down (сократить), break down (сломаться).</p><p>Up — «до конца, полностью»: give up (бросить), set up (учредить), take up (взяться за), come up with (придумать), bring up (воспитать; поднять тему).</p><p>On / off — «включить / выключить, продолжить / уйти»: carry on (продолжать), get on with (ладить), call off (отменить), put off (отложить), make off (сбежать).</p><h4>Ещё десяток рабочих</h4><table><thead><tr><th>Глагол</th><th>Перевод</th><th>Пример</th></tr></thead><tbody><tr><td>look into</td><td>изучить, разобраться в вопросе</td><td>We&#x27;ll look into the problem — мы изучим вопрос</td></tr><tr><td>deal with</td><td>иметь дело с, заниматься</td><td>to deal with complaints — заниматься жалобами</td></tr><tr><td>bring about</td><td>вызвать, повлечь</td><td>to bring about changes — повлечь перемены</td></tr><tr><td>turn out</td><td>оказаться</td><td>It turned out to be true — это оказалось правдой</td></tr><tr><td>put forward</td><td>выдвинуть (идею, предложение)</td><td>to put forward a proposal — выдвинуть предложение</td></tr><tr><td>take over</td><td>принять управление, поглотить компанию</td><td>to take over a firm — поглотить фирму</td></tr><tr><td>set up</td><td>учредить, создать</td><td>to set up a company — создать компанию</td></tr><tr><td>draw up</td><td>составить (документ)</td><td>to draw up a contract — составить договор</td></tr><tr><td>account for</td><td>объяснять; составлять долю</td><td>Exports account for 40% — экспорт составляет 40%</td></tr><tr><td>deal in</td><td>торговать чем-либо</td><td>They deal in used cars — они торгуют подержанными машинами</td></tr></tbody></table><h3>Глагол плюс существительное: пары, которые нельзя разлучать</h3><table><thead><tr><th>Сочетание</th><th>Перевод</th><th>Комментарий</th></tr></thead><tbody><tr><td>reach a peak</td><td>достичь пика</td><td>без предлога; пика именно достигают, а не «растут его»</td></tr><tr><td>take into account</td><td>принять во внимание</td><td>take something into account, часто в форме taking</td></tr><tr><td>give a piece of advice</td><td>дать совет</td><td>advice неисчисляемо, поэтому считаем «кусками»</td></tr><tr><td>build rapport</td><td>наладить контакт, установить доверие</td><td>build rapport with a client — расположить к себе клиента</td></tr><tr><td>make a decision</td><td>принять решение</td><td>не take, если это британо-нейтральный вариант; take a decision тоже встречается</td></tr><tr><td>make suggestions</td><td>вносить предложения</td><td>make constructive suggestions — вносить конструктивные предложения</td></tr><tr><td>cover the syllabus</td><td>пройти программу курса</td><td>cover здесь — «охватить материал»</td></tr><tr><td>do research</td><td>проводить исследование</td><td>не make research</td></tr><tr><td>pay attention to</td><td>обращать внимание на</td><td>pay attention to details</td></tr><tr><td>take steps / take measures</td><td>предпринимать шаги / меры</td><td></td></tr><tr><td>meet the requirements</td><td>отвечать требованиям</td><td></td></tr><tr><td>set a target</td><td>поставить цель</td><td></td></tr><tr><td>raise a question</td><td>поднять вопрос</td><td></td></tr><tr><td>draw a conclusion</td><td>сделать вывод</td><td></td></tr><tr><td>play a role</td><td>играть роль</td><td>play a key role — играть ключевую роль</td></tr></tbody></table><p>Про рост и падение, потому что это любимая тема экзаменационных графиков:</p><table><thead><tr><th>Слово</th><th>Как ведёт себя</th><th>Пример</th></tr></thead><tbody><tr><td>rise</td><td>само поднимается, без дополнения</td><td>Prices rose sharply — цены резко выросли</td></tr><tr><td>increase</td><td>само растёт или что-то увеличивают</td><td>Sales increased by 5% — продажи выросли на 5%</td></tr><tr><td>reach</td><td>требует дополнения после себя</td><td>Figures reached a peak — показатели достигли пика</td></tr><tr><td>fall / drop / decline</td><td>падать</td><td>Demand fell — спрос упал</td></tr><tr><td>a wide range of</td><td>широкий выбор чего-либо</td><td>a wide range of subjects — широкий выбор предметов</td></tr></tbody></table><h3>Управление предлогами</h3><p>Предлог закреплён за словом. Русский предлог тут не помогает и часто мешает.</p><table><thead><tr><th>Сочетание</th><th>Перевод</th><th>Пример</th></tr></thead><tbody><tr><td>aware of</td><td>осведомлённый о</td><td>I&#x27;m aware of the risk — я знаю о риске</td></tr><tr><td>objection to</td><td>возражение против</td><td>any objections to signing — возражения против подписания</td></tr><tr><td>suffer from</td><td>страдать от, испытывать</td><td>The business is suffering from problems</td></tr><tr><td>belong to</td><td>принадлежать</td><td>This money belongs to the fund</td></tr><tr><td>depend on</td><td>зависеть от</td><td>It depends on the price</td></tr><tr><td>result in / result from</td><td>приводить к / быть следствием</td><td>Delays resulted in losses</td></tr><tr><td>responsible for</td><td>ответственный за</td><td>responsible for sales</td></tr><tr><td>interested in</td><td>заинтересованный в</td><td>interested in the offer</td></tr><tr><td>capable of</td><td>способный на</td><td>capable of change</td></tr><tr><td>similar to / different from</td><td>похожий на / отличный от</td><td>similar to ours; different from ours</td></tr><tr><td>consist of</td><td>состоять из</td><td>The team consists of five people</td></tr><tr><td>insist on</td><td>настаивать на</td><td>He insisted on paying</td></tr><tr><td>succeed in</td><td>преуспеть в</td><td>She succeeded in finding a job</td></tr><tr><td>reason for</td><td>причина чего-либо</td><td>the reason for the delay</td></tr><tr><td>increase in / decrease in</td><td>рост / снижение чего-либо</td><td>an increase in prices</td></tr></tbody></table><p>Правило-выручалочка: если после слова стоит предлог to или on, а дальше идёт действие, действие принимает форму -ing: objection to signing, insist on paying, look forward to meeting. Проверка — подставьте «it»: objection to it звучит нормально, значит to здесь предлог, а не частица инфинитива.</p><h3>Слова, которые путают по смыслу</h3><table><thead><tr><th>Слово</th><th>Перевод</th><th>Пример</th></tr></thead><tbody><tr><td>severe</td><td>серьёзный, тяжёлый (о проблеме, боли, погоде)</td><td>severe cash flow problems — серьёзные проблемы с денежным потоком</td></tr><tr><td>obscure</td><td>неясный, малоизвестный</td><td>an obscure author</td></tr><tr><td>obstinate</td><td>упрямый</td><td>an obstinate child</td></tr><tr><td>similarities</td><td>черты сходства</td><td>differences and similarities</td></tr><tr><td>likelihood</td><td>вероятность</td><td>the likelihood of success</td></tr><tr><td>coverage</td><td>охват, освещение темы</td><td>media coverage</td></tr><tr><td>alike</td><td>похожий; одинаково — но не существительное</td><td>They look alike</td></tr><tr><td>drawbacks</td><td>недостатки, минусы</td><td>the drawbacks of the plan</td></tr><tr><td>advantages</td><td>преимущества</td><td>the advantages of the plan</td></tr><tr><td>range</td><td>набор, диапазон, выбор</td><td>a wide range of subjects</td></tr><tr><td>field</td><td>область, сфера</td><td>the field of medicine</td></tr><tr><td>house</td><td>дом как здание</td><td>somewhere in the house — где-то в доме</td></tr><tr><td>home</td><td>дом как очаг, наречие «дома»</td><td>to go home; at home</td></tr><tr><td>canal</td><td>рукотворный канал</td><td>the Suez Canal</td></tr><tr><td>channel</td><td>пролив, естественное русло, телеканал</td><td>a TV channel</td></tr></tbody></table><h3>Ловушки этой темы</h3><p>Ищите смысловой якорь в предложении. В en-0003 таким якорем стало was built: строят только рукотворное, значит canal, а не channel, bay или gulf. В en-0035 якорь — слово peak: с ним ходит только reach, потому что rose и increased не берут дополнение.</p><p>Противопоставление подсказывает антоним. В en-0034 стоит rather than: «вносить конструктивные предложения, а не просто указывать на ...». Раз левая часть положительная, правая должна быть отрицательной, поэтому drawbacks, а не advantages. Тот же приём в en-0014, только наоборот: as well as соединяет равное с равным, differences притягивает similarities.</p><p>Похожее по звучанию не значит похожее по смыслу. В en-0014 варианты alike и likelihood звучат «в тему», но alike вообще не существительное, а likelihood — про вероятность, а не про сходство.</p><p>Несуществующие фразовые глаголы. В en-0028 три варианта из четырёх (sort about, sort off, sort on) в языке не существуют. Не пытайтесь их перевести — просто вычёркивайте.</p><p>Предлог в вопросе должен вернуться в ответе. В en-0004 ответ звучит I&#x27;m from Chile, и это прямая подсказка: в вопросе тоже нужен from, то есть come from, а не come to.</p><p>House и home. В en-0025 речь о местонахождении внутри здания, поэтому in the house. Home — наречие, оно вообще не берёт предлог (go home), а in the home значит «в быту, в домашней обстановке» вообще.</p><p>Русская логика подводит с записью. В en-0029 хочется поставить write on, но write on — это «писать на поверхности» или «продолжать писать». Записать = put down или write down.</p><h3>Как тренироваться</h3><ul><li>Учите не отдельные слова, а блоки целиком: не reach и peak, а reach a peak.</li><li>Читая вариант, произносите его вслух вместе с соседним словом. Неестественное сочетание слышно сразу.</li><li>Каждое новое слово записывайте с предлогом, который за ним закреплён: не aware, а aware of.</li></ul>", "8": "<h2>Соответствие: дефиниции понятий</h2><p>Восемь вопросов банка устроены одинаково: четыре понятия, шесть определений, и два определения гарантированно останутся без пары.</p><h3>Как устроено задание</h3><p>Вам дают список из четырёх слов (плюс сам знак «-» как пятый пункт) и шесть английских определений. К каждому определению нужно подобрать слово из списка. Слов меньше, чем определений, поэтому ровно две строки получат прочерк.</p><p>Это не подвох и не ошибка составителя. Два лишних определения описывают слова, которых в списке просто нет: в en-0002 это prediction и to contradict, в en-0008 — feature и influence, в en-0015 — acculturation и franchise.</p><h3>Единственно правильный порядок действий</h3><ol><li>Читаете определение и, не заглядывая в список, называете слово сами. Хотя бы по-русски.</li><li>Ищете это слово в списке. Нашли — ставите. Не нашли — прочерк.</li><li>Начинаете с определений, которые поняли сразу. Оставшиеся распределяются методом исключения.</li></ol><p>Обратный путь (взять слово и искать под него определение) работает хуже: похожих определений в списке несколько, и вы уговорите себя, что подходит любое.</p><h3>Первое слово определения выдаёт часть речи</h3><p>Это самый быстрый фильтр. Посмотрите на начало формулировки.</p><table><thead><tr><th>Начало определения</th><th>Что описывается</th><th>Пример из банка</th></tr></thead><tbody><tr><td>a process / an act / the act of</td><td>существительное-процесс</td><td>the process of assessing the value of a business — valuation</td></tr><tr><td>a person / someone who</td><td>человек</td><td></td></tr><tr><td>an amount / a number / a level</td><td>количество, показатель</td><td>an amount or level that can be measured — degree</td></tr><tr><td>a way of doing something</td><td>способ, порядок</td><td>a way of doing something, especially the correct way — procedure</td></tr><tr><td>the range / the character / the speed</td><td>свойство, качество</td><td>the speed at which somebody moves — pace</td></tr><tr><td>to say / to make somebody / без артикля сразу глагол</td><td>глагол</td><td>to say the opposite of what someone has said — to contradict</td></tr><tr><td>прилагательное сразу (existing, having, relating to)</td><td>прилагательное</td><td>relating to the way parts of a system are arranged — structural</td></tr></tbody></table><p>Отсюда два сильных приёма.</p><p>Приём первый. Если все понятия в списке — существительные, а определение начинается с to say или break a law, значит описывается глагол, и пары не будет. Так решается строка 6 в en-0002.</p><p>Приём второй, зеркальный. Если все понятия — прилагательные (en-0037: common, internal, key, structural), а определение звучит как a particular way of thinking, то есть описывает существительное, — это прочерк.</p><h3>Словарь понятий из банка</h3><h4>Учёба и университет</h4><table><thead><tr><th>Слово</th><th>Перевод</th><th>Типичное определение</th></tr></thead><tbody><tr><td>lecture</td><td>лекция</td><td>a formal talk on a serious subject given to a group of people, especially students</td></tr><tr><td>seminar</td><td>семинар</td><td>an occasion when a teacher and a group of people meet to study and discuss something</td></tr><tr><td>semester</td><td>семестр</td><td>one of the periods into which a year is divided at a college or university</td></tr><tr><td>graduation</td><td>выпуск, вручение дипломов</td><td>a ceremony in which degree certificates are given to graduates</td></tr><tr><td>research</td><td>исследование</td><td>systematic investigation to establish facts</td></tr><tr><td>analysis</td><td>анализ, разбор</td><td>a careful examination of something in order to understand it better</td></tr><tr><td>discussion</td><td>обсуждение</td><td>the examination or consideration of a matter in speech or writing</td></tr><tr><td>scope</td><td>охват, рамки темы</td><td>the range of a subject covered by a book, programme, class</td></tr></tbody></table><h4>Бизнес и экономика</h4><table><thead><tr><th>Слово</th><th>Перевод</th><th>Типичное определение</th></tr></thead><tbody><tr><td>corporation</td><td>корпорация, юридическое лицо</td><td>a legal entity separate from the persons who own or operate it</td></tr><tr><td>valuation</td><td>оценка стоимости (процесс)</td><td>the process of assessing or determining the value of a business</td></tr><tr><td>value</td><td>стоимость, ценность</td><td>how much something is worth in money or other goods</td></tr><tr><td>negotiation</td><td>переговоры</td><td>a conversation between two or more people with the intention to arrive at a mutual agreement</td></tr><tr><td>administration</td><td>управление, административная работа</td><td>the activities that relate to running a company or organization</td></tr><tr><td>growth</td><td>рост</td><td>an increase in the size or the importance of something</td></tr><tr><td>prospect</td><td>перспектива</td><td>the possibility of future success</td></tr><tr><td>indicator</td><td>показатель</td><td>a number or ratio derived from a series of observed facts</td></tr><tr><td>ratio</td><td>соотношение</td><td>a relationship between the sizes of two numbers or amounts</td></tr><tr><td>degree</td><td>степень, уровень</td><td>an amount or level that can be measured or compared to another</td></tr><tr><td>pace</td><td>темп, скорость</td><td>the speed at which somebody or something walks, runs or moves</td></tr><tr><td>procedure</td><td>порядок действий, процедура</td><td>a way of doing something, especially the correct or usual way</td></tr><tr><td>factor</td><td>фактор</td><td>anything that contributes causally to a result</td></tr></tbody></table><h4>Общие понятия</h4><table><thead><tr><th>Слово</th><th>Перевод</th><th>Типичное определение</th></tr></thead><tbody><tr><td>information</td><td>сведения, информация</td><td>facts or details that tell you something about a situation, person or event</td></tr><tr><td>tendency</td><td>тенденция</td><td>a general change or development in a particular direction</td></tr><tr><td>atmosphere</td><td>атмосфера, настроение</td><td>the character, feeling, or mood of a place or situation</td></tr></tbody></table><h4>Глаголы</h4><table><thead><tr><th>Слово</th><th>Перевод</th><th>Типичное определение</th></tr></thead><tbody><tr><td>govern</td><td>управлять страной, территорией</td><td>control and manage an area, city, or country and its people</td></tr><tr><td>breach</td><td>нарушить (закон, договор)</td><td>break a law, rule, or agreement</td></tr><tr><td>trace</td><td>выследить, разыскать</td><td>find someone or something you are looking for by asking questions and getting information</td></tr><tr><td>embarrass</td><td>смутить, поставить в неловкое положение</td><td>make someone feel nervous, ashamed, or stupid in a social situation</td></tr></tbody></table><h4>Прилагательные</h4><table><thead><tr><th>Слово</th><th>Перевод</th><th>Типичное определение</th></tr></thead><tbody><tr><td>common</td><td>общий, распространённый</td><td>the same in a lot of places or for a lot of people</td></tr><tr><td>key</td><td>ключевой</td><td>very important and having a lot of influence on other people or things</td></tr><tr><td>internal</td><td>внутренний</td><td>existing or happening inside a person, object, organization or country</td></tr><tr><td>structural</td><td>структурный</td><td>relating to the way in which parts of a system or object are arranged</td></tr></tbody></table><h3>Слова, которыми экзамен создаёт лишние определения</h3><p>Их в списке никогда не было — но узнать их полезно, чтобы уверенно ставить прочерк, а не сомневаться.</p><table><thead><tr><th>Слово</th><th>Перевод</th><th>Определение, под которое оно подходило</th></tr></thead><tbody><tr><td>prediction</td><td>предсказание, прогноз</td><td>a statement about what you think is going to happen</td></tr><tr><td>contradict</td><td>возражать, противоречить</td><td>to say the opposite of what someone else has said</td></tr><tr><td>feature</td><td>характерная черта</td><td>a typical quality or an important part of something</td></tr><tr><td>influence</td><td>влияние</td><td>the power to have an effect on people or things</td></tr><tr><td>acculturation</td><td>усвоение чужой культуры</td><td>the process of incorporating traditional values and beliefs</td></tr><tr><td>franchise</td><td>франшиза</td><td>an exclusive license given to franchise companies</td></tr><tr><td>escalate</td><td>обостряться</td><td>become, or make something become, much worse or more serious</td></tr><tr><td>decrease / reduction</td><td>снижение</td><td>the process of something becoming less</td></tr><tr><td>rate</td><td>ставка, размер оплаты; частота</td><td>an amount or level of payment</td></tr><tr><td>frequency</td><td>частота</td><td>the number of repetitions of a periodic process in a unit of time</td></tr><tr><td>portion / proportion</td><td>доля</td><td>a part or share of a whole</td></tr><tr><td>speculation</td><td>домысел</td><td>a message expressing an opinion based on incomplete evidence</td></tr><tr><td>dispute / controversy</td><td>спор, разногласие</td><td>strong disagreement</td></tr><tr><td>creative</td><td>творческий</td><td>having a lot of ideas and enthusiasm</td></tr><tr><td>rationale / common sense</td><td>здравый подход</td><td>a particular way of thinking, based on good judgement</td></tr></tbody></table><h3>Пары, которые важно различать</h3><table><thead><tr><th>Пара</th><th>Разница</th></tr></thead><tbody><tr><td>value / valuation</td><td>value — сколько стоит; valuation — процедура оценки. Суффикс -ation почти всегда означает процесс</td></tr><tr><td>growth / scope</td><td>growth измеряет увеличение, scope очерчивает границы темы</td></tr><tr><td>factor / indicator</td><td>factor влияет на результат (причина), indicator измеряет (число на шкале)</td></tr><tr><td>ratio / rate</td><td>ratio — отношение двух чисел (2:1), rate — ставка или частота</td></tr><tr><td>degree / degree</td><td>как уровень (a high degree of risk) и как диплом (a university degree)</td></tr><tr><td>lecture / seminar</td><td>lecture — говорит один, seminar — обсуждают вместе</td></tr><tr><td>discussion / negotiation</td><td>discussion — разбор вопроса, negotiation — переговоры ради соглашения</td></tr><tr><td>administration / government</td><td>administration — управление организацией, government — управление страной</td></tr><tr><td>information / data</td><td>information — сведения в человеческом виде, data — цифры и записи</td></tr></tbody></table><h3>Ловушки этой темы</h3><p>Кажется, что прочерк только один. В условии сказано «понятие, которое не имеет определения», в единственном числе, и рука тянется поставить один прочерк. Но понятий четыре, а определений шесть, поэтому прочерков всегда два. Так во всех восьми вопросах банка.</p><p>Похожие по теме определения. В en-0021 growth (увеличение) и первая строка про decrease (уменьшение) — про одно и то же измерение, только в разные стороны. Читайте до конца: becoming less это не growth.</p><p>Однокоренные слова в одном задании. В en-0015 стоят и value, и valuation. Определение the process of assessing... начинается со слова process, значит это valuation; how much something is worth — это value.</p><p>Определение описывает слово другой части речи. В en-0037 строка a particular way of thinking описывает существительное, а в списке одни прилагательные. В en-0002 строка to say the opposite описывает глагол, а в списке одни существительные. В обоих случаях — прочерк.</p><p>Слово знакомо, но не в этом значении. Key в en-0037 стоит не как «ключ», а как прилагательное «ключевой». Breach в en-0020 — не «брешь», а глагол «нарушить». Trace — не «след», а «выследить». Смотрите на форму определения: если оно описывает действие, слово тоже глагол.</p><p>Влияние встречается дважды и оба раза лишнее. Определения про influence были и в en-0008, и в en-0020, и оба раза слова influence в списке не оказалось. Если что-то описывает «влиять / способность влиять», сначала проверьте список — скорее всего это прочерк.</p><h3>Порядок действий на экзамене</h3><ul><li>Пробегите список из четырёх слов и определите, какая это часть речи: все существительные, все глаголы или все прилагательные.</li><li>Вычеркните определения, которые описывают другую часть речи — это готовые прочерки.</li><li>Из оставшихся сначала берите те, где узнали слово мгновенно.</li><li>Последние два-три распределяйте по ключевому слову в начале определения: process, amount, way, speed.</li><li>Проверьте в конце: прочерков должно быть ровно два.</li></ul>", "9": "<h2>Числительные, даты и величины</h2><p>Тексты на экзамене экономические и академические, поэтому числа там на каждом шагу: проценты, доли, годы, статистика роста. Тема в программе заявлена отдельным пунктом, а ошибки в ней самые обидные — грамматика простая, но правила противоположны русским.</p><h3 class=\"prog\">1. Количественные числительные</h3><p>Правило: <b>количественное числительное отвечает на вопрос «сколько» и в английском почти не меняется по форме.</b></p><table><thead><tr><th>Разряд</th><th>Как</th></tr></thead><tbody><tr><td>1–12</td><td>one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve</td></tr><tr><td>13–19</td><td>thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen (окончание <b>-teen</b>)</td></tr><tr><td>20–90</td><td>twenty, thirty, forty, fifty, sixty, seventy, eighty, ninety (окончание <b>-ty</b>)</td></tr><tr><td>Сотни и больше</td><td>hundred, thousand, million, billion</td></tr></tbody></table><p>Три мелочи написания, на которых теряют баллы:</p><ul><li><b>forty</b> без u (не ~~fourty~~), <b>fifteen</b> и <b>fifty</b> через f (не ~~fiveteen~~), <b>ninety</b> с e (не ~~ninty~~).</li><li>Составное число от 21 до 99 пишется <b>через дефис</b>: twenty-three, forty-five, ninety-nine.</li><li>В британском варианте между сотнями и остатком ставится <b>and</b>: two hundred <b>and</b> fifty, one thousand <b>and</b> five. В американском and часто опускают, но в экзаменационных текстах ждут британскую норму.</li></ul><p>Слушай на слух разницу: thir<b>teen</b> (13) — ударение на конец, <b>thir</b>ty (30) — на начало.</p><h3 class=\"prog\">2. Главное правило экзамена: hundred без -s</h3><p>Правило: <b>hundred, thousand, million, billion не получают -s, если перед ними стоит число или количество.</b></p><ul><li>Two <b>hundred</b> people attended the conference. — Двести человек присутствовали на конференции. (не ~~two hundreds~~)</li><li>The company employs five <b>thousand</b> workers. — В компании работают пять тысяч сотрудников.</li><li>The project cost three <b>million</b> dollars. — Проект стоил три миллиона долларов.</li></ul><p>Но в обороте с <b>of</b>, когда точного числа нет, -s обязательно:</p><table><thead><tr><th>С числом (без -s)</th><th>Без числа, с of (с -s)</th></tr></thead><tbody><tr><td>two hundred people</td><td><b>hundreds of</b> people — сотни людей</td></tr><tr><td>five thousand dollars</td><td><b>thousands of</b> dollars — тысячи долларов</td></tr><tr><td>ten million users</td><td><b>millions of</b> users — миллионы пользователей</td></tr><tr><td>—</td><td><b>dozens of</b> cases — десятки случаев</td></tr></tbody></table><p>Проверка простая: если слева стоит цифра — -s нет; если справа стоит of и точного числа нет — -s есть. Смешивать нельзя: ~~two hundreds of people~~ и ~~hundred of people~~ — оба варианта неверны.</p><h3 class=\"prog\">3. Порядковые числительные</h3><p>Правило: <b>порядковое числительное отвечает на «который по счёту», образуется прибавлением -th и почти всегда идёт с артиклем the.</b></p><table><thead><tr><th>Количественное</th><th>Порядковое</th><th>Комментарий</th></tr></thead><tbody><tr><td>one</td><td><b>first</b></td><td>неправильное</td></tr><tr><td>two</td><td><b>second</b></td><td>неправильное</td></tr><tr><td>three</td><td><b>third</b></td><td>неправильное</td></tr><tr><td>five</td><td><b>fifth</b></td><td>v меняется на f</td></tr><tr><td>eight</td><td><b>eighth</b></td><td>одна t</td></tr><tr><td>nine</td><td><b>ninth</b></td><td>e выпадает</td></tr><tr><td>twelve</td><td><b>twelfth</b></td><td>ve меняется на f</td></tr><tr><td>twenty</td><td><b>twentieth</b></td><td>-y меняется на <b>-ieth</b></td></tr><tr><td>four, six, ten</td><td>fourth, sixth, tenth</td><td>обычное -th</td></tr></tbody></table><ul><li>The <b>third</b> quarter showed a rise in profits. — Третий квартал показал рост прибыли.</li><li>This is <b>the first</b> time I have seen these figures. — Я впервые вижу эти цифры.</li></ul><p>Сокращённая запись берёт две последние буквы слова: 1<b>st</b>, 2<b>nd</b>, 3<b>rd</b>, 4<b>th</b>, 11<b>th</b>, 21<b>st</b>, 22<b>nd</b>.</p><p>В составном числительном порядковым становится <b>только последнее слово</b>: the twenty-<b>first</b> century, the thirty-<b>second</b> page. Не ~~the twentieth-first~~.</p><h3 class=\"prog\">4. Дроби и десятичные</h3><p>Правило: <b>в простой дроби числитель — количественное, знаменатель — порядковое, и во множественном числе знаменатель получает -s.</b></p><ul><li>1/3 — one <b>third</b> — одна треть</li><li>2/3 — two <b>thirds</b> — две трети</li><li>3/5 — three <b>fifths</b> — три пятых</li><li>1/2 — a <b>half</b> (не ~~a second~~), 1/4 — a <b>quarter</b>, 3/4 — three <b>quarters</b></li></ul><p>Десятичные читаются через слово <b>point</b>, а цифры после точки называются <b>по одной</b>:</p><table><thead><tr><th>Запись</th><th>Чтение</th></tr></thead><tbody><tr><td>3.5</td><td>three <b>point</b> five</td></tr><tr><td>0.25</td><td>nought point two five (брит.) / zero point two five (амер.)</td></tr><tr><td>12.75</td><td>twelve point seven five (не ~~seventy-five~~)</td></tr></tbody></table><p>Главная ловушка для русскоговорящего — <b>знаки препинания в числах перевёрнуты</b>:</p><ul><li>Десятичный разделитель в английском — <b>точка</b>: 3.5 = «три целых пять десятых».</li><li>Запятая отделяет <b>разряды тысяч</b>: 1,250.75 = одна тысяча двести пятьдесят целых семьдесят пять сотых.</li></ul><p>То есть английское 1,250 — это тысяча двести пятьдесят, а вовсе не «одна целая двести пятьдесят».</p><h3 class=\"prog\">5. Смешанные величины и проценты</h3><p>Правило: <b>дробная часть присоединяется через and, а per cent во множественном числе не меняется.</b></p><ul><li><b>two and a half</b> million — два с половиной миллиона</li><li><b>one and a quarter</b> hours — час с четвертью</li><li>5% — <b>five per cent</b> (брит.) / five percent (амер.), но не ~~five per cents~~</li></ul><p>Предлоги при росте и падении — их спрашивают чаще всего:</p><table><thead><tr><th>Оборот</th><th>Значение</th></tr></thead><tbody><tr><td>rose <b>by</b> 5%</td><td>вырос <b>на</b> 5% (величина изменения)</td></tr><tr><td>rose <b>to</b> 5%</td><td>вырос <b>до</b> 5% (конечный уровень)</td></tr><tr><td>rose <b>from</b> 3% <b>to</b> 5%</td><td>вырос с 3% до 5%</td></tr><tr><td>a 5% increase <b>in</b> prices</td><td>рост цен на 5% (после increase / decrease / rise / fall — предлог <b>in</b>)</td></tr></tbody></table><ul><li>Unemployment fell <b>by</b> two per cent last year. — Безработица снизилась на два процента за прошлый год.</li><li>Prices rose <b>from</b> three <b>to</b> five per cent. — Цены выросли с трёх до пяти процентов.</li></ul><p>Кратность:</p><ul><li><b>twice as much</b> as last year — вдвое больше, чем в прошлом году</li><li><b>three times higher</b> than average — втрое выше среднего</li><li><b>half as much</b> — вдвое меньше</li></ul><p>Обрати внимание: «в два раза» — это twice, а не ~~two times~~; со three и дальше уже times.</p><h3 class=\"prog\">6. Даты, годы и время</h3><p>Правило: <b>год читается по два разряда, а перед датой и годом стоит in, перед числом месяца — on.</b></p><table><thead><tr><th>Запись</th><th>Чтение</th></tr></thead><tbody><tr><td>1995</td><td>nineteen ninety-five</td></tr><tr><td>1900</td><td>nineteen hundred</td></tr><tr><td>2005</td><td>two thousand <b>and</b> five</td></tr><tr><td>2025</td><td>twenty twenty-five (или two thousand and twenty-five)</td></tr></tbody></table><ul><li>Десятилетие: <b>the 1990s</b> — the nineteen nineties, «девяностые». Апостроф не нужен: не ~~1990&#x27;s~~.</li><li>Век: <b>the 21st century</b> — the twenty-first century, обязательно с the.</li></ul><p>Формат самой даты различается:</p><ul><li>Британский: <b>5 May 2025</b> — the fifth of May, two thousand and twenty-five.</li><li>Американский: <b>May 5, 2025</b> — May fifth.</li></ul><p>Отсюда ловушка цифровой записи: <b>05/06</b> в британском варианте — 5 июня, в американском — 6 мая. В экзаменационных текстах ориентируйся на британский порядок «день-месяц-год».</p><p>Предлоги времени:</p><ul><li><b>in</b> 2025, <b>in</b> May, <b>in</b> the 1990s, <b>in</b> the 21st century — год, месяц, десятилетие, век;</li><li><b>on</b> 5 May, <b>on</b> Monday — конкретный день;</li><li><b>at</b> five o&#x27;clock, <b>at</b> midnight — точное время.</li></ul><h3 class=\"prog\">7. Согласование числительного с существительным</h3><p>Правило: <b>числительное перед существительным-определением ставится через дефис, и существительное остаётся в единственном числе.</b></p><ul><li>a <b>five-year</b> plan — пятилетний план (но: the plan will last five <b>years</b>)</li><li>a <b>ten-minute</b> break — десятиминутный перерыв (но: the break lasts ten <b>minutes</b>)</li><li>a <b>twenty-dollar</b> note — двадцатидолларовая купюра</li></ul><p>Ошибка: ~~a five-years plan~~, ~~a ten minutes break~~. Признак определения — оно стоит <b>перед</b> существительным и после артикля.</p><p>Отдельно два похожих оборота с разным согласованием:</p><table><thead><tr><th>Оборот</th><th>Глагол</th><th>Пример</th></tr></thead><tbody><tr><td><b>a number of</b> + мн. ч.</td><td>множественное</td><td>A number of students <b>were</b> absent. — Несколько студентов отсутствовали.</td></tr><tr><td><b>the number of</b> + мн. ч.</td><td>единственное</td><td>The number of students <b>has</b> increased. — Число студентов выросло.</td></tr></tbody></table><p>Сюда же: слова <b>percentage, majority, minority</b> ведут себя как a number of — согласуются по смыслу с существительным после of.</p><h3 class=\"prog\">Типовые ошибки русскоговорящих</h3><ul><li>Ставят -s после числа: ~~three thousands~~ вместо three thousand.</li><li>Забывают -s в обороте с of: ~~thousand of people~~ вместо thousands of people.</li><li>Путают точку и запятую в числах: читают 1,250 как «одна целая».</li><li>Читают десятичную часть целым числом: 12.75 как ~~twelve point seventy-five~~.</li><li>Переносят русское «на 5%» в предлог on: ~~rose on 5%~~ вместо rose <b>by</b> 5%.</li><li>Пишут ~~two times~~ вместо twice.</li><li>Оставляют существительное во множественном в определении: ~~a five-years plan~~.</li><li>Забывают the перед порядковым и перед веком: ~~in 21st century~~.</li></ul><h3 class=\"prog\">Мини-чек перед ответом</h3><ol><li>Перед hundred / thousand / million стоит цифра? Тогда без -s. Стоит of и цифры нет? Тогда с -s.</li><li>Числительное от 21 до 99 — обязательно через дефис.</li><li>Порядковое? Проверь the и то, что -th получило только последнее слово в составном числе.</li><li>Дробь: знаменатель порядковый, во множественном с -s (two thirds).</li><li>В числе точка — это запятая по-русски, а запятая — разделитель тысяч.</li><li>Рост «на сколько» — by, «до какого уровня» — to, «с… до…» — from … to.</li><li>Год: in 2025, число месяца: on 5 May, время: at five o&#x27;clock.</li><li>Числительное перед существительным как определение — дефис и единственное число: a ten-minute break.</li></ol>"};

</script>
<script>

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var v=a[i]; a[i]=a[j]; a[j]=v; } return a; }
var LET="АБВГДЕЖЗИКЛМН";
function plural(n,a,b,c){ var m=n%100; if(m>=11&&m<=14)return c; m=n%10; if(m===1)return a; if(m>=2&&m<=4)return b; return c; }
function mmss(sec){ var m=Math.floor(sec/60), s=sec%60; return m+":"+(s<10?"0":"")+s; }

/* ---------- банк ---------- */
var ТЕМЫ = window.ТЕМЫ || [];

   ни в вариант экзамена, ни в «весь банк» — только в свой режим */

БАНК.forEach(function(q){ ПО_ID[q.id]=q; });
ДЕМО.forEach(function(q){ ПО_ID[q.id]=q; });
function темаИмя(n){ for(var i=0;i<ТЕМЫ.length;i++) if(ТЕМЫ[i].n===n) return ТЕМЫ[i]["название"]; return "Тема "+n; }
function вопросыТемы(n){ return БАНК.filter(function(q){ return q.t===n; }); }

             match:"Соответствие",gaps:"Текст с пропусками"};

/* ---------- хранилище ---------- */
var KEY="english_v1";

function статТемы(t,ok){

  s.all++; if(ok)s.ok++;

/* ---------- нормализация для короткого ответа ---------- */
function norm(s){
  return String(s==null?"":s)
    .toLowerCase()
    .replace(/ё/g,"е")
    .replace(/[^0-9a-zа-я\s]/g," ")
    .replace(/\s+/g," ")
    .trim();
}
/* хвосты, которыми может отличаться словоформа (падеж/род/число) */
var ОКОНЧАНИЕ=/^(|а|я|у|ю|е|и|ы|о|ой|ей|ый|ий|ое|ее|ые|ие|ая|яя|ую|юю|ым|им|ом|ем|ых|их|ыми|ими|ого|его|ому|ему|ов|ев|ам|ям|ах|ях|ами|ями)$/;
function словоРавно(x,y){
  if(x===y) return true;
  var n=Math.min(x.length,y.length), p=0;
  while(p<n && x[p]===y[p]) p++;
  if(x.length<6 || y.length<6) return false;
  if(p<x.length-3 || p<y.length-3) return false;
  if(p<4) return false;
  return ОКОНЧАНИЕ.test(x.slice(p)) && ОКОНЧАНИЕ.test(y.slice(p));
}
function мягкоеРавенство(a,b){
  var na=norm(a), nb=norm(b);
  if(!na||!nb) return false;
  if(na===nb) return true;
  /* «0,25» и «0.25» после чистки пунктуации становятся «0 25» — склеиваем цифры */
  if(na.replace(/\s/g,"")===nb.replace(/\s/g,"")) return true;
  var wa=na.split(" "), wb=nb.split(" ");
  if(wa.length!==wb.length) return false;
  for(var i=0;i<wa.length;i++) if(!словоРавно(wa[i],wb[i])) return false;
  return true;
}

/* ---------- пустой и проверенный ответ ---------- */
function пустойОтвет(q){
  if(q.ty==="one") return null;
  if(q.ty==="many") return [];
  if(q.ty==="short") return "";
  return {};                 /* match и gaps: индекс строки -> выбранный вариант */
}
function ответДан(q,v){
  if(q.ty==="one") return v!=null;
  if(q.ty==="many") return Array.isArray(v)&&v.length>0;
  if(q.ty==="short") return norm(v).length>0;
  if(поСтрокам(q)){
    if(!v) return false;
    for(var i=0;i<q.pairs.length;i++) if(!v[i]) return false;
    return true;
  }
  return false;
}
/* Проверка строго по СПЕЦИФИКАЦИЯ.md */
function верно(q,v){
  if(q.ty==="one") return v!=null && q.a.indexOf(v)>=0;
  if(q.ty==="many"){
    if(!Array.isArray(v)) return false;
    if(v.length!==q.a.length) return false;
    for(var i=0;i<q.a.length;i++) if(v.indexOf(q.a[i])<0) return false;
    return true;
  }
  if(q.ty==="short") return мягкоеРавенство(v,q.ans);
  if(поСтрокам(q)){
    if(!v) return false;
    for(var j=0;j<q.pairs.length;j++) if(v[j]!==q.pairs[j].r) return false;
    return true;
  }
  return false;
}
/* верна ли отдельная строка соответствия — для подсветки в разборе */
function строкаВерна(q,v,j){ return !!v && v[j]===q.pairs[j].r; }

(function(){
  var b=$("#themeBtn");
  var st=null; try{ st=localStorage.getItem(KEY+"_theme"); }catch(e){}
  if(st) document.documentElement.setAttribute("data-theme",st);

    var next=dark?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    try{ localStorage.setItem(KEY+"_theme",next); }catch(e){}
  });
})();

/* ---------- подвал главной: карта готовности ---------- */

/* ---------- памятки ---------- */
var ПАМЯТКИ = window.ПАМЯТКИ || {};
var ПАМЯТКИ_ЕСТЬ = Object.keys(ПАМЯТКИ).length>0;
var темаПамятки = null;
var памяткаИзПопытки = false;   /* открыли посреди вопроса — значит и вернуть надо в вопрос */

function показатьПамятку(n,изПопытки){
  var body=$("#noteBody"); if(!body) return;
  темаПамятки=n;
  памяткаИзПопытки=!!изПопытки;
  body.innerHTML=ПАМЯТКИ[n]||"<p>Памятка по этой теме пока не написана.</p>";
  /* широкие таблицы на телефоне должны прокручиваться, а не ломать вёрстку */

    var box=el("div","scrollx");
    t.parentNode.insertBefore(box,t); box.appendChild(t);
  });
  $("#noteTitle").textContent="Памятка · "+темаИмя(n);

    st.appendChild(кнопкаРежима(String(T.n+1),T["название"],d,

/* ---------- запуск попытки ---------- */
function старт(mode,topic){
  var items=[];
  if(mode==="topic") items=вопросыТемы(topic).map(function(q){ return q.id; });
  else if(mode==="mist") items=DB.wrong.slice();
  else if(mode==="all") items=shuffle(БАНК.map(function(q){ return q.id; }));
  else if(mode==="exam") items=собратьВариант(DB.examN);
  /* демоверсия идёт строго в порядке программы: лексика, грамматика, соответствия, тексты */
  else if(mode==="demo") items=ДЕМО.map(function(q){ return q.id; });
  if(mode==="topic") items=shuffle(items);
  if(mode==="mist") items=shuffle(items);
  if(!items.length){ alert("Для этого режима нет вопросов."); return; }
  S={ mode:mode, topic:(topic==null?null:topic), items:items, i:0,
      ans:{}, done:{}, ok:{}, instant:(mode!=="exam"), t0:Date.now(), spent:0 };
  сохранитьПопытку();
  экран("quiz");
  рисоватьВопрос();
}

/* Вариант экзамена: по возможности поровну из каждой темы, порядок случайный */
function собратьВариант(n){
  var поТемам={}, взято=[];
  БАНК.forEach(function(q){ (поТемам[q.t]=поТемам[q.t]||[]).push(q.id); });
  var ключи=Object.keys(поТемам);
  ключи.forEach(function(k){ поТемам[k]=shuffle(поТемам[k]); });
  var круг=0;
  while(взято.length<n){
    var добавили=false;
    for(var i=0;i<ключи.length&&взято.length<n;i++){
      var arr=поТемам[ключи[i]];
      if(круг<arr.length){ взято.push(arr[круг]); добавили=true; }
    }
    if(!добавили) break;
    круг++;
  }
  return shuffle(взято);
}

function продолжить(){
  var R=DB.resume; if(!R) return;
  R.items=R.items.filter(function(id){ return !!ПО_ID[id]; });
  if(!R.items.length){ DB.resume=null; save(); домой(); return; }
  S={ mode:R.mode, topic:R.topic, items:R.items, i:Math.min(R.i,R.items.length-1),
      ans:R.ans||{}, done:R.done||{}, ok:R.ok||{}, instant:R.mode!=="exam",
      t0:Date.now(), spent:R.spent||0 };
  экран("quiz");
  рисоватьВопрос();
}

function сохранитьПопытку(){
  if(!S){ DB.resume=null; save(); return; }
  DB.resume={ mode:S.mode, topic:S.topic, items:S.items, i:S.i,
              ans:S.ans, done:S.done, ok:S.ok, spent:прошло() };
  save();
}
function прошло(){ return S?(S.spent+Math.round((Date.now()-S.t0)/1000)):0; }
