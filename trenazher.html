window.ДЕМО = [
{"id": "дем-01", "t": 7, "ty": "one", "блок": "I. Лексика", "q": "The home appliance and electronic goods industry is in ...; the good years are over.", "qru": "Отрасль бытовой техники и электроники переживает ...; хорошие годы позади.", "o": ["boom", "profit", "increase", "value"], "oru": ["бум, резкий подъём", "прибыль", "рост, увеличение", "ценность, стоимость"], "a": [0], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Ключ вуза здесь — boom: «The home appliance and electronic goods industry is in boom» — «отрасль бытовой техники и электроники переживает бум (резкий подъём)». Из четырёх слов только boom образует с предлогом in устойчивое сочетание to be in a boom / industry in boom — «быть на подъёме»; profit, increase и value так после in не ставятся, у них другие модели (to make a profit, an increase in something, of great value). Честно предупреждаю: сам пример противоречив — вторая часть «the good years are over» («хорошие годы позади») по смыслу просит слово со значением спада (recession, decline), а не подъёма. На экзамене здесь надо выбирать по сочетаемости, а не по смыслу, и отмечать boom, как в официальном ключе.", "w": ["", "profit — «прибыль». Прибыль получают: to make/earn a profit, а to be in profit говорят про отдельную компанию («выйти в плюс»), а не про целую отрасль в таком контексте; выражения «отрасль в прибыли» английский тут не строит.", "increase — «рост, увеличение». Это слово почти всегда требует уточнения после себя: an increase in prices, an increase of 5%. Голое «in increase» не существует как оборот.", "value — «ценность, стоимость». Сочетания to be in value нет; говорят of great value («большой ценности») или the value of something («стоимость чего-либо»)."], "k": "In a boom — «на подъёме». Boom буквально «бах, взрыв»: рынок взлетает."},
{"id": "дем-02", "t": 7, "ty": "one", "блок": "I. Лексика", "q": "The amount of energy consumed - and wasted - in commercial buildings is increasing all the time. The ... in numbers of items of electronic office equipment threatens to reach its maximum in the next ten years.", "qru": "Количество энергии, потребляемой и растрачиваемой в коммерческих зданиях, постоянно растёт. ... числа единиц электронного офисного оборудования грозит достичь максимума в ближайшие десять лет.", "o": ["progress", "result", "growth", "count"], "oru": ["прогресс, продвижение", "результат", "рост (увеличение количества)", "подсчёт, число"], "a": [2], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Верно: «The growth in numbers of items of electronic office equipment threatens to reach its maximum in the next ten years» — «рост числа единиц электронного офисного оборудования грозит достичь максимума в ближайшие десять лет». Growth — это именно увеличение количества, и у него есть готовая модель growth in something (growth in numbers, growth in sales, growth in population). Первое предложение задаёт тему увеличения (is increasing all the time), поэтому во втором ждём слово того же ряда.", "w": ["progress — «прогресс, продвижение вперёд, улучшение». Прогресс качественный, а не количественный: он не «достигает максимума в числах». К тому же с ним употребляют progress in medicine, progress towards a goal, но не «прогресс числа единиц».", "result — «результат». Результат — это следствие чего-то (the result of the reform), он сам не растёт в количестве; здесь по смыслу нужна не причина-следствие, а увеличение.", "", "count — «подсчёт, итоговое число». Слово статичное: это цифра на данный момент (the final count), а не процесс увеличения; сочетания «the count in numbers» нет."], "k": "Growth in numbers — «рост в числах». Растёт — growth, и после него всегда предлог in."},
{"id": "дем-03", "t": 7, "ty": "one", "блок": "I. Лексика", "q": "We all know that sea levels have been rising for the last 20 years, but the ... of rise has increased rapidly in recent years.", "qru": "Мы все знаем, что уровень моря поднимается последние 20 лет, но ... подъёма в последние годы резко выросла.", "o": ["growth", "reason", "increase", "rate"], "oru": ["рост", "причина", "увеличение", "скорость, темп"], "a": [3], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Верно: «... but the rate of rise has increased rapidly in recent years» — «но скорость (темп) подъёма в последние годы резко выросла». Rate — это темп, с которым что-то происходит: the rate of growth, at a fast rate, birth rate. По логике предложения уровень моря и так поднимается двадцать лет, новость же в том, что подъём стал быстрее — то есть речь о темпе, а не о самом факте роста.", "w": ["growth — «рост». Получилось бы «рост подъёма», масло масляное: rise и growth здесь значат одно и то же, и предложение потеряло бы смысл.", "reason — «причина». «Причина подъёма резко выросла» бессмысленно: причина может быть найдена или объяснена, но не «увеличивается быстро».", "increase — «увеличение». Та же ловушка, что с growth: «увеличение подъёма» дублирует смысл. К тому же increase of rise — не английское сочетание.", ""], "k": "Rate — это «сколько в единицу времени»: rate of rise, birth rate, at what rate. Если в вопросе «насколько быстро» — это rate."},
{"id": "дем-04", "t": 7, "ty": "one", "блок": "I. Лексика", "q": "In recent years the amount of money earned by top sportsmen and women has risen and attracted a lot of media ....", "qru": "В последние годы суммы, которые зарабатывают ведущие спортсмены и спортсменки, выросли и привлекли большое ... прессы.", "o": ["competition", "attention", "vision", "compensation"], "oru": ["соревнование, конкуренция", "внимание", "зрение, видение", "компенсация, возмещение"], "a": [1], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Верно: «... has risen and attracted a lot of media attention» — «выросли и привлекли большое внимание прессы». Здесь сразу две устойчивые связки: to attract attention («привлекать внимание») и media attention («внимание СМИ»). Attention — неисчисляемое, поэтому стоит без артикля и с a lot of.", "w": ["competition — «соревнование, конкуренция». Сочетания «media competition» в значении «интерес прессы» нет; и глагол attract с ним в таком смысле не работает — деньги спортсменов привлекают внимание, а не конкуренцию.", "", "vision — «зрение, видение, образ будущего». Это про способность видеть или про замысел, а не про интерес публики; «media vision» ничего не значит.", "compensation — «компенсация, возмещение ущерба». Слово из юридической и финансовой сферы (to claim compensation); пресса не «даёт компенсацию» за высокие гонорары."], "k": "Attract attention — «притягивать внимание», как магнит. Media attention — постоянная пара про интерес прессы."},
{"id": "дем-05", "t": 7, "ty": "one", "блок": "I. Лексика", "q": "A wide variety of writers have won the award working in a ... of fiction and non-fiction genres.", "qru": "Премию получали самые разные писатели, работающие в ... художественных и документальных жанров.", "o": ["range", "area", "source", "world"], "oru": ["ряд, диапазон, набор", "область, площадь", "источник", "мир"], "a": [0], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Верно: «A wide variety of writers have won the award working in a range of fiction and non-fiction genres» — «премию получали самые разные писатели, работающие в целом ряде художественных и документальных жанров». Range — «диапазон, набор разных вещей»; оборот a (wide) range of + существительное во множественном числе значит «целый ряд разных…». Именно он нужен, когда подчёркивают разнообразие, как здесь (a wide variety of writers в начале задаёт ту же мысль).", "w": ["", "area — «область, площадь, сфера». Говорят in the area of literature («в области литературы»), но «an area of genres» не строится: area не считает разнообразие, а называет одну сферу.", "source — «источник» (of information, of income). Жанры не бывают «источником»; смысл разнообразия здесь пропадает совсем.", "world — «мир». Есть the world of fiction («мир художественной литературы»), но с исчислением жанров это не сочетается: «a world of genres» звучит как поэтическая метафора, а не как нейтральное «ряд жанров»."], "k": "A wide range of — «целый ряд разных». Range как линейка со шкалой: на ней помещается много разного."},
{"id": "дем-06", "t": 7, "ty": "one", "блок": "I. Лексика", "q": "Globalisation connects people by ... of communication and offers them new opportunities for travel, work and education.", "qru": "Глобализация связывает людей ... общения и открывает им новые возможности для путешествий, работы и учёбы.", "o": ["media", "views", "means", "destruction"], "oru": ["СМИ, средства массовой информации", "взгляды, мнения", "средство, способ", "разрушение"], "a": [2], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Верно: «Globalisation connects people by means of communication and offers them new opportunities…» — «глобализация связывает людей средствами общения и открывает им новые возможности». By means of — устойчивый оборот «посредством, при помощи»; ещё есть means of communication / means of transport — «средства связи», «средства передвижения». Обратите внимание: у means форма одинаковая в единственном и множественном числе, буква -s к корню, а не окончание.", "w": ["media — «СМИ». Слово о каналах массовой информации (телевидение, пресса); после предлога by оно даёт «через СМИ», а не «средствами общения», и устойчивого by media of communication не существует.", "views — «взгляды, мнения». Речь о том, что человек думает; «взглядами общения» связывать людей нельзя — смысл рассыпается.", "", "destruction — «разрушение». Значение прямо противоположно тому, что делает глагол connects («связывает»); предложение стало бы бессмысленным."], "k": "By means of — «посредством». Means всегда с -s, даже когда средство одно."},
{"id": "дем-07", "t": 7, "ty": "one", "блок": "I. Лексика", "q": "Much of the power of the Internet lies in the fact that people are developing new ... to be creative and innovative, combining ideas and skills without an organization.", "qru": "Сила интернета во многом в том, что люди вырабатывают новые ... быть творческими и находить новое, соединяя идеи и умения без всякой организации.", "o": ["network", "collaboration", "residents", "ways"], "oru": ["сеть", "сотрудничество", "жители, резиденты", "способы, пути"], "a": [3], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Верно: «… people are developing new ways to be creative and innovative» — «люди вырабатывают новые способы быть творческими и находить новое». Слово way («способ») спокойно берёт после себя инфинитив: a way to do something / ways to be creative. Множественное число ways нужно потому, что стоит new без артикля a и речь о многих людях и многих способах.", "w": ["network — «сеть». Существительное в единственном числе, к тому же сеть не «бывает способом быть творческим»: за ним пошло бы a new network of contacts, а не new network to be creative.", "collaboration — «сотрудничество». Само по себе оно не сочетается с инфинитивом в такой конструкции: говорят collaboration with someone, in collaboration with. Плюс сотрудничество упоминается дальше по смыслу (combining ideas), а в пропуске нужно слово «способы».", "residents — «жители, резиденты». Это люди, а не способ действия; получилось бы «люди вырабатывают новых жителей».", ""], "k": "Ways to do something — «способы что-то делать». После way смело ставится to + глагол."},
{"id": "дем-08", "t": 7, "ty": "one", "блок": "I. Лексика", "q": "A knowledge of differences between cultures, in an ever-shrinking globalized world, is becoming one of the essential key ... that modern \"citizens of the world\" need to possess in order to work and learn effectively.", "qru": "Знание различий между культурами в постоянно сжимающемся глобальном мире становится одним из ключевых ..., которыми должны обладать современные «граждане мира», чтобы эффективно работать и учиться.", "o": ["means", "skills", "methods", "ways"], "oru": ["средство, способ", "навыки, умения", "методы", "способы, пути"], "a": [1], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Верно: «… is becoming one of the essential key skills that modern \"citizens of the world\" need to possess» — «становится одним из ключевых навыков, которыми должны обладать современные «граждане мира»». Key skills — устойчивое сочетание «ключевые навыки»; знание различий между культурами — это именно умение, которым владеет человек (to possess a skill). Форма множественного числа обязательна из-за one of the …, после которого всегда идёт множественное число.", "w": ["means — «средство, способ». Это инструмент для достижения цели (a means of transport), а не личное умение человека; сочетания key means здесь не бывает, да и possess a means не говорят.", "", "methods — «методы». Метод — это порядок действий для решения задачи (teaching methods); им пользуются, а не «обладают» как личным качеством. Знание культурных различий методом не назовёшь.", "ways — «способы, пути». Тоже про то, как что-то делают, а не про то, что человек умеет; глагол possess с ways не сочетается."], "k": "Key skills — «ключевые навыки». Если речь о том, что человек умеет и чем обладает (possess), это skills, а не ways/methods."},
{"id": "дем-09", "t": 7, "ty": "one", "блок": "I. Лексика", "q": "Many people feel that onshore wind farms spoil the landscape, particularly in countryside ... where they are usually sited.", "qru": "Многие считают, что наземные ветряные электростанции портят пейзаж, особенно в сельских ..., где их обычно размещают.", "o": ["areas", "spaces", "ranges", "roads"], "oru": ["местности, районы", "пространства", "хребты, диапазоны", "дороги"], "a": [0], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Верно: «… particularly in countryside areas where they are usually sited» — «особенно в сельских местностях, где их обычно размещают». Area — «местность, район, участок территории»; отсюда rural areas, countryside areas, residential areas. Множественное число нужно, потому что говорится о ветряных станциях вообще, а не об одном конкретном месте.", "w": ["", "spaces — «пространства, свободные места». Слово про пустоту и объём (open spaces, parking spaces); «countryside spaces» звучит не по-английски, когда речь о районах, где что-то расположено.", "ranges — «горные хребты» или «диапазоны» (mountain ranges, a range of prices). Ни одно из значений не подходит для описания сельской местности.", "roads — «дороги». Ветряные станции ставят не на дорогах, а на территориях; и пейзаж портится в местности, а не «в дорогах»."], "k": "Areas — «места на карте»: rural areas, countryside areas, residential areas. Место, где что-то расположено, — всегда area."},
{"id": "дем-10", "t": 0, "ty": "one", "блок": "II. Грамматика", "q": "The news from the Middle East ... very encouraging.", "qru": "Новости с Ближнего Востока ... очень обнадёживающими.", "o": ["seems", "seem", "is seeming", "are seemed"], "oru": ["кажется — Present Simple, 3-е лицо ед. ч.", "кажутся — форма множественного числа", "кажется сейчас — Present Continuous", "*являются казаемыми — пассив мн. ч."], "a": [0], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Полное предложение: The news from the Middle East seems very encouraging — «новости с Ближнего Востока кажутся очень обнадёживающими». Слово news только выглядит как множественное число из-за -s, на деле оно неисчисляемое и всегда требует глагола в единственном числе: the news is good, the news seems good. Отсюда форма 3-го лица seems. Второй сигнал — сам глагол seem: это глагол состояния (восприятие, впечатление), а такие глаголы не ставятся в Continuous, поэтому только Present Simple. Оборот from the Middle East — определение к news, на согласование оно не влияет.", "w": ["", "seem — форма множественного числа, она подошла бы к подлежащему во множественном (they seem). Но news неисчисляемое и считается единственным числом, поэтому здесь нужна -s.", "is seeming — Present Continuous, «кажется прямо сейчас». Seem — глагол состояния и в Continuous не употребляется, так же как know, like, belong.", "are seemed — пассивный залог во множественном числе, буквально «являются казаемыми». Seem непереходный, пассива у него не бывает вообще, и множественное число с news тоже не сходится."], "k": "News, information, advice — все с виду множественные, но глагол при них один: the news IS good."},
{"id": "дем-11", "t": 1, "ty": "one", "блок": "II. Грамматика", "q": "If I had known how difficult the job was, I ... it.", "qru": "Если бы я знал, насколько трудна эта работа, я бы ... её.", "o": ["don't take", "won't take", "won't have taken", "wouldn't have taken"], "oru": ["не беру — Present Simple", "не возьму — Future Simple", "не возьму к тому моменту — Future Perfect", "не взял бы — сослагательное о прошлом"], "a": [3], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Полное предложение: If I had known how difficult the job was, I wouldn't have taken it — «если бы я знал, насколько трудна эта работа, я бы её не взял». Это третий тип условного: разговор о прошлом, которое уже нельзя изменить. Схема жёсткая: if + Past Perfect (had known) в придаточной части → would have + причастие прошедшего времени (wouldn't have taken) в главной. Сигнал прямо в предложении — had known после if: увидели Past Perfect после if, значит во второй части обязательно would have done.", "w": ["don't take — Present Simple, «не беру». Настоящее время не сочетается с had known: речь о нереальном прошлом, а не о привычке.", "won't take — Future Simple, «не возьму». Такая форма идёт в первом типе условного (if I know … I won't take), где ситуация ещё реальна и относится к будущему.", "won't have taken — Future Perfect, «не возьму к какому-то моменту в будущем». Время направлено вперёд, а условие had known смотрит назад, в прошлое.", ""], "k": "Если после if стоит had done — во второй части всегда would have done. Пара «had — would have» ходит только вместе."},
{"id": "дем-12", "t": 7, "ty": "one", "блок": "II. Грамматика", "q": "There is little agreement ... what caused the building to collapse.", "qru": "Насчёт того, что вызвало обрушение здания, согласия почти нет.", "o": ["on", "at", "by", "in"], "oru": ["на, о — предлог при agreement", "в, у — точка в пространстве", "посредством, к", "в — внутри"], "a": [0], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Полное предложение: There is little agreement on what caused the building to collapse — «насчёт того, что вызвало обрушение здания, согласия почти нет». Существительное agreement управляет предлогом on: agreement on something — «согласие по какому-то вопросу» (сюда же agreement on prices, agreement on the terms). Предлог здесь выбирается не по смыслу «в/на», а по слову, к которому он привязан: это устойчивое сочетание, его запоминают целиком. Сигнал — само слово agreement прямо перед пропуском.", "w": ["", "at — предлог точки в пространстве или времени (at the door, at five). С agreement не сочетается.", "by — «посредством, при помощи» или «к какому-то сроку» (by train, by Friday). К слову agreement не относится.", "in — «внутри» чего-то (in the room). Есть выражение to be in agreement with somebody («быть согласным с кем-то»), но там in стоит перед agreement, а не после него; здесь же нужен предлог, вводящий тему согласия."], "k": "Согласие всегда «по вопросу»: agreement ON something. Предлог живёт при слове, а не при смысле."},
{"id": "дем-13", "t": 2, "ty": "one", "блок": "II. Грамматика", "q": "The police warned everyone ... inside with their windows closed.", "qru": "Полиция предупредила всех ... внутри с закрытыми окнами.", "o": ["stay", "stayed", "to stay", "to be stayed"], "oru": ["оставаться — голая основа без to", "оставался — прошедшее время", "чтобы оставались — инфинитив с to", "быть оставленными — пассивный инфинитив"], "a": [2], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Полное предложение: The police warned everyone to stay inside with their windows closed — «полиция предупредила всех оставаться внутри с закрытыми окнами». Глагол warn строится по схеме warn somebody to do something: сначала тот, кого предупредили (everyone), потом инфинитив с частицей to. Так же ведут себя tell, ask, advise, order: he told me to wait. Сигнал — слово everyone сразу после warned: раз есть дополнение-лицо, дальше идёт to + глагол.", "w": ["stay — голая основа без to. Без частицы инфинитив идёт только после make, let и модальных (let him stay), но не после warn.", "stayed — форма прошедшего времени. Второго личного глагола в предложении быть не может: сказуемое здесь уже есть — warned.", "", "to be stayed — пассивный инфинитив, «быть оставленными». Stay непереходный, пассива у него нет, да и по смыслу люди остаются сами, а не их кто-то оставляет."], "k": "Warn / tell / ask / advise + кого + TO do. Предупредили кого — сделать что."},
{"id": "дем-14", "t": 4, "ty": "one", "блок": "II. Грамматика", "q": "Every candidate said that ... thought the interview was too long.", "qru": "Каждый кандидат сказал, что ... считает собеседование слишком длинным.", "o": ["he", "they", "she", "them"], "oru": ["он — подлежащее, только мужской род", "они (он или она) — родонейтральное подлежащее", "она — подлежащее, только женский род", "их, им — форма дополнения"], "a": [1], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Полное предложение: Every candidate said that they thought the interview was too long — «каждый кандидат сказал, что считает собеседование слишком длинным». Пропуск стоит на месте подлежащего придаточного, и заменить нужно every candidate — человека, чей пол неизвестен. В таких случаях английский берёт singular they: местоимение множественной формы, но по смыслу об одном человеке. Сигнал — слово every: оно говорит о любом кандидате, и мужчине, и женщине. Форма глагола при singular they остаётся «множественной»: they thought, а не they thinks.", "w": ["he — «он», подлежащее, но только мужского рода. Среди кандидатов могут быть и женщины, поэтому такой выбор сужает смысл; выбирать между he и she тут не из чего.", "", "she — «она», подлежащее женского рода. Та же проблема, что и с he: пол кандидата в предложении не указан.", "them — форма дополнения («их, им»), она стоит после глагола или предлога (I saw them). Здесь нужно подлежащее, а подлежащим бывает только they."], "k": "Пол неизвестен — берите they. И помните пару: THEY делает, THEM трогают."},
{"id": "дем-15", "t": 3, "ty": "one", "блок": "II. Грамматика", "q": "Neither the President ... his representatives are to attend the meeting.", "qru": "Ни президент, ... его представители не должны присутствовать на встрече.", "o": ["no", "nor", "or", "not"], "oru": ["нет, никакой — отрицательный определитель", "ни — вторая часть пары neither … nor", "или — при either", "не — отрицание при глаголе"], "a": [1], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Полное предложение: Neither the President nor his representatives are to attend the meeting — «ни президент, ни его представители не должны присутствовать на встрече». Здесь работает парный союз neither … nor: первая половина уже стоит в предложении, значит вторая может быть только nor. Пара запоминается вместе со своим близнецом either … or («или … или»). Сигнал буквально первое слово предложения — Neither. Обратите внимание: сам союз уже несёт отрицание, поэтому второго not в предложении нет.", "w": ["no — отрицательный определитель перед существительным (no time, no money). Он не соединяет две части предложения и парой к neither не служит.", "", "or — вторая половина другой пары, either … or. С neither она не сочетается.", "not — отрицательная частица при глаголе (does not attend). Здесь отрицание уже выражено словом neither, а соединить два подлежащих частица not не может."], "k": "Союзы ходят парами: neither — nor, either — or. Увидели первое слово — второе подставляется само."},
{"id": "дем-16", "t": 0, "ty": "one", "блок": "II. Грамматика", "q": "Around 10 per cent of the forest ... each year.", "qru": "Около 10 процентов леса ... каждый год.", "o": ["is destroyed", "are destroyed", "destroy", "destroys"], "oru": ["уничтожается — пассив, ед. ч.", "уничтожаются — пассив, мн. ч.", "уничтожают — актив, мн. ч.", "уничтожает — актив, ед. ч."], "a": [0], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Полное предложение: Around 10 per cent of the forest is destroyed each year — «около 10 процентов леса уничтожается каждый год». Лес не уничтожает сам себя, действие направлено на него, поэтому нужен пассив: форма be + причастие прошедшего времени, то есть is destroyed. Число глагола при обороте «X per cent of …» определяется существительным после of: здесь the forest — единственное число и неисчисляемое, значит is. Сказали бы 10 per cent of the trees are destroyed — и глагол стал бы множественным. Сигнал регулярности each year подтверждает Present Simple.", "w": ["", "are destroyed — тот же пассив, но во множественном числе. После of стоит the forest в единственном числе, поэтому нужен is.", "destroy — активный залог во множественном числе, «уничтожают». Тогда лес оказался бы тем, кто уничтожает, а по смыслу он жертва; плюс число не сходится.", "destroys — активный залог в единственном числе, «уничтожает». Залог перепутан: нужен пассив, ведь уничтожают именно лес."], "k": "В обороте «X процентов OF чего-то» глагол смотрит на слово после of: of the forest — is, of the trees — are."},
{"id": "дем-17", "t": 0, "ty": "one", "блок": "II. Грамматика", "q": "We ... the car for 6 months before we discovered it was stolen.", "qru": "Мы ... машиной шесть месяцев, прежде чем выяснили, что она краденая.", "o": ["owned", "had been owning", "was owned", "had owned"], "oru": ["владели — Past Simple", "*владели всё это время — Past Perfect Continuous", "принадлежала — пассив, ед. ч.", "владели (до этого момента) — Past Perfect"], "a": [3], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Полное предложение: We had owned the car for 6 months before we discovered it was stolen — «мы владели машиной шесть месяцев, прежде чем выяснили, что она краденая». В предложении два прошедших события, и владение случилось раньше, чем обнаружение. Для более раннего из двух прошедших действий берут Past Perfect: had + причастие прошедшего времени. Сигнал — слово before рядом с глаголом в Past Simple (discovered): оно прямо расставляет события по порядку. Продолженную форму had been owning здесь поставить нельзя: own — глагол состояния (обладание), а глаголы состояния в Continuous не идут.", "w": ["owned — Past Simple, просто «владели». Форма не показывает, что владение предшествовало другому прошедшему событию, а с before и двумя действиями нужен именно этот сдвиг назад.", "had been owning — Past Perfect Continuous. Само по себе время существует и хорошо подходит к отрезку for 6 months, но own — глагол состояния и в Continuous не употребляется, как и know, belong, have (в значении «иметь»).", "was owned — пассив в единственном числе, «принадлежала». Подлежащее we («мы») с таким глаголом не согласуется: тогда пришлось бы сказать the car was owned by us.", ""], "k": "Два прошедших события — раннее уходит в had done. А own, know, belong — состояния, у них -ing не бывает."},
{"id": "дем-18", "t": 1, "ty": "one", "блок": "II. Грамматика", "q": "The car broke down and we ... a taxi.", "qru": "Машина сломалась, и нам ... такси.", "o": ["had to get", "must have got", "had got to get", "must get"], "oru": ["пришлось взять — прошедшее от must", "наверное, взяли — предположение о прошлом", "*— несуществующая форма", "должны взять — настоящее время"], "a": [0], "pairs": [], "pairsru": [], "pool": [], "poolru": {}, "ans": "", "img": null, "oimg": [null, null, null, null], "e": "Полное предложение: The car broke down and we had to get a taxi — «машина сломалась, и нам пришлось взять такси». Речь о вынужденном действии в прошлом, а у модального must собственной формы прошедшего времени нет, поэтому его заменяют на had to. Сигнал — первая часть предложения в Past Simple (broke down): вся ситуация уже в прошлом. Соседний вариант must have got значит совсем другое — «наверное, взяли», то есть догадку говорящего о прошлом, а не необходимость.", "w": ["", "must have got — предположение о прошлом, «наверное, взяли такси». Так говорят, когда рассуждают со стороны и не знают наверняка, а здесь рассказчик сам участник событий и говорит о вынужденности.", "had got to get — такой формы в английском нет. Есть have got to («должен», разговорный эквивалент have to) в настоящем времени, но в прошедшем говорят только had to.", "must get — «должны взять», настоящее время о необходимости прямо сейчас или в будущем. С прошедшим broke down не сочетается."], "k": "У must нет прошедшего: «пришлось» — это had to. А must have done — не «пришлось», а «наверное, сделал»."},
{"id": "дем-19", "t": 8, "ty": "match", "блок": "III. Соответствие", "q": "Подберите по одному определению к каждому из данных понятий. Определение, которому не досталось понятия, обозначьте знаком «-».", "qru": "", "o": [], "oru": [], "a": [], "pairs": [{"l": "the process of making air, water, soil etc dangerously dirty", "r": "pollution"}, {"l": "an increase in amount, number, or size", "r": "growth"}, {"l": "the process of teaching and learning", "r": "education"}, {"l": "the form that a book, newspaper, magazine etc is produced in", "r": "edition"}, {"l": "the process of making something such as a business operate in a lot of different countries all around the world", "r": "-"}, {"l": "a general increase in world temperatures", "r": "-"}], "pairsru": ["процесс опасного загрязнения воздуха, воды, почвы и т. п.", "увеличение количества, числа или размера", "процесс обучения и учения", "форма, в которой выпускают книгу, газету, журнал и т. п.", "процесс, при котором дело начинает работать во множестве стран по всему миру (globalisation)", "общее повышение мировых температур (global warming)"], "pool": ["-", "education", "edition", "growth", "pollution"], "poolru": {"-": "нет подходящего понятия", "education": "образование", "edition": "издание (выпуск, формат выпуска)", "growth": "рост", "pollution": "загрязнение"}, "ans": "", "img": null, "oimg": [], "e": "В этой четвёрке все слова похожи тем, что три из них называют процесс, поэтому смотреть надо на то, процесс чего именно. pollution — «the process of making air, water, soil etc dangerously dirty»: маркер здесь dirty (грязный) плюс перечисление воздуха, воды и почвы, речь о загрязнении среды. growth — «an increase in amount, number, or size»: маркер increase (увеличение) вместе с amount, number, size, то есть это рост в количестве, а не в качестве. education — «the process of teaching and learning»: маркеры teaching и learning, то есть процесс преподавания и учения, это образование. edition — «the form that a book, newspaper, magazine etc is produced in»: маркер form (форма выпуска) при перечислении книг, газет и журналов; не путайте edition (издание, выпуск) с education (образование), слова похожи только внешне. Определение про «process of making a business operate in a lot of different countries» описывает globalisation (глобализацию) — этого слова в списке понятий нет, поэтому ставим «-». Определение «a general increase in world temperatures» описывает global warming (глобальное потепление) — его в списке тоже нет, снова «-»; обратите внимание, что здесь тоже есть слово increase, как и у growth, но уточнение world temperatures однозначно уводит к потеплению. Два определения без пары — это норма: в задании такого типа всегда даётся шесть определений на четыре понятия, лишние строки заложены составителем, а не означают вашу ошибку.", "w": [], "k": "Сначала разведите три «процесса»: pollution — процесс порчи среды, education — процесс обучения людей, а growth — просто увеличение числа или размера. Всё, что про мир целиком (страны, температуры), в этот список понятий не входит."},
{"id": "дем-20", "t": 8, "ty": "match", "блок": "III. Соответствие", "q": "Подберите по одному определению к каждому из данных понятий. Определение, которому не досталось понятия, обозначьте знаком «-».", "qru": "", "o": [], "oru": [], "a": [], "pairs": [{"l": "the information, skills and understanding that you have gained through learning and experience", "r": "knowledge"}, {"l": "the beliefs, way of life, art, and customs that are shared and accepted by people in a particular society", "r": "culture"}, {"l": "knowledge or understanding of a particular subject or situation", "r": "awareness"}, {"l": "a situation in which people or organizations try to be more successful than other people or organizations", "r": "competition"}, {"l": "a statement in which someone complains about something", "r": "-"}, {"l": "the state of being complicated", "r": "-"}], "pairsru": ["сведения, умения и понимание, полученные через учёбу и опыт", "убеждения, уклад жизни, искусство и обычаи, общие для людей определённого общества", "знание или понимание конкретного предмета или ситуации", "положение, когда люди или организации стремятся быть успешнее других", "заявление, в котором кто-то на что-то жалуется (complaint)", "состояние сложности, запутанности (complexity)"], "pool": ["-", "awareness", "competition", "culture", "knowledge"], "poolru": {"-": "нет подходящего понятия", "awareness": "осведомлённость, понимание", "competition": "конкуренция, соревнование", "culture": "культура", "knowledge": "знание"}, "ans": "", "img": null, "oimg": [], "e": "Четыре понятия распределяются по определениям так. knowledge — «the information, skills and understanding that you have gained through learning and experience»: маркеры learning и experience, то есть знание, накопленное через учёбу и опыт; это самое широкое слово в четвёрке. culture — «the beliefs, way of life, art, and customs that are shared and accepted by people in a particular society»: маркеры customs и society, речь об обычаях и укладе целого общества. awareness — «knowledge or understanding of a particular subject or situation»: ключевое уточнение particular subject or situation, то есть осведомлённость о чём-то конкретном; именно этим awareness отличается от knowledge, и заметьте, что само слово knowledge стоит внутри этого определения — значит, определяемое слово тут другое. competition — «a situation in which people or organizations try to be more successful than other people or organizations»: маркер more successful than others, то есть стремление обойти соперника, конкуренция. Определение «a statement in which someone complains about something» описывает complaint (жалобу) — этого слова среди понятий нет, ставим «-». Определение «the state of being complicated» описывает complexity (сложность), маркер complicated; его в списке тоже нет, снова «-». Два лишних определения здесь заложены заранее: определений всегда шесть, а понятий четыре, поэтому две строки обязаны остаться с прочерком.", "w": [], "k": "Главное различие в этой четвёрке — между knowledge и awareness: knowledge это накопленный багаж вообще, а awareness всегда о чём-то конкретном (of a particular subject or situation)."},
{"id": "дем-21", "t": 8, "ty": "match", "блок": "III. Соответствие", "q": "Подберите по одному определению к каждому из данных понятий. Определение, которому не досталось понятия, обозначьте знаком «-».", "qru": "", "o": [], "oru": [], "a": [], "pairs": [{"l": "someone who has completed a university degree, especially a first degree", "r": "graduate"}, {"l": "someone who is paid to work for someone else", "r": "employee"}, {"l": "someone who is being trained for a job", "r": "trainee"}, {"l": "someone who works from home, and communicates with their employer and co-workers using the Internet, email and telephone", "r": "teleworker"}, {"l": "the people who work for an organization", "r": "-"}, {"l": "working for yourself and not employed by a company", "r": "-"}], "pairsru": ["тот, кто получил университетскую степень, особенно первую", "тот, кому платят за работу на другого", "тот, кого обучают работе", "тот, кто работает из дома и связывается с работодателем и коллегами через интернет, почту и телефон", "люди, работающие в организации (staff)", "работа на себя, а не по найму (self-employment)"], "pool": ["-", "employee", "graduate", "teleworker", "trainee"], "poolru": {"-": "нет подходящего понятия", "employee": "наёмный работник, сотрудник", "graduate": "выпускник вуза", "teleworker": "удалённый работник", "trainee": "стажёр, обучаемый"}, "ans": "", "img": null, "oimg": [], "e": "Все четыре понятия обозначают человека, поэтому каждое определение начинается с someone, и решает вторая половина фразы. graduate — «someone who has completed a university degree, especially a first degree»: маркер university degree, человек с законченным высшим образованием. employee — «someone who is paid to work for someone else»: маркер is paid to work for someone else, то есть человеку платят за работу на другого, это наёмный сотрудник. trainee — «someone who is being trained for a job»: маркер is being trained (его обучают, пассив), значит это стажёр, а не тот, кто обучает. teleworker — «someone who works from home, and communicates ... using the Internet, email and telephone»: маркеры from home и Internet, удалённый работник. Определение «the people who work for an organization» описывает staff (персонал) — обратите внимание, что здесь people во множественном числе, а не someone, то есть речь о коллективе целиком; такого слова среди понятий нет, ставим «-». Определение «working for yourself and not employed by a company» описывает self-employment (работу на себя) и вдобавок начинается с герундия working, то есть называет не человека, а занятие; и этого слова в списке нет, снова «-». Помните, что два определения без пары — это устройство задания: шесть определений на четыре понятия, две строки обязательно окажутся лишними.", "w": [], "k": "Смотрите на форму начала определения: если строка начинается с someone — это про одного человека и одно из четырёх слов; если с the people или с -ing, слова в списке почти наверняка нет."},
{"id": "дем-22", "t": 8, "ty": "match", "блок": "III. Соответствие", "q": "Подберите по одному определению к каждому из данных понятий. Определение, которому не досталось понятия, обозначьте знаком «-».", "qru": "", "o": [], "oru": [], "a": [], "pairs": [{"l": "a piece of writing about a particular subject in a newspaper or journal", "r": "article"}, {"l": "an official document that carefully considers a particular subject", "r": "report"}, {"l": "a short official note to another person in the same company", "r": "memo"}, {"l": "an official statement giving information to the newspapers or television", "r": "press release"}, {"l": "a short description of the main events or ideas in a book, film etc", "r": "-"}, {"l": "a short piece of writing about a particular subject", "r": "-"}], "pairsru": ["текст на определённую тему в газете или журнале", "официальный документ, подробно рассматривающий определённый предмет", "короткая служебная записка другому человеку в той же компании", "официальное заявление, дающее сведения газетам или телевидению", "краткое изложение основных событий или идей книги, фильма и т. п. (summary)", "короткий текст на определённую тему (note)"], "pool": ["-", "article", "memo", "press release", "report"], "poolru": {"-": "нет подходящего понятия", "article": "статья", "memo": "служебная записка", "press release": "пресс-релиз", "report": "отчёт, доклад"}, "ans": "", "img": null, "oimg": [], "e": "Здесь все понятия — виды письменного текста, поэтому различает их то, где текст публикуется и кому адресован. article — «a piece of writing about a particular subject in a newspaper or journal»: маркер in a newspaper or journal, то есть текст в газете или журнале, статья. report — «an official document that carefully considers a particular subject»: маркеры official document и carefully considers, подробный официальный документ, отчёт или доклад. memo — «a short official note to another person in the same company»: маркер in the same company, записка внутри своей организации. press release — «an official statement giving information to the newspapers or television»: маркер to the newspapers or television, заявление наружу, для прессы; сравните с memo, который идёт внутрь компании. Определение «a short description of the main events or ideas in a book, film etc» описывает summary (краткое изложение) — маркер description of the main events; этого слова среди понятий нет, ставим «-». Определение «a short piece of writing about a particular subject» описывает note (заметку): формулировка почти как у article, но без указания на газету или журнал, поэтому на article она не годится; такого слова в списке тоже нет, снова «-». Как всегда в этом типе задания, определений шесть, а понятий четыре, и две строки остаются с прочерком по замыслу составителя.", "w": [], "k": "Ищите в определении адресата и место публикации: memo — внутрь компании, press release — наружу в прессу, article — в газете или журнале, report — официальный документ."},
{"id": "дем-23", "t": 7, "ty": "gaps", "блок": "IV. Текст с пропусками", "q": "Заполните пропуски данными после текста словосочетаниями.\n\nTravelling by road is widely accepted as ... (1) ... to travel with far more deaths per kilometer than rail, sea or air. In fact, while road traffic injuries represent about 25% of worldwide injury-related deaths, ... (2) ... in the UK have been decreasing for some time, with last year's figure standing at 3,150. We ... (3) ... why the number is decreasing, but why it seems impossible to eradicate fatalities completely.\n\nOver the years, different methods of ... (4) ... have been tried. The Locomotive and Highways Act of 1865 ... (5) ... of speed limits to the motoring world. Since then, more and more ways of controlling the behavior of drivers have been introduced, ... (6) ... and traffic signals, as well as compulsory driver testing and licensing. These days, there are many more methods of enforcement, including speed cameras and fines for ... (7) ... . Another solution is to make cars themselves safer ... (8) ... .", "qru": "Поездки по дорогам общепризнанно считаются ... (1) ... передвижения: смертей на километр пути здесь намного больше, чем на железной дороге, на море или в воздухе. При этом, хотя дорожно-транспортный травматизм даёт около 25% всех смертей от травм в мире, ... (2) ... в Великобритании уже некоторое время снижается: прошлогодняя цифра — 3150. Мы ... (3) ... не на то, почему это число падает, а на то, почему полностью избавиться от смертей на дорогах, судя по всему, невозможно.\n\nЗа эти годы перепробовали разные способы ... (4) ... . Закон о локомотивах и дорогах 1865 года ... (5) ... ограничения скорости в мире автомобильного движения. С тех пор появлялось всё больше способов управлять поведением водителей, ... (6) ... и светофоры, а также обязательные экзамены и права. Сегодня методов принуждения ещё больше: камеры контроля скорости и штрафы за ... (7) ... . Ещё одно решение — делать сами машины безопаснее ... (8) ... .", "o": [], "oru": [], "a": [], "pairs": [{"l": "(1)", "r": "being the most dangerous way"}, {"l": "(2)", "r": "fatalities on the road"}, {"l": "(3)", "r": "take a look at"}, {"l": "(4)", "r": "reducing the number of crashes"}, {"l": "(5)", "r": "introduced the idea"}, {"l": "(6)", "r": "such as one-way streets"}, {"l": "(7)", "r": "breaking motoring laws"}, {"l": "(8)", "r": "in case of an accident"}], "pairsru": ["", "", "", "", "", "", "", ""], "pool": ["being the most dangerous way", "breaking motoring laws", "fatalities on the road", "in case of an accident", "introduced the idea", "reducing the number of crashes", "such as one-way streets", "take a look at"], "poolru": {"being the most dangerous way": "будучи самым опасным способом", "breaking motoring laws": "нарушение правил дорожного движения", "fatalities on the road": "смертельные случаи на дорогах", "in case of an accident": "на случай аварии", "introduced the idea": "ввёл (в обиход) саму мысль", "reducing the number of crashes": "снижение числа аварий", "such as one-way streets": "такие как улицы с односторонним движением", "take a look at": "посмотреть, разобраться"}, "ans": "", "img": null, "oimg": [], "e": "(1) being the most dangerous way — после accepted as нужна именная группа, а не глагол в личной форме, поэтому берётся форма на -ing; смысл подтверждается продолжением «far more deaths per kilometer». (2) fatalities on the road — это подлежащее при сказуемом have been decreasing, значит нужна группа существительного во множественном числе, и по смыслу снижается именно число смертей на дорогах. (3) take a look at — после подлежащего We нужна личная форма глагола, а конструкция «not ... why, but why» требует глагола с предлогом at перед придаточным. (4) reducing the number of crashes — после предлога of в «methods of ...» ставится герундий, поэтому подходит только вариант на -ing со смыслом «снижения числа аварий». (5) introduced the idea — у предложения есть подлежащее The Locomotive and Highways Act of 1865, но нет сказуемого, значит нужен глагол в прошедшем времени, а дальше идёт of speed limits, что даёт сочетание the idea of. (6) such as one-way streets — рядом стоит «and traffic signals», то есть пропуск должен закончиться существительным в том же ряду, а вводит перечисление оборот such as. (7) breaking motoring laws — после предлога for нужен герундий, и штрафуют именно за нарушение правил. (8) in case of an accident — предложение уже закончено («to make cars themselves safer»), поэтому остаётся обстоятельство с предлогом: машины делают безопаснее на случай аварии.", "w": [], "k": "Сначала прочитайте текст целиком и поймите, о чём он, и только потом вставляйте: у каждого пропуска смотрите на слово прямо перед ним (предлог, артикль, подлежащее) и на слово сразу после — они и задают нужную форму."},
{"id": "дем-24", "t": 7, "ty": "gaps", "блок": "IV. Текст с пропусками", "q": "Заполните пропуски данными после текста словосочетаниями.\n\nSpeech recognition (SR) is the method by which you can ... (1) ... to bring words up on the screen. It may have been ... (2) ..., but several European software companies have developed some wonderful SR software. The idea is not new - but it did take the business world a long time ... (3) ... . Dragon Systems invented it as far back as 1984, and although a one-person system cost $32,000 eight years ago, there are now excellent SR software packages ... (4) ... as little as $30.\n\nThe new products are so amazing that four years ago, IBM's speech recognition program was ... (5) ... for several weeks, even beating the most popular computer games of the time. Recognizing words and turning them into text may seem magic ... (6) ... , but it is even cleverer than that. If you ... (7) ... , you will notice that the system waits a fraction of a second before the words come up. There is a very good reason for that moment of hesitation: the system knows how words ... (8) ... !", "qru": "Распознавание речи (SR) — это способ, которым можно ... (1) ..., чтобы слова появились на экране. Возможно, это было ... (2) ..., но несколько европейских компаний разработали замечательные программы распознавания речи. Идея не нова, однако деловому миру и правда понадобилось много времени, ... (3) ... . Dragon Systems изобрела её ещё в 1984 году, и хотя восемь лет назад система на одного человека стоила 32 000 долларов, сейчас есть отличные пакеты распознавания речи, ... (4) ... всего 30 долларов.\n\nНовые продукты настолько удивительны, что четыре года назад программа распознавания речи от IBM несколько недель была ... (5) ..., обойдя даже самые популярные компьютерные игры того времени. Распознавать слова и превращать их в текст может показаться волшебством ... (6) ..., но всё ещё хитрее. Если ... (7) ..., вы заметите, что система выжидает долю секунды, прежде чем слова появятся. У этой заминки есть очень веская причина: система знает, как слова ... (8) ...!", "o": [], "oru": [], "a": [], "pairs": [{"l": "(1)", "r": "talk to a computer"}, {"l": "(2)", "r": "an American invention"}, {"l": "(3)", "r": "to catch up with it"}, {"l": "(4)", "r": "available for"}, {"l": "(5)", "r": "at the top of the software-sales charts"}, {"l": "(6)", "r": "in itself"}, {"l": "(7)", "r": "pay close attention"}, {"l": "(8)", "r": "go together"}], "pairsru": ["", "", "", "", "", "", "", ""], "pool": ["an American invention", "at the top of the software-sales charts", "available for", "go together", "in itself", "pay close attention", "talk to a computer", "to catch up with it"], "poolru": {"an American invention": "американское изобретение", "at the top of the software-sales charts": "на вершине рейтингов продаж программ", "available for": "доступный за (такую-то цену)", "go together": "сочетаются друг с другом", "in itself": "само по себе", "pay close attention": "внимательно приглядеться", "talk to a computer": "говорить с компьютером", "to catch up with it": "чтобы её подхватить, догнать"}, "ans": "", "img": null, "oimg": [], "e": "(1) talk to a computer — после модального can нужна начальная форма глагола без to, и по смыслу распознавание речи это способ говорить с компьютером. (2) an American invention — перед пропуском стоит It may have been, то есть связка be требует именной части, а противопоставление «but several European software companies» подсказывает, что речь была об американском происхождении. (3) to catch up with it — оборот it took the business world a long time требует инфинитива с to, а it в конце отсылает к the idea из предыдущего предложения. (4) available for — после существительного packages идёт определение-прилагательное, а перед суммой as little as $30 нужен предлог for, который и входит в это сочетание. (5) at the top of the software-sales charts — после was нужна именная или предложная группа, и продолжение «even beating the most popular computer games» указывает на первое место в рейтингах продаж. (6) in itself — предложение «may seem magic» уже полное, а дальше идёт but it is even cleverer than that, то есть противопоставление «само по себе — но на деле ещё хитрее». (7) pay close attention — после If you нужна личная форма глагола в настоящем времени: в придаточном условия будущее не ставится, поэтому именно pay, а не will pay. (8) go together — после подлежащего words нужен глагол во множественном числе без -s; смысл в том, что система знает, какие слова сочетаются друг с другом, и потому выжидает долю секунды.", "w": [], "k": "Действуйте от грамматики: определите, какая часть речи требуется в пропуске (после модального — инфинитив, после предлога — герундий, после was — именная часть), это обычно сразу отсекает большинство вариантов."},
{"id": "дем-25", "t": 7, "ty": "gaps", "блок": "IV. Текст с пропусками", "q": "Заполните пропуски данными после текста словосочетаниями.\n\nOffice staff leave equipment switched on unnecessarily for ... (1) ... . These include fear of damaging the machine, ... (2) ... of the actual cost of running the machine, and just plain laziness. Failure to control ... (3) ... of office equipment is wasteful, and can lead to costs far higher than most managers realize.\n\nThe Energy Efficiency and Conservation Authority (EECA) is introducing a two-fold programme ... (4) ... saving the $55m which is wasted every year in the country's offices. Office machines consume 400 GWh of energy per year, or about 1.5% of the country's ... (5) ... . Further, the EECA now estimates that ... (6) ... will double before the end of the decade. By this time, office machinery energy consumption is expected to be around 800 GWh ... (7) ... . Most PCs, printers and photocopiers are ... (8) ... for only about 40% of a working day.", "qru": "Сотрудники офисов оставляют технику включённой без нужды по ... (1) ... . Среди них — страх повредить машину, ... (2) ... о реальной стоимости её работы и просто лень. Неумение контролировать ... (3) ... офисной техники ведёт к растратам и к расходам куда большим, чем полагает большинство руководителей.\n\nУправление по энергоэффективности и энергосбережению (EECA) вводит двойную программу, ... (4) ... на то, чтобы сберечь 55 млн долларов, ежегодно теряемых в офисах страны. Офисная техника потребляет 400 ГВт·ч энергии в год, то есть около 1,5% ... (5) ... страны. Более того, по нынешним оценкам EECA, ... (6) ... удвоится до конца десятилетия. К этому времени потребление энергии офисной техникой ожидается на уровне около 800 ГВт·ч ... (7) ... . Большинство компьютеров, принтеров и копиров ... (8) ... лишь около 40% рабочего дня.", "o": [], "oru": [], "a": [], "pairs": [{"l": "(1)", "r": "a number of reasons"}, {"l": "(2)", "r": "lack of knowledge"}, {"l": "(3)", "r": "the energy usage"}, {"l": "(4)", "r": "aimed at"}, {"l": "(5)", "r": "total electricity consumption"}, {"l": "(6)", "r": "the number of office machines"}, {"l": "(7)", "r": "per year"}, {"l": "(8)", "r": "fully utilize"}], "pairsru": ["", "", "", "", "", "", "", ""], "pool": ["a number of reasons", "aimed at", "fully utilize", "lack of knowledge", "per year", "the energy usage", "the number of office machines", "total electricity consumption"], "poolru": {"a number of reasons": "ряд причин", "aimed at": "нацеленная на", "fully utilize": "полностью загружены (в тексте программы форма дана без -d)", "lack of knowledge": "нехватка знаний, неосведомлённость", "per year": "в год", "the energy usage": "потребление энергии", "the number of office machines": "число офисных машин", "total electricity consumption": "общее потребление электроэнергии"}, "ans": "", "img": null, "oimg": [], "e": "(1) a number of reasons — после предлога for нужна именная группа, а следующее предложение начинается с These include, то есть перед ним должно стоять множественное число, «ряд причин». (2) lack of knowledge — пропуск стоит в перечислении между fear of damaging и plain laziness, значит нужна такая же именная группа, и дальше идёт of the actual cost, что даёт сочетание lack of knowledge of. (3) the energy usage — после «Failure to control ...» требуется дополнение с артиклем, а следующее of office equipment показывает, что контролируют именно потребление энергии техникой. (4) aimed at — после существительного programme идёт определение-причастие, а перед герундием saving нужен предлог at: programme aimed at saving. (5) total electricity consumption — после «about 1.5% of the country's ...» нужна именная группа без артикля (артикль заменён притяжательным the country's), и процент считается от общего потребления электроэнергии. (6) the number of office machines — это подлежащее при сказуемом will double, поэтому нужна группа существительного; удваиваться по смыслу может число машин, а не сама энергия, о которой уже сказано выше. (7) per year — рядом стоит цифра 800 GWh, и её нужно привязать ко времени, как и в предыдущем предложении «400 GWh of energy per year». (8) fully utilize — по смыслу большинство компьютеров, принтеров и копиров загружены лишь около 40% рабочего дня. Честно предупреждаю: по грамматике после are здесь требовалось бы страдательное причастие fully utilized, и в тексте самой демоверсии стоит форма без -d, то есть это опечатка составителей; но подставлять всё равно нужно fully utilize, потому что других вариантов в списке не осталось.", "w": [], "k": "Начните с пропусков, где рядом стоит явный сигнал — предлог, цифра или сказуемое, к которому нужно подлежащее; когда лёгкие пропуски закрыты, оставшиеся варианты сами распределятся по остальным местам."},

window.ПАМЯТКИ = {"0": "<h2>Времена и согласование времён</h2><p>Эта тема даёт умение по одному слову-маркеру в предложении понять, какое из 12 времён туда встаёт, и не попасться на «почти правильную» форму.</p><h3>Как устроена вся система</h3><p>В английском времени всегда два вопроса: <b>когда</b> (прошлое / настоящее / будущее) и <b>как</b> (просто факт / процесс / результат / процесс к моменту). Пересечение даёт 12 клеток. Ничего заучивать наизусть не надо — надо понять две детали, из которых всё собирается:</p><ul><li><b>be + -ing</b> = процесс, действие в разгаре</li><li><b>have + V3</b> (третья форма, причастие) = результат к какому-то моменту</li></ul><p>Если нужно и то и другое сразу, они складываются: <b>have been + -ing</b> — процесс, который длится и уже накопил срок.</p><h3>Таблица всех 12 времён</h3><table><thead><tr><th>Время</th><th>Формула</th><th>Пример</th><th>Перевод</th><th>Маркеры</th></tr></thead><tbody><tr><td>Present Simple</td><td>V / V-s</td><td>She writes reports.</td><td>Она пишет отчёты (вообще).</td><td>usually, every day, often, always</td></tr><tr><td>Present Continuous</td><td>am/is/are + V-ing</td><td>She is writing a report.</td><td>Она сейчас пишет отчёт.</td><td>now, at the moment, today</td></tr><tr><td>Present Perfect</td><td>have/has + V3</td><td>She has written the report.</td><td>Она написала отчёт (он готов).</td><td>already, just, yet, ever, never, in the past few years, since, for</td></tr><tr><td>Present Perfect Continuous</td><td>have/has been + V-ing</td><td>She has been writing for two hours.</td><td>Она пишет уже два часа.</td><td>for two hours, since morning, all day</td></tr><tr><td>Past Simple</td><td>V2 (V-ed)</td><td>She wrote the report.</td><td>Она написала отчёт (вчера).</td><td>yesterday, last year, in 2015, ago</td></tr><tr><td>Past Continuous</td><td>was/were + V-ing</td><td>She was writing when I came.</td><td>Она писала, когда я вошёл.</td><td>while, when, at 5 o&#x27;clock yesterday</td></tr><tr><td>Past Perfect</td><td>had + V3</td><td>She had written it before he came.</td><td>Она написала до того, как он пришёл.</td><td>before, after, by that time, already (в прошлом)</td></tr><tr><td>Past Perfect Continuous</td><td>had been + V-ing</td><td>She had been writing for an hour.</td><td>Она писала уже час (к тому моменту).</td><td>for + срок + к моменту в прошлом</td></tr><tr><td>Future Simple</td><td>will + V</td><td>She will write the report.</td><td>Она напишет отчёт.</td><td>tomorrow, next week, in a year</td></tr><tr><td>Future Continuous</td><td>will be + V-ing</td><td>At 5 she will be writing.</td><td>В пять она будет писать.</td><td>at 5 tomorrow, this time next week</td></tr><tr><td>Future Perfect</td><td>will have + V3</td><td>By Friday she will have written it.</td><td>К пятнице она напишет.</td><td>by + момент в будущем</td></tr><tr><td>Future Perfect Continuous</td><td>will have been + V-ing</td><td>By Friday she will have been writing for three weeks.</td><td>К пятнице она будет писать уже три недели.</td><td>by + момент <b>и</b> for + срок</td></tr></tbody></table><h3>Правила по одному</h3><p><b>Правило 1. Present Simple — про постоянное, а не про сейчас.</b> Where do you come from? — I&#x27;m from Chile. (Откуда вы родом? — Я из Чили.) Ошибка: ставить Continuous там, где речь о факте, который верен всегда.</p><p><b>Правило 2. Present Continuous — процесс в момент речи.</b> Look, it is raining. (Смотри, идёт дождь.) Ошибка: загонять в Continuous глаголы состояния. <b>Belong, know, want, love, need, understand, see, hear</b> в Continuous не ставятся: не <i>is belonging</i>, а <b>belongs</b>.</p><p><b>Правило 3. Present Perfect — прошлое действие, важное сейчас результатом.</b> In the past few years the development of communications <b>has permitted</b> stock exchanges to attract orders. (За последние несколько лет развитие связи позволило биржам привлекать заказы.) Ошибка: Past Simple при маркере, который тянет период до сегодня. In the past few years, recently, lately, so far, this week — всё это Present Perfect.</p><p><b>Правило 4. Present Perfect с for/since — действие началось раньше и продолжается.</b> Nobody <b>has lived</b> in this house for a long time. (В этом доме давно никто не живёт.) Ошибка: русское «живёт» тянет за собой Present Simple. Но <b>for a long time / since 2010 = have/has + V3</b>.</p><p><b>Правило 5. Past Simple — законченное прошлое с точной датой.</b> These figures reached a peak <b>in 2015</b>. (Показатели достигли пика в 2015 году.) Ошибка: Present Perfect при yesterday, last year, in 2015. С точной датой в прошлом — только вторая форма.</p><p><b>Правило 6. Past Continuous — фон, на котором произошло другое действие.</b> I couldn&#x27;t make out what they <b>were talking</b> about. (Я не мог разобрать, о чём они говорили.) Ошибка: are talking. Если главный глагол в прошлом, придаточное тоже уходит в прошлое.</p><p><b>Правило 7. Past Perfect — «предпрошедшее», действие раньше другого прошлого.</b> When I arrived, the train <b>had</b> already <b>left</b>. (Когда я приехал, поезд уже ушёл.) Ошибка: два Past Simple подряд там, где важно, что одно было раньше.</p><p><b>Правило 8. Future Perfect — действие завершится к моменту в будущем.</b> By Friday I <b>will have finished</b> the article. (К пятнице я закончу статью.) Ошибка: will finish. Слово <b>by</b> («к») требует have + V3.</p><p><b>Правило 9. Future Perfect Continuous — к моменту в будущем действие уже длится столько-то.</b> By the end of the week Jane <b>will have been writing</b> the report for three weeks. (К концу недели Джейн будет писать отчёт уже три недели.) Ошибка: will be writing — это «будет писать в тот момент», без накопленного срока. Формула-ключ: <b>by + точка в будущем + for + срок = will have been doing.</b></p><h3>Согласование времён</h3><p>Правило одно: <b>если главный глагол ушёл в прошлое, придаточное тоже сдвигается на шаг назад.</b></p><table><thead><tr><th>В прямой речи</th><th>В придаточном после прошедшего</th></tr></thead><tbody><tr><td>Present Simple (works)</td><td>Past Simple (worked)</td></tr><tr><td>Present Continuous (is working)</td><td>Past Continuous (was working)</td></tr><tr><td>Present Perfect (has worked)</td><td>Past Perfect (had worked)</td></tr><tr><td>Past Simple (worked)</td><td>Past Perfect (had worked)</td></tr><tr><td>will work</td><td>would work</td></tr><tr><td>can</td><td>could</td></tr></tbody></table><p>He says he <b>is</b> busy. → He said he <b>was</b> busy. (Он сказал, что занят.) I couldn&#x27;t make out what they <b>were talking</b> about — couldn&#x27;t в прошлом, поэтому were talking, а не are talking.</p><p>Сдвига <b>не</b> происходит, если факт верен всегда: He said that water <b>boils</b> at 100 degrees. (Он сказал, что вода кипит при ста градусах.)</p><h3>Порядок слов в косвенном вопросе</h3><p>Косвенный вопрос — уже не вопрос. Порядок слов прямой, вспомогательный do исчезает. I couldn&#x27;t make out what <b>they were talking</b> about. — а не <i>what were they talking</i>. Ошибка: тянуть вопросительную инверсию в придаточное. Как только вопрос стал частью предложения, он выпрямляется.</p><h3 class=\"prog\">Правильные и неправильные глаголы</h3><p>Правило: <b>у правильных глаголов вторая и третья формы совпадают и делаются окончанием -ed; у неправильных их надо знать наизусть.</b></p><p>Правильный глагол: work — worked — worked. Неправильный: write — wrote — written.</p><h4 class=\"prog\">Как пишется -ed</h4><table><thead><tr><th>Что за глагол</th><th>Что делаем</th><th>Пример</th></tr></thead><tbody><tr><td>Обычный</td><td>просто + ed</td><td>work → worked, ask → asked</td></tr><tr><td>Заканчивается на -e</td><td>+ d</td><td>like → liked, use → used</td></tr><tr><td>Согласная + y</td><td>y → i + ed</td><td>study → studied, apply → applied</td></tr><tr><td>Гласная + y</td><td>y остаётся</td><td>play → played, enjoy → enjoyed</td></tr><tr><td>Один слог, гласная между согласными</td><td>согласная удваивается</td><td>stop → stopped, plan → planned</td></tr><tr><td>Два слога с ударением на последний</td><td>согласная удваивается</td><td>prefer → preferred, permit → permitted</td></tr></tbody></table><ul><li>They <b>stopped</b> the negotiations. — Они прекратили переговоры.</li><li>She <b>studied</b> economics. — Она изучала экономику.</li></ul><h4 class=\"prog\">Как читается -ed</h4><table><thead><tr><th>После какого звука</th><th>Читается</th><th>Пример</th></tr></thead><tbody><tr><td>глухой согласный (k, p, s, f, sh, ch)</td><td>[t]</td><td>worked, asked, stopped</td></tr><tr><td>звонкий согласный и гласный</td><td>[d]</td><td>played, opened, lived</td></tr><tr><td>t или d</td><td>[ɪd] — лишний слог</td><td>wanted, needed, decided</td></tr></tbody></table><h4 class=\"prog\">Частые неправильные глаголы</h4><p>Легче запоминать группами по типу чередования.</p><p><b>Все три формы одинаковые:</b></p><table><thead><tr><th>V1</th><th>V2</th><th>V3</th><th>Перевод</th></tr></thead><tbody><tr><td>cost</td><td>cost</td><td>cost</td><td>стоить</td></tr><tr><td>cut</td><td>cut</td><td>cut</td><td>резать, сокращать</td></tr><tr><td>put</td><td>put</td><td>put</td><td>класть</td></tr><tr><td>set</td><td>set</td><td>set</td><td>устанавливать</td></tr><tr><td>read</td><td>read</td><td>read</td><td>читать (произношение меняется: [riːd] — [red] — [red])</td></tr></tbody></table><p><b>Вторая и третья формы совпадают:</b></p><table><thead><tr><th>V1</th><th>V2</th><th>V3</th><th>Перевод</th></tr></thead><tbody><tr><td>bring</td><td>brought</td><td>brought</td><td>приносить</td></tr><tr><td>buy</td><td>bought</td><td>bought</td><td>покупать</td></tr><tr><td>think</td><td>thought</td><td>thought</td><td>думать</td></tr><tr><td>teach</td><td>taught</td><td>taught</td><td>учить (кого-то)</td></tr><tr><td>build</td><td>built</td><td>built</td><td>строить</td></tr><tr><td>spend</td><td>spent</td><td>spent</td><td>тратить</td></tr><tr><td>send</td><td>sent</td><td>sent</td><td>посылать</td></tr><tr><td>lend</td><td>lent</td><td>lent</td><td>одалживать</td></tr><tr><td>keep</td><td>kept</td><td>kept</td><td>хранить</td></tr><tr><td>feel</td><td>felt</td><td>felt</td><td>чувствовать</td></tr><tr><td>leave</td><td>left</td><td>left</td><td>оставлять, уезжать</td></tr><tr><td>mean</td><td>meant</td><td>meant</td><td>значить</td></tr><tr><td>meet</td><td>met</td><td>met</td><td>встречать</td></tr><tr><td>lead</td><td>led</td><td>led</td><td>вести, возглавлять</td></tr><tr><td>lose</td><td>lost</td><td>lost</td><td>терять</td></tr><tr><td>find</td><td>found</td><td>found</td><td>находить</td></tr><tr><td>hold</td><td>held</td><td>held</td><td>держать, проводить (встречу)</td></tr><tr><td>pay</td><td>paid</td><td>paid</td><td>платить</td></tr><tr><td>say</td><td>said</td><td>said</td><td>сказать</td></tr><tr><td>sell</td><td>sold</td><td>sold</td><td>продавать</td></tr><tr><td>tell</td><td>told</td><td>told</td><td>сказать (кому-то)</td></tr><tr><td>stand</td><td>stood</td><td>stood</td><td>стоять, выдерживать</td></tr><tr><td>understand</td><td>understood</td><td>understood</td><td>понимать</td></tr><tr><td>make</td><td>made</td><td>made</td><td>делать</td></tr><tr><td>have</td><td>had</td><td>had</td><td>иметь</td></tr><tr><td>win</td><td>won</td><td>won</td><td>выигрывать</td></tr></tbody></table><p><b>Все три формы разные:</b></p><table><thead><tr><th>V1</th><th>V2</th><th>V3</th><th>Перевод</th></tr></thead><tbody><tr><td>be</td><td>was / were</td><td>been</td><td>быть</td></tr><tr><td>begin</td><td>began</td><td>begun</td><td>начинать</td></tr><tr><td>break</td><td>broke</td><td>broken</td><td>ломать</td></tr><tr><td>choose</td><td>chose</td><td>chosen</td><td>выбирать</td></tr><tr><td>do</td><td>did</td><td>done</td><td>делать</td></tr><tr><td>draw</td><td>drew</td><td>drawn</td><td>рисовать, извлекать (вывод)</td></tr><tr><td>drive</td><td>drove</td><td>driven</td><td>вести машину</td></tr><tr><td>eat</td><td>ate</td><td>eaten</td><td>есть</td></tr><tr><td>fall</td><td>fell</td><td>fallen</td><td>падать</td></tr><tr><td>give</td><td>gave</td><td>given</td><td>давать</td></tr><tr><td>go</td><td>went</td><td>gone</td><td>идти</td></tr><tr><td>grow</td><td>grew</td><td>grown</td><td>расти</td></tr><tr><td>know</td><td>knew</td><td>known</td><td>знать</td></tr><tr><td>rise</td><td>rose</td><td>risen</td><td>подниматься</td></tr><tr><td>see</td><td>saw</td><td>seen</td><td>видеть</td></tr><tr><td>show</td><td>showed</td><td>shown</td><td>показывать</td></tr><tr><td>speak</td><td>spoke</td><td>spoken</td><td>говорить</td></tr><tr><td>take</td><td>took</td><td>taken</td><td>брать</td></tr><tr><td>write</td><td>wrote</td><td>written</td><td>писать</td></tr></tbody></table><p><b>Особняком:</b> come — came — come, become — became — become, run — ran — run, get — got — got (амер. gotten).</p><p>Ошибка: путать колонки. V2 — это только Past Simple. V3 — это Present/Past/Future Perfect и весь пассив.</p><ul><li>She <b>wrote</b> the report yesterday. — Она написала отчёт вчера. (V2)</li><li>The report <b>has been written</b>. — Отчёт написан. (V3, не ~~has been wrote~~)</li></ul><h3 class=\"prog\">Страдательный залог</h3><p>Правило: <b>пассив = be в нужном времени + V3. Меняется только форма be, третья форма стоит неизменно.</b></p><p>Активный залог: <b>They built</b> the plant in 2010. Пассивный: The plant <b>was built</b> in 2010. — Завод был построен в 2010 году.</p><h4 class=\"prog\">Пассив по временам</h4><table><thead><tr><th>Время</th><th>Формула</th><th>Пример</th><th>Перевод</th></tr></thead><tbody><tr><td>Present Simple</td><td>am/is/are + V3</td><td>The reports <b>are checked</b> every week.</td><td>Отчёты проверяют каждую неделю.</td></tr><tr><td>Past Simple</td><td>was/were + V3</td><td>The contract <b>was signed</b> in May.</td><td>Контракт подписали в мае.</td></tr><tr><td>Future Simple</td><td>will be + V3</td><td>The results <b>will be published</b> soon.</td><td>Результаты скоро опубликуют.</td></tr><tr><td>Present Continuous</td><td>am/is/are being + V3</td><td>The road <b>is being repaired</b>.</td><td>Дорогу сейчас ремонтируют.</td></tr><tr><td>Past Continuous</td><td>was/were being + V3</td><td>The road <b>was being repaired</b>.</td><td>Дорогу ремонтировали (в тот момент).</td></tr><tr><td>Present Perfect</td><td>have/has been + V3</td><td>The price <b>has been reduced</b>.</td><td>Цену снизили.</td></tr><tr><td>Past Perfect</td><td>had been + V3</td><td>The order <b>had been sent</b> before he called.</td><td>Заказ отправили до его звонка.</td></tr><tr><td>Future Perfect</td><td>will have been + V3</td><td>By June the plant <b>will have been built</b>.</td><td>К июню завод построят.</td></tr></tbody></table><p>Времён Perfect Continuous в пассиве практически нет: формы has been being done не употребляют. Если нужен такой смысл, предложение перестраивают в актив.</p><h4 class=\"prog\">Когда нужен пассив</h4><ul><li>Деятель неизвестен: My bag <b>was stolen</b>. — У меня украли сумку.</li><li>Деятель неважен: English <b>is spoken</b> here. — Здесь говорят по-английски.</li><li>Стиль научного и делового текста, где важно действие, а не тот, кто его делает. В экономических текстах пассив встречается постоянно: The data <b>were collected</b> in 2020. Prices <b>are determined</b> by supply and demand.</li></ul><h4 class=\"prog\">by и with</h4><p>Правило: <b>by — тот, кто сделал; with — то, чем сделали.</b></p><ul><li>The report was written <b>by</b> the analyst. — Отчёт написан аналитиком.</li><li>The chart was drawn <b>with</b> a special program. — График построен с помощью специальной программы.</li></ul><h4 class=\"prog\">Два дополнения</h4><p>Если у глагола два дополнения (give, send, show, tell, offer, pay), пассив можно построить двумя способами, и чаще берут первый — с человеком в начале.</p><ul><li>They gave him a book. → He <b>was given</b> a book. — Ему дали книгу.</li><li>→ A book <b>was given to</b> him. — Книгу дали ему. (предлог to обязателен)</li></ul><h4 class=\"prog\">Фразовые глаголы</h4><p>Правило: <b>предлог остаётся при глаголе и в пассиве.</b></p><ul><li>They put off the meeting. → The meeting <b>was put off</b>. — Встречу отложили.</li><li>Somebody must look after the children. → The children must <b>be looked after</b>. — За детьми надо присматривать.</li></ul><p>Ошибка: терять предлог — ~~The meeting was put~~.</p><h4 class=\"prog\">Пассив с модальными</h4><p>Правило: <b>модальный глагол + be + V3.</b></p><ul><li>The work <b>must be done</b> by Friday. — Работа должна быть сделана к пятнице.</li><li>It <b>can be explained</b> easily. — Это легко объяснить.</li><li>The document <b>should have been signed</b>. — Документ следовало подписать.</li></ul><h4 class=\"prog\">Ловушки пассива</h4><ul><li>Пропуск be: ~~The house built in 1990~~ → The house <b>was built</b> in 1990.</li><li>V2 вместо V3: ~~The house was build~~, ~~was wrote~~, ~~has been took~~ → was <b>built</b>, was <b>written</b>, has been <b>taken</b>.</li><li>Лишнее be в активе: ~~They were built the house~~ — здесь деятель есть, значит нужен актив: They <b>built</b> the house.</li><li>be в правильном времени: пассив Past Perfect — <b>had been</b> done, а не ~~was been done~~.</li></ul><h3 class=\"prog\">Вспомогательные глаголы</h3><p>Правило: <b>вспомогательный глагол сам ничего не значит — он показывает время, вопрос, отрицание или залог. Смысловой глагол после него стоит в начальной форме.</b></p><table><thead><tr><th>Вспомогательный</th><th>Зачем нужен</th><th>Пример</th></tr></thead><tbody><tr><td>do / does / did</td><td>вопрос и отрицание в Present и Past Simple</td><td><b>Does</b> he work here? / He <b>doesn&#x27;t</b> work here.</td></tr><tr><td>am / is / are / was / were</td><td>Continuous и пассив</td><td>She <b>is</b> working. / It <b>was</b> done.</td></tr><tr><td>have / has / had</td><td>все времена Perfect</td><td>They <b>have</b> finished.</td></tr><tr><td>will</td><td>будущее</td><td>We <b>will</b> discuss it.</td></tr></tbody></table><p>Главная ловушка: <b>время выражается один раз — во вспомогательном глаголе.</b></p><ul><li><b>Did</b> he <b>go</b> there? — Он туда ходил? (не ~~did he went~~)</li><li>She <b>doesn&#x27;t know</b> the answer. — Она не знает ответа. (не ~~doesn&#x27;t knows~~)</li><li><b>Does</b> he <b>work</b> here? — Он здесь работает? (не ~~does he works~~)</li><li>He <b>has finished</b>. — Он закончил. (не ~~has finish~~)</li></ul><p>В утвердительном Present и Past Simple вспомогательного нет вообще: He <b>works</b> here (не ~~he does work here~~ — так говорят только для усиления: He <b>does</b> work here, «он действительно здесь работает»).</p><p>Вспомогательный глагол — это ещё и то, что подхватывает короткий ответ и хвостовой вопрос: Do you know him? — Yes, I <b>do</b>. He works here, <b>doesn&#x27;t he</b>?</p><h3>Ловушки этой темы</h3><p><b>«will be writing» вместо «will have been writing».</b> В вопросе en-0036 есть сразу два маркера: by the end of the week (точка) и for three weeks (срок). Один will be writing показывает только момент — он не объясняет, откуда взялись три недели. Нужно Future Perfect Continuous.</p><p><b>«has been writing» при разговоре о будущем.</b> Форма правильная, но она про «уже пишет к сегодня». А в предложении by the end of the week — точка ещё не наступила, значит нужно will.</p><p><b>«is writing» при by the end of the week.</b> Present Continuous не умеет дотягиваться до будущей точки с накопленным сроком.</p><p><b>«won&#x27;t still be finished» вместо «still won&#x27;t be finished».</b> Still в отрицании стоит <b>перед</b> вспомогательным глаголом: it <b>still won&#x27;t</b> be finished (всё ещё не будет закончен). А yet идёт в конец предложения: it won&#x27;t be finished <b>yet</b>. Смешивать нельзя: won&#x27;t be yet finished — это ломаный порядок.</p><p><b>Вопросительный порядок в придаточном</b> (did the talk, were they talking) — маркер неверного варианта в en-0001. Если перед пропуском стоит what / where / why / whether внутри предложения, инверсии там быть не может.</p><p><b>Двойное указание времени.</b> Если в предложении уже есть last year или yesterday, никакой Present Perfect туда не встанет, каким бы «более полным» он ни казался.</p><h3>Чек-лист перед ответом</h3><ol><li>Найди маркер времени: by, for, since, last year, in the past few years, now.</li><li>Реши, нужен ли результат (have + V3) и нужен ли процесс (be + -ing).</li><li>Если главный глагол в прошлом — сдвинь придаточное назад.</li><li>Проверь порядок слов: в придаточном он всегда прямой.</li><li>Проверь, что форма вообще существует: после will идёт <b>be</b> или <b>have</b>, но не готовое время.</li><li>Взял неправильный глагол — проверь колонку: V2 только для Past Simple, во всех Perfect и в пассиве нужна V3.</li><li>Пассив? Убедись, что на месте оба куска: <b>be</b> в нужном времени <b>и</b> третья форма (was built, а не was build).</li><li>Есть вспомогательный do/does/did — смысловой глагол после него в начальной форме, без -s и без -ed.</li></ol>", "1": "<h2>Условные предложения и модальные глаголы</h2><p>Эта тема даёт две вещи: как выбрать пару времён в предложениях с if и как одним модальным глаголом выразить оттенок — обязанность, разрешение, догадку о прошлом.</p><h3>Условные предложения: четыре типа и смешанный</h3><p>Условное предложение состоит из двух частей: придаточного с <b>if</b> (условие) и главного (следствие). Тип определяется тем, насколько условие реально и к какому времени относится.</p><table><thead><tr><th>Тип</th><th>Условие</th><th>В части с if</th><th>В главной части</th><th>О чём</th></tr></thead><tbody><tr><td>Нулевой</td><td>всегда верно</td><td>Present Simple</td><td>Present Simple</td><td>закон природы, привычка</td></tr><tr><td>Первый</td><td>реально в будущем</td><td>Present Simple</td><td>will + инфинитив</td><td>вероятное будущее</td></tr><tr><td>Второй</td><td>маловероятно / нереально сейчас</td><td>Past Simple (were)</td><td>would + инфинитив</td><td>фантазия про настоящее</td></tr><tr><td>Третий</td><td>уже не измен
