<script>
/* ============================================================
   05 — экран вопроса: ввод ответа, проверка, переходы
   ============================================================ */

function текущий(){ return S?ПО_ID[S.items[S.i]]:null; }
function проверен(){ var q=текущий(); return !!(q&&S.done[q.id]); }

/* ---------- шапка ---------- */
function рисоватьШапку(){
  var q=текущий(); if(!q) return;
  $("#qCounter").textContent="Вопрос "+(S.i+1)+" из "+S.items.length+" · "+имяРежима(S);
  $("#qFill").style.width=Math.round(S.i/S.items.length*100)+"%";
  $("#qNoteBtn").classList.toggle("hidden",!ПАМЯТКИ[q.t]);
  var верных=0, всего=0;
  S.items.forEach(function(id){ if(S.done[id]){ всего++; if(S.ok[id]) верных++; } });
  $("#qScore").textContent=S.instant?(всего?(верных+"/"+всего):""):
    ("отвечено "+Object.keys(S.ans).filter(function(id){ return ответДан(ПО_ID[id],S.ans[id]); }).length+"/"+S.items.length);
}
var _tick=null;
function пуститьЧасы(){
  if(_tick) clearInterval(_tick);
  var upd=function(){ var c=$("#qClock"); if(c&&S) c.textContent=mmss(прошло()); };
  upd(); _tick=setInterval(upd,1000);
}
function стопЧасы(){ if(_tick){ clearInterval(_tick); _tick=null; } }

/* ---------- тело вопроса ---------- */
function рисоватьВопрос(){
  var q=текущий(); if(!q){ завершить(); return; }
  if(S.ans[q.id]===undefined) S.ans[q.id]=пустойОтвет(q);
  рисоватьШапку();
  пуститьЧасы();
  var body=$("#qBody"); body.innerHTML="";

  var meta=el("div","qmeta");
  meta.appendChild(el("span","chip acc",ТИП_ИМЯ[q.ty]||q.ty));
  meta.appendChild(el("span","chip",темаИмя(q.t)));
  if(q["блок"]) meta.appendChild(el("span","chip",q["блок"]));
  if(DB.wrong.indexOf(q.id)>=0) meta.appendChild(el("span","chip warn","была ошибка"));
  meta.appendChild(el("span","chip","№ "+q.id));
  body.appendChild(meta);

  /* в текстах с пропусками важны абзацы, поэтому переносы строк сохраняются */
  body.appendChild(el("p","qtext"+(q.ty==="gaps"?" pre":""),q.q));
  /* у соответствий условие и так по-русски — подстрочник совпал бы с ним слово в слово */
  if(q.qru&&q.qru!==q.q) body.appendChild(el("p","ru"+(q.ty==="gaps"?" pre":""),q.qru));
  if(q.img){
    var im=document.createElement("img");
    im.className="qimg"; im.src=q.img; im.alt="Иллюстрация к вопросу";
    im.onerror=function(){ this.remove(); };
    body.appendChild(im);
  }

  if(q.ty==="one"||q.ty==="many") body.appendChild(рисоватьВарианты(q));
  else if(q.ty==="short") body.appendChild(рисоватьКраткий(q));
  else if(поСтрокам(q)) body.appendChild(рисоватьСоответствие(q));

  if(S.done[q.id]) показатьРазбор(q,S.ans[q.id],body);
  обновитьКнопку();
}

/* У части вопросов варианты — это графики, а текст лишь помечает, что он на картинке */
function содержимоеВарианта(q,idx,text){
  var box=el("div","grow");
  var файл=q.oimg&&q.oimg[idx];
  if(text) box.appendChild(document.createTextNode(text));
  var ru=q.oru&&q.oru[idx];
  if(ru) box.appendChild(el("div","ru",ru));
  if(файл){
    var im=document.createElement("img");
    im.className="optimg"; im.src=файл; im.alt="Вариант "+(LET[idx]||idx+1);
    im.onerror=function(){ this.remove(); };
    box.appendChild(im);
  }
  return box;
}

function рисоватьВарианты(q){
  var box=el("div","opts");
  var готово=!!S.done[q.id];
  q.o.forEach(function(text,idx){
    var b=el("button","opt");
    b.type="button";
    b.dataset.i=idx;
    b.appendChild(el("div","k",LET[idx]||String(idx+1)));
    b.appendChild(содержимоеВарианта(q,idx,text));
    if(выбран(q,idx)) b.dataset.sel="1";
    if(готово){
      b.classList.add("off");
      var верныйВар=q.a.indexOf(idx)>=0, выбранВар=выбран(q,idx);
      if(верныйВар&&выбранВар) b.dataset.st="ok";
      else if(!верныйВар&&выбранВар) b.dataset.st="no";
      else if(верныйВар) b.dataset.st="miss";
      delete b.dataset.sel;
    } else {
      b.addEventListener("click",function(){ выбрать(q,idx); });
    }
    box.appendChild(b);
  });
  return box;
}
function выбран(q,idx){
  var v=S.ans[q.id];
  return q.ty==="one" ? v===idx : (Array.isArray(v)&&v.indexOf(idx)>=0);
}
function выбрать(q,idx){
  if(S.done[q.id]) return;
  if(q.ty==="one") S.ans[q.id]=(S.ans[q.id]===idx?null:idx);
  else {
    var v=(S.ans[q.id]||[]).slice();
    var p=v.indexOf(idx);
    if(p>=0) v.splice(p,1); else v.push(idx);
    v.sort(function(a,b){ return a-b; });
    S.ans[q.id]=v;
  }
  var box=$("#qBody").querySelector(".opts");
  if(box) Array.prototype.forEach.call(box.querySelectorAll(".opt"),function(b){
    if(выбран(q,+b.dataset.i)) b.dataset.sel="1"; else delete b.dataset.sel;
  });
  обновитьКнопку();
  сохранитьПопытку();
}

function рисоватьКраткий(q){
  var box=el("div","shortbox");
  var inp=document.createElement("input");
  inp.type="text"; inp.id="shortInput"; inp.name="shortInput";
  inp.setAttribute("aria-label","Ваш краткий ответ");
  inp.setAttribute("autocomplete","off");
  inp.setAttribute("autocapitalize","off");
  inp.setAttribute("spellcheck","false");
  inp.placeholder="Введите ответ";
  inp.value=S.ans[q.id]||"";
  if(S.done[q.id]) inp.disabled=true;
  else {
    inp.addEventListener("input",function(){ S.ans[q.id]=inp.value; обновитьКнопку(); });
    inp.addEventListener("change",сохранитьПопытку);
  }
  box.appendChild(inp);
  box.appendChild(el("div","hint","Регистр, ё/е, пробелы и знаки препинания не важны; словоформа тоже засчитывается."));
  return box;
}

function рисоватьСоответствие(q){
  var box=el("div","mtable");
  var готово=!!S.done[q.id];
  q.pairs.forEach(function(p,j){
    var row=el("div","mrow");
    /* в тексте с пропусками слева и так стоит номер пропуска — второй раз не нумеруем */
    var l=el("div","ml",q.ty==="gaps"?p.l:((j+1)+". "+p.l));
    if(q.pairsru&&q.pairsru[j]) l.appendChild(el("div","ru",q.pairsru[j]));
    var r=el("div","mr");
    var sel=document.createElement("select");
    sel.dataset.j=j;
    sel.name="m"+q.id+"_"+j;
    sel.id="m"+q.id+"_"+j;
    sel.setAttribute("aria-label","Соответствие для строки "+(j+1));
    var o0=document.createElement("option");
    o0.value=""; o0.textContent="— выберите —";
    sel.appendChild(o0);
    (q.pool||[]).forEach(function(text){
      var o=document.createElement("option");
      var ru=q.poolru&&q.poolru[text];
      o.value=text; o.textContent=ru?(text+" — "+ru):text;
      sel.appendChild(o);
    });
    var cur=(S.ans[q.id]||{})[j];
    if(cur) sel.value=cur;
    if(готово){
      sel.disabled=true;
      row.dataset.st=строкаВерна(q,S.ans[q.id],j)?"ok":"no";
      if(!строкаВерна(q,S.ans[q.id],j)){
        var ruv=q.poolru&&q.poolru[p.r];
        r.appendChild(el("div","fix","Верно: "+p.r+(ruv?" — "+ruv:"")));
      }
    } else {
      sel.addEventListener("change",function(){
        var v=Object.assign({},S.ans[q.id]||{});
        if(sel.value) v[j]=sel.value; else delete v[j];
        S.ans[q.id]=v; обновитьКнопку(); сохранитьПопытку();
      });
    }
    r.insertBefore(sel,r.firstChild);
    row.appendChild(l); row.appendChild(r);
    box.appendChild(row);
  });
  return box;
}

/* ---------- кнопка снизу ---------- */
function обновитьКнопку(){
  var q=текущий(), b=$("#nextBtn"); if(!q||!b) return;
  var последний=S.i>=S.items.length-1;
  if(S.instant){
    if(S.done[q.id]){ b.textContent=последний?"Показать итог":"Дальше →"; b.disabled=false; }
    else { b.textContent="Ответить"; b.disabled=!ответДан(q,S.ans[q.id]); }
  } else {
    b.textContent=последний?"Завершить и проверить":"Дальше →";
    b.disabled=false;
  }
}

function шаг(){
  var q=текущий(); if(!q) return;
  if(S.instant&&!S.done[q.id]){
    if(!ответДан(q,S.ans[q.id])) return;
    зачесть(q);
    рисоватьВопрос();
    var brk=document.getElementById("brkBox");
    if(brk) brk.scrollIntoView({behavior:"smooth",block:"nearest"});
    return;
  }
  if(S.i>=S.items.length-1){ завершить(); return; }
  S.i++;
  сохранитьПопытку();
  рисоватьВопрос();
}

function зачесть(q){
  var ok=верно(q,S.ans[q.id]);
  S.done[q.id]=true; S.ok[q.id]=ok;
  DB.seen[q.id]=(DB.seen[q.id]||0)+1;
  статТемы(q.t,ok);
  if(ok) снятьОшибку(q.id); else пометитьОшибку(q.id);
  сохранитьПопытку();
}

/* ---------- выход и клавиатура ---------- */
$("#quitBtn").addEventListener("click",function(){
  if(S) сохранитьПопытку();
  стопЧасы();
  домой();
});
$("#nextBtn").addEventListener("click",шаг);
$("#qNoteBtn").addEventListener("click",function(){
  var q=текущий(); if(q) показатьПамятку(q.t,true);
});

document.addEventListener("keydown",function(e){
  if($("#quiz").classList.contains("hidden")) return;
  var tag=(e.target.tagName||"").toLowerCase();
  var поле=(tag==="input"||tag==="select"||tag==="textarea");
  if(e.key==="Enter"){
    e.preventDefault();
    var b=$("#nextBtn"); if(!b.disabled) шаг();
    return;
  }
  if(e.key==="Escape"){ if(S) сохранитьПопытку(); стопЧасы(); домой(); return; }
  if(поле) return;
  var q=текущий(); if(!q||S.done[q.id]) return;
  if(q.ty!=="one"&&q.ty!=="many") return;
  var n=-1;
  if(/^[1-9]$/.test(e.key)) n=+e.key-1;
  var L=LET.indexOf(e.key.toUpperCase());
  if(L>=0) n=L;
  if(n>=0&&n<q.o.length){ e.preventDefault(); выбрать(q,n); }
});
</script>

<script>
/* ============================================================
   06 — разбор ответа, итоговый экран, запуск приложения
   ============================================================ */

/* ---------- вердикт + три блока разбора ---------- */
function показатьРазбор(q,v,box){
  var ok=S?S.ok[q.id]:верно(q,v);
  if(ok===undefined) ok=верно(q,v);

  var vd=el("div","verdict "+(ok?"ok":"no"));
  vd.appendChild(el("span","g",ok?"✓":"✕"));
  vd.appendChild(el("span",null,ok?"Верно":(ответДан(q,v)?"Неверно":"Ответ не дан")));
  box.appendChild(vd);

  var brk=el("div","card brk"); brk.id="brkBox";

  /* 1. правильный ответ */
  var s1=el("section");
  s1.appendChild(el("h3",null,"Правильный ответ"));
  s1.appendChild(правильныйОтвет(q));
  brk.appendChild(s1);

  /* 2. почему так */
  if(q.e){
    var s2=el("section");
    s2.appendChild(el("h3",null,"Почему так"));
    s2.appendChild(el("div","why",q.e));
    brk.appendChild(s2);
  }

  /* 3. почему остальные не подходят — построчно к вариантам */
  var wl=разборВариантов(q);
  if(wl){
    var s3=el("section");
    s3.appendChild(el("h3",null,"Почему остальные не подходят"));
    s3.appendChild(wl);
    brk.appendChild(s3);
  }

  /* 4. как запомнить */
  if(q.k){
    var s4=el("section");
    s4.appendChild(el("h3",null,"Как запомнить"));
    var h=el("div","hook");
    h.appendChild(el("span","g","◆"));
    h.appendChild(el("span","grow",q.k));
    s4.appendChild(h);
    brk.appendChild(s4);
  }

  box.appendChild(brk);
  return brk;
}

function правильныйОтвет(q){
  var wrap=el("div");
  if(q.ty==="one"||q.ty==="many"){
    q.a.forEach(function(idx){
      var line=el("div","ansline");
      line.appendChild(el("div","k",LET[idx]||String(idx+1)));
      line.appendChild(содержимоеВарианта(q,idx,q.o[idx]));
      wrap.appendChild(line);
    });
  } else if(q.ty==="short"){
    var l=el("div","ansline");
    l.appendChild(el("div","k","="));
    l.appendChild(el("div","grow",q.ans));
    wrap.appendChild(l);
  } else if(поСтрокам(q)){
    q.pairs.forEach(function(p,j){
      var l=el("div","ansline");
      l.appendChild(el("div","k",String(j+1)));
      l.appendChild(el("div","grow",p.l+" → "+p.r));
      wrap.appendChild(l);
    });
  }
  return wrap;
}

function разборВариантов(q){
  if(!q.w||!q.w.length) return null;
  var box=el("div"), было=false;
  q.o.forEach(function(text,idx){
    var t=q.w[idx];
    if(!t||q.a.indexOf(idx)>=0) return;
    было=true;
    var line=el("div","wline");
    line.appendChild(el("div","k",LET[idx]||String(idx+1)));
    var wt=el("div","wt grow");
    var файл=q.oimg&&q.oimg[idx];
    if(файл){
      var im=document.createElement("img");
      im.className="optimg"; im.src=файл; im.alt="Вариант "+(LET[idx]||idx+1);
      im.onerror=function(){ this.remove(); };
      wt.appendChild(im);
    } else {
      wt.appendChild(el("b",null,text));
    }
    wt.appendChild(document.createTextNode(" — "+t));
    line.appendChild(wt);
    box.appendChild(line);
  });
  return было?box:null;
}

/* ---------- итог ---------- */
function завершить(){
  if(!S) return;
  стопЧасы();
  /* в режиме экзамена ответы проверяются только сейчас */
  S.items.forEach(function(id){
    if(S.done[id]) return;
    var q=ПО_ID[id];
    if(!S.instant||ответДан(q,S.ans[id])) зачесть(q);
    else { S.done[id]=true; S.ok[id]=false; статТемы(q.t,false); пометитьОшибку(id); }
  });
  var верных=S.items.filter(function(id){ return S.ok[id]; }).length;
  if(S.mode==="exam"&&(верных>DB.best||DB.bestOf!==S.items.length)){
    DB.best=(DB.bestOf!==S.items.length)?верных:Math.max(DB.best,верных);
    DB.bestOf=S.items.length;
  }
  var итог={ mode:S.mode, topic:S.topic, items:S.items.slice(), ans:S.ans, ok:S.ok, ok_n:верных, time:прошло() };
  DB.resume=null; save();
  рисоватьИтог(итог);
  S=null;
  экран("result");
}

function рисоватьИтог(R){
  var box=$("#result"); box.innerHTML="";
  var n=R.items.length, p=Math.round(R.ok_n/n*100);

  var head=el("div","card score");
  head.appendChild(el("div","eyebrow",R.mode==="topic"?темаИмя(R.topic):
    R.mode==="exam"?"Вариант экзамена":R.mode==="demo"?"Демоверсия ФУ 2025":
    R.mode==="mist"?"Работа над ошибками":"Весь банк"));
  var big=el("div","big",R.ok_n+" / "+n); head.appendChild(big);
  head.appendChild(el("div","muted",p+"% верных · время "+mmss(R.time)));
  box.appendChild(head);

  /* по темам */
  var поТемам={};
  R.items.forEach(function(id){
    var q=ПО_ID[id], s=поТемам[q.t]||{ok:0,all:0};
    s.all++; if(R.ok[id])s.ok++; поТемам[q.t]=s;
  });
  var ключи=Object.keys(поТемам);
  if(ключи.length>1){
    var sec=el("div","card section");
    sec.appendChild(el("div","eyebrow","Результат по темам"));
    var sc=el("div","scroll"); sc.style.marginTop="10px";
    var tb=el("table","tbl"), th=el("thead"), tr=el("tr");
    ["Тема","Верно","Доля",""].forEach(function(h){ tr.appendChild(el("th",null,h)); });
    th.appendChild(tr); tb.appendChild(th);
    var tbody=el("tbody");
    ключи.map(Number).sort(function(a,b){ return a-b; }).forEach(function(t){
      var s=поТемам[t], pr=Math.round(s.ok/s.all*100), r=el("tr");
      r.appendChild(el("td",null,темаИмя(t)));
      r.appendChild(el("td","n",s.ok+" / "+s.all));
      r.appendChild(el("td","n",pr+"%"));
      var td=el("td"), m=el("div","meter"), i=el("i");
      i.style.width=pr+"%";
      i.style.background=pr>=70?"var(--ok)":(pr>=45?"var(--warn)":"var(--no)");
      m.appendChild(i); td.appendChild(m); r.appendChild(td);
      tbody.appendChild(r);
    });
    tb.appendChild(tbody); sc.appendChild(tb); sec.appendChild(sc);
    box.appendChild(sec);
  }

  /* разбор вопросов */
  var список=el("div","card section");
  список.appendChild(el("div","eyebrow","Разбор вопросов"));
  var hint=el("div","small muted","Нажмите на вопрос, чтобы раскрыть разбор.");
  hint.style.margin="4px 0 12px"; список.appendChild(hint);
  R.items.forEach(function(id,idx){
    var q=ПО_ID[id], ok=!!R.ok[id];
    var b=el("button","opt"); b.type="button";
    b.style.marginTop=idx?"8px":"0";
    b.dataset.st=ok?"ok":"no";
    b.appendChild(el("div","k",String(idx+1)));
    var tx=el("div","grow");
    /* у текстов с пропусками условие на целый экран — в списке нужен только зачин */
    tx.appendChild(el("div",null,q.q.length>140?q.q.slice(0,140).replace(/\s+\S*$/,"")+"…":q.q));
    tx.appendChild(el("div","tiny muted",(ok?"верно":"ошибка")+" · "+темаИмя(q.t)+" · "+(ТИП_ИМЯ[q.ty]||q.ty)));
    b.appendChild(tx);
    var slot=el("div");
    b.addEventListener("click",function(){
      if(slot.firstChild){ slot.innerHTML=""; return; }
      var saved=S; S=null;
      var tmp=el("div");
      var было=верно(q,R.ans[id]);
      var vd=el("div","verdict "+(было?"ok":"no"));
      vd.appendChild(el("span","g",было?"✓":"✕"));
      vd.appendChild(el("span",null,ваш(q,R.ans[id])));
      tmp.appendChild(vd);
      var brk=el("div","card brk");
      var s1=el("section"); s1.appendChild(el("h3",null,"Правильный ответ"));
      s1.appendChild(правильныйОтвет(q)); brk.appendChild(s1);
      if(q.e){ var s2=el("section"); s2.appendChild(el("h3",null,"Почему так")); s2.appendChild(el("div","why",q.e)); brk.appendChild(s2); }
      var wl=разборВариантов(q);
      if(wl){ var s3=el("section"); s3.appendChild(el("h3",null,"Почему остальные не подходят")); s3.appendChild(wl); brk.appendChild(s3); }
      if(q.k){ var s4=el("section"); s4.appendChild(el("h3",null,"Как запомнить"));
        var h=el("div","hook"); h.appendChild(el("span","g","◆")); h.appendChild(el("span","grow",q.k)); s4.appendChild(h); brk.appendChild(s4); }
      tmp.appendChild(brk);
      slot.appendChild(tmp);
      S=saved;
    });
    var wrapq=el("div"); wrapq.appendChild(b); wrapq.appendChild(slot);
    список.appendChild(wrapq);
  });
  box.appendChild(список);

  /* кнопки */
  var row=el("div","row gap12 wrapf"); row.style.marginTop="18px";
  var home=el("button","btn primary grow","На главную");
  home.addEventListener("click",домой);
  row.appendChild(home);
  if(DB.wrong.length){
    var mist=el("button","btn","Работа над ошибками ("+DB.wrong.length+")");
    mist.addEventListener("click",function(){ старт("mist"); });
    row.appendChild(mist);
  }
  var again=el("button","btn","Пройти ещё раз");
  again.addEventListener("click",function(){ старт(R.mode,R.topic); });
  row.appendChild(again);
  box.appendChild(row);
}

function ваш(q,v){
  if(!ответДан(q,v)) return "Ответ не дан";
  var ok=верно(q,v);
  if(q.ty==="one") return (ok?"Верно":"Неверно")+": вы выбрали «"+(q.o[v]||"—")+"»";
  if(q.ty==="many") return (ok?"Верно":"Неверно")+": вы выбрали "+(v.map(function(i){ return LET[i]||(i+1); }).join(", ")||"—");
  if(q.ty==="short") return (ok?"Верно":"Неверно")+": вы ввели «"+v+"»";
  return ok?"Верно":"Неверно";
}

/* ---------- запуск ---------- */
(function(){
  DB.wrong=DB.wrong.filter(function(id){ return !!ПО_ID[id]; });
  if(DB.resume&&DB.resume.items) DB.resume.items=DB.resume.items.filter(function(id){ return !!ПО_ID[id]; });
  if(DB.resume&&(!DB.resume.items||!DB.resume.items.length)) DB.resume=null;
  save();
  домой();
})();
</script>

</body>
