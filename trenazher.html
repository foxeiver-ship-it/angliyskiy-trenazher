ить</td><td>Past Perfect (had + V3)</td><td>would have + V3</td><td>сожаление о прошлом</td></tr><tr><td>Смешанный</td><td>прошлое → настоящее</td><td>Past Perfect</td><td>would + инфинитив</td><td>прошлое влияет на сегодня</td></tr></tbody></table><p><b>Нулевой.</b> If you heat water to 100 degrees, it boils. (Если нагреть воду до ста градусов, она кипит.)</p><p><b>Первый.</b> If the government <b>does not help</b> the banks, they <b>will not survive</b>. (Если правительство не поможет банкам, они не выживут.) Ошибка: ставить will внутри if. После if будущего времени не бывает: не <i>if it will rain</i>, а <b>if it rains</b>.</p><p><b>Второй.</b> If I <b>had</b> more time, I <b>would learn</b> Spanish. (Если бы у меня было больше времени, я бы выучила испанский.) Форма were употребляется для всех лиц: If I <b>were</b> you, I would accept. (На твоём месте я бы согласилась.) Ошибка: would в обеих половинах. Would живёт только в главной части.</p><p><b>Третий.</b> If she <b>had asked</b> me, I <b>would have helped</b> her. (Если бы она попросила меня, я бы ей помогла.) Ошибка: would have asked внутри if.</p><p><b>Смешанный.</b> If I <b>had studied</b> medicine, I <b>would be</b> a doctor now. (Если бы я в своё время выучилась на врача, я была бы врачом сейчас.) Признак — слово now или today во второй части при прошедшем условии.</p><h3>Как отличить первый тип от второго</h3><p>Первый — про то, что реально может случиться: <b>if + Present Simple → will</b>. Второй — про то, чего скорее всего не будет: <b>if + Past Simple → would</b>. Смешивать половинки нельзя. <i>If they didn&#x27;t help, they will not survive</i> — это склейка второго типа с первым, и она неверна всегда.</p><h3>Что ещё ведёт себя как if</h3><ul><li><b>unless</b> = if not: Unless the government helps, banks will fail. (Если правительство не поможет, банки рухнут.)</li><li><b>in case, provided that, as long as</b> — тоже без will внутри.</li><li><b>If asked, the assistant will tell you everything.</b> (Если её спросят, помощница расскажет вам всё.) Это сокращённое if she is asked — придаточное свернули до причастия.</li></ul><h3>Модальные глаголы: базовый набор</h3><p>Общие свойства всех модальных: не берут -s в третьем лице, после них идёт <b>голый инфинитив</b> без to (кроме ought to и have to), вопрос и отрицание строят без do.</p><table><thead><tr><th>Глагол</th><th>Значение</th><th>Пример</th><th>Перевод</th></tr></thead><tbody><tr><td>can / could</td><td>умение, возможность</td><td>I can swim.</td><td>Я умею плавать.</td></tr><tr><td>may / might</td><td>разрешение, вероятность</td><td>It may rain.</td><td>Возможно, будет дождь.</td></tr><tr><td>must</td><td>сильная обязанность, вывод</td><td>You must stop.</td><td>Ты должен остановиться.</td></tr><tr><td>have to</td><td>внешняя необходимость</td><td>I have to work on Saturday.</td><td>Мне приходится работать в субботу.</td></tr><tr><td>should / ought to</td><td>совет</td><td>You should rest.</td><td>Тебе стоит отдохнуть.</td></tr><tr><td>need</td><td>необходимость</td><td>You needn&#x27;t come.</td><td>Тебе не обязательно приходить.</td></tr><tr><td>be able to</td><td>смочь (в любом времени)</td><td>I will be able to help.</td><td>Я смогу помочь.</td></tr></tbody></table><p><b>must против have to.</b> Must — обязанность изнутри, от говорящего: I must call her. Have to — обязанность снаружи, от обстоятельств: I have to wear a uniform. В прошлом у must формы нет, используется <b>had to</b>: I had to leave early.</p><p><b>mustn&#x27;t против needn&#x27;t.</b> Mustn&#x27;t — запрет: You mustn&#x27;t smoke here (здесь нельзя курить). Needn&#x27;t — отсутствие необходимости: You needn&#x27;t hurry (можно не спешить). Это противоположные вещи.</p><p><b>should против ought to.</b> Смысл один — совет, но ought берёт to: You ought to apologise. (Тебе следовало бы извиниться.)</p><h3>Модальный + have + причастие: разговор о прошлом</h3><p>Это самая экзаменационная конструкция темы. <b>Модальный глагол + have + V3</b> переносит смысл в прошлое.</p><table><thead><tr><th>Конструкция</th><th>Значение</th><th>Пример</th><th>Перевод</th></tr></thead><tbody><tr><td>must have + V3</td><td>уверенная догадка: наверняка так и было</td><td>The owners <b>must have neglected</b> its maintenance.</td><td>Должно быть, владельцы запустили содержание.</td></tr><tr><td>can&#x27;t / couldn&#x27;t have + V3</td><td>уверенно: этого точно не было</td><td>He <b>can&#x27;t have said</b> that.</td><td>Не может быть, чтобы он так сказал.</td></tr><tr><td>may / might have + V3</td><td>возможно, было</td><td>She <b>might have forgotten</b>.</td><td>Возможно, она забыла.</td></tr><tr><td>should have + V3</td><td>следовало, но не сделал (упрёк)</td><td>You <b>should have told</b> me.</td><td>Надо было мне сказать.</td></tr><tr><td>shouldn&#x27;t have + V3</td><td>сделал зря</td><td>You <b>shouldn&#x27;t have shouted</b>.</td><td>Зря ты накричал.</td></tr><tr><td>needn&#x27;t have + V3</td><td>сделал, хотя было незачем</td><td>You <b>needn&#x27;t have waited</b>.</td><td>Мог бы и не ждать.</td></tr><tr><td>could have + V3</td><td>мог бы, но не сделал</td><td>I <b>could have won</b>.</td><td>Я мог бы выиграть.</td></tr></tbody></table><p>Ключ к выбору: <b>must have</b> — вывод, «судя по всему»; <b>should have</b> — упрёк, «надо было»; <b>might have</b> — предположение без уверенности. Ошибка: путать вывод с обязанностью. Ought to neglect и had to neglect говорят про долг, а не про догадку.</p><h3 class=\"prog\">Три наклонения: что скрывается за терминами</h3><p>Правило: <b>наклонение показывает, как говорящий подаёт действие — как факт, как приказ или как нереальное.</b></p><table><thead><tr><th>Наклонение</th><th>Что выражает</th><th>Пример</th><th>Перевод</th></tr></thead><tbody><tr><td>Изъявительное (Indicative)</td><td>факт, реальное действие</td><td>He <b>works</b> here.</td><td>Он здесь работает.</td></tr><tr><td>Повелительное (Imperative)</td><td>приказ, просьба, призыв</td><td><b>Open</b> the door.</td><td>Открой дверь.</td></tr><tr><td>Сослагательное (Subjunctive)</td><td>нереальное, желаемое, требуемое</td><td>If I <b>were</b> you…</td><td>На твоём месте я бы…</td></tr></tbody></table><p>Изъявительное — это все обычные времена, которые ты уже знаешь: Present Simple, Past Simple, Perfect и так далее.</p><p>Повелительное — голый инфинитив без подлежащего и без to.</p><ul><li><b>Open</b> the door, please. — Открой дверь, пожалуйста.</li><li><b>Don&#x27;t be</b> late. — Не опаздывай. (отрицание строится через don&#x27;t даже с глаголом be)</li><li><b>Let&#x27;s begin.</b> — Давай начнём. (призыв к совместному действию, let us)</li><li><b>Never give up.</b> — Никогда не сдавайся.</li></ul><p>Сослагательное — то, чего нет: мечта, сожаление, требование, условие вопреки фактам. Именно оно даёт формы if I were, I wish I knew, I suggest he be. Внутри if ты его уже разобрала во втором и третьем типе, дальше — всё остальное.</p><h3 class=\"prog\">Сослагательное вне if: сожаление и желание</h3><p>Правило: <b>после I wish и if only прошедшее время не про прошлое — оно показывает, что желаемое не совпадает с реальностью.</b></p><table><thead><tr><th>Конструкция</th><th>О чём</th><th>Пример</th><th>Перевод</th></tr></thead><tbody><tr><td>wish + Past Simple</td><td>сожаление о настоящем</td><td>I <b>wish</b> I <b>knew</b> the answer.</td><td>Жаль, что я не знаю ответа.</td></tr><tr><td>wish + Past Perfect</td><td>сожаление о прошлом</td><td>I <b>wish</b> I <b>had known</b> about it.</td><td>Жаль, что я не знала об этом.</td></tr><tr><td>wish + would</td><td>раздражение, просьба изменить поведение</td><td>I <b>wish</b> he <b>would stop</b> talking.</td><td>Хоть бы он перестал болтать.</td></tr></tbody></table><p><b>Смысл переворачивается.</b> I wish I knew — значит «я не знаю». I wish I had known — «я не знала». По-русски получается отрицание там, где по-английски его нет, и наоборот: I wish it <b>weren&#x27;t</b> so difficult. — Жаль, что это так сложно.</p><p><b>if only</b> работает так же, только эмоциональнее: If only I <b>had listened</b> to you. — Если бы я только тебя послушала.</p><p><b>Форма were для всех лиц.</b> В сослагательном наклонении be превращается в were независимо от лица: I <b>were</b>, he <b>were</b>, it <b>were</b>.</p><ul><li>I <b>wish</b> I <b>were</b> taller. — Жаль, что я не выше ростом. (не ~~I wish I was taller~~ в экзаменационном варианте)</li><li>If I <b>were</b> rich, I would travel. — Будь я богата, я бы путешествовала.</li></ul><p>Важно: увидела <b>were</b> при подлежащем I, he, she, it — это не ошибка и не опечатка, а признак сослагательного наклонения. На экзамене выбирают именно эту форму.</p><p><b>wish + would не употребляется о себе.</b> Нельзя ~~I wish I would~~ — про собственные желания говорят через could: I wish I <b>could</b> come. — Жаль, что я не могу прийти.</p><h3 class=\"prog\">Сослагательное вне if: пора, как будто, предпочёл бы</h3><p>Правило: <b>после it&#x27;s time, as if / as though и would rather тоже ставится прошедшее время, хотя речь о настоящем.</b></p><p><b>it&#x27;s (high / about) time + Past Simple</b> — «давно пора».</p><ul><li>It&#x27;s <b>high time</b> we <b>left</b>. — Нам давно пора уходить.</li><li>It&#x27;s <b>time</b> you <b>started</b> working. — Тебе пора приниматься за работу.</li><li>Не ~~it&#x27;s time we leave~~ и не ~~it&#x27;s time we will leave~~.</li></ul><p><b>as if / as though + Past</b> — «как будто», когда это неправда.</p><ul><li>He talks <b>as if</b> he <b>knew</b> everything. — Он говорит так, будто всё знает. (а он не знает)</li><li>She looks <b>as though</b> she <b>were</b> ill. — Она выглядит так, словно больна.</li><li>Если же сказанное вполне может быть правдой, ставится обычное время: It looks as if it <b>is</b> going to rain.</li></ul><p><b>would rather + подлежащее + Past</b> — «я предпочёл бы, чтобы кто-то…».</p><ul><li>I&#x27;<b>d rather</b> you <b>didn&#x27;t smoke</b> here. — Я бы предпочла, чтобы ты здесь не курил.</li><li>I&#x27;<b>d rather</b> he <b>came</b> tomorrow. — Пусть лучше он придёт завтра.</li><li>Если действие своё, подлежащее не повторяется и идёт голый инфинитив: I&#x27;d rather <b>stay</b> at home. — Я лучше останусь дома. (не ~~to stay~~)</li></ul><h3 class=\"prog\">Present Subjunctive: требую, предлагаю, настаиваю</h3><p>Правило: <b>после глаголов требования и предложения в придаточном с that стоит голый инфинитив — без -s, без to и без изменения по времени.</b></p><p>Эта форма совпадает с инфинитивом и не подстраивается ни под лицо, ни под время главного глагола.</p><table><thead><tr><th>Главное слово</th><th>Пример</th><th>Перевод</th></tr></thead><tbody><tr><td>suggest</td><td>I <b>suggest</b> that he <b>be</b> informed.</td><td>Предлагаю, чтобы его поставили в известность.</td></tr><tr><td>demand</td><td>They <b>demanded</b> that she <b>go</b> at once.</td><td>Они потребовали, чтобы она немедленно ушла.</td></tr><tr><td>insist</td><td>He <b>insists</b> that the report <b>be</b> ready by Friday.</td><td>Он настаивает, чтобы отчёт был готов к пятнице.</td></tr><tr><td>recommend</td><td>The doctor <b>recommended</b> that he <b>stop</b> smoking.</td><td>Врач порекомендовал ему бросить курить.</td></tr><tr><td>propose / require / request</td><td>The rules <b>require</b> that every student <b>submit</b> a form.</td><td>Правила требуют, чтобы каждый студент подал заявление.</td></tr></tbody></table><p>Так же ведут себя безличные обороты <b>it is essential / important / necessary / vital / advisable that</b>:</p><ul><li>It is <b>essential</b> that everyone <b>be</b> present. — Крайне важно, чтобы все присутствовали.</li><li>It is <b>necessary</b> that she <b>arrive</b> on time. — Необходимо, чтобы она пришла вовремя.</li></ul><p><b>Главная ловушка.</b> По-русски мы говорим «чтобы он был», «чтобы она пришла», и рука тянется поставить обычную форму. Но здесь нельзя:</p><ul><li>I suggest that he <b>be</b> informed — не ~~that he is informed~~ и не ~~that he will be informed~~.</li><li>She demanded that he <b>go</b> — не ~~that he goes~~ и не ~~that he went~~.</li><li>Отрицание строится без do: I insist that he <b>not be</b> told. — Я настаиваю, чтобы ему не говорили.</li></ul><p>Проверка: если в предложении есть suggest, demand, insist, require, recommend, propose или essential/important/necessary + that — в придаточном ищи глагол без -s и без to. Именно такой вариант и будет верным.</p><p>Осторожно: suggest не берёт после себя человека с инфинитивом. Не ~~suggest him to go~~, а <b>suggest that he go</b> или <b>suggest going</b>.</p><h3>Ловушки этой темы</h3><p><b>«wouldn&#x27;t survived» — несуществующая форма.</b> В en-0031 два неверных варианта построены на ней. После would идёт <b>голый инфинитив</b>: wouldn&#x27;t survive. Если хочешь прошлое — would<b>n&#x27;t have</b> survived, то есть would + have + V3. Формы «would + третья форма» в языке нет вообще. Это самый быстрый способ вычеркнуть вариант: увидела would рядом с V3 без have — мимо.</p><p><b>«didn&#x27;t help ... will not survive» — смешение типов.</b> Первая половина взята из второго типа (Past Simple после if), вторая из первого (will). Половинки должны быть из одного типа: либо does not help + will not survive, либо didn&#x27;t help + wouldn&#x27;t survive.</p><p><b>«should have neglecting» — формы не существует.</b> После have всегда идёт третья форма, а не -ing: should have neglect<b>ed</b>. Конструкция modal + have + V-ing невозможна в принципе.</p><p><b>«had not to neglect» — неверный порядок отрицания.</b> У have to отрицание строится через do: <b>didn&#x27;t have to</b> neglect (не был обязан). Форма had not to считается ошибочной, и по смыслу это всё равно про обязанность, а не про догадку.</p><p><b>«ought to neglect» — не то время.</b> Ought to + инфинитив относится к настоящему или будущему: «следует пренебрегать». А в предложении стоит <b>last year</b>, значит нужна отсылка к прошлому — только must have neglected её даёт.</p><p><b>Маркер времени решает.</b> Если в предложении last year, yesterday, in 2015 — в модальной конструкции обязана появиться связка <b>have + V3</b>. Голый модальный глагол с инфинитивом до прошлого не дотягивается.</p><h3>Чек-лист перед ответом</h3><ol><li>Есть if? Определи тип по времени в придаточном и сверься с таблицей.</li><li>После if — никогда will и никогда would.</li><li>После would / will / can / must — голый инфинитив, без to и без -ed.</li><li>Нужно прошлое при модальном? Ставь have + третью форму.</li><li>Реши, что выражает предложение: вывод (must have), упрёк (should have) или предположение (might have).</li><li>Проверь, что предложенная форма вообще существует в языке. Половина неверных вариантов — просто выдуманные формы.</li><li>Видишь wish, if only, it&#x27;s time, as if, would rather? Ставь прошедшее время, даже если речь о настоящем; для be — форму were при любом лице.</li><li>Есть suggest, demand, insist, recommend, require или essential/important/necessary + that? В придаточном глагол без -s и без to: that he <b>be</b>, that she <b>go</b>.</li><li>Определи наклонение: факт — обычное время, приказ — голый инфинитив без подлежащего, нереальное или требуемое — сослагательное.</li></ol>", "2": "<h2>Инфинитив, герундий и управление глагола</h2><p>Эта тема даёт ответ на один постоянный вопрос экзамена: что поставить после слова — <b>to do</b> или <b>doing</b>. И заодно учит видеть, какой предлог требует конкретное слово.</p><h3>Две формы и как их различать</h3><p><b>Инфинитив</b> — to + глагол: to sign, to attract, to be. <b>Герундий</b> — глагол с -ing в роли существительного: signing, attracting, being. Герундий переводится отглагольным существительным: signing — «подписание», reading — «чтение».</p><p>Выбор между ними диктует <b>слово слева</b>. Не смысл, не логика — именно управляющее слово. Поэтому тема держится на трёх списках.</p><h3>Список 1: после этих глаголов только инфинитив</h3><p>agree, decide, hope, promise, refuse, want, expect, plan, offer, manage, afford, learn, seem, pretend, fail, choose, arrange, threaten, deserve, intend</p><p>He <b>decided to leave</b> early. (Он решил уйти пораньше.) She <b>promised to call</b>. (Она пообещала позвонить.) Ошибка: <i>decided leaving</i>. Все эти глаголы про намерение и будущее — а инфинитив как раз смотрит вперёд.</p><h3>Список 2: после этих глаголов только герундий</h3><p>keep, enjoy, avoid, mind, finish, suggest, admit, deny, consider, imagine, risk, practise, postpone, delay, miss, involve, can&#x27;t help, give up, put off, look forward to</p><p>Why <b>keep asking</b> for my permission? (Зачем постоянно спрашивать моего разрешения?) I <b>enjoy reading</b> in the evening. (Мне нравится читать по вечерам.) He <b>avoided answering</b> the question. (Он избежал ответа на вопрос.) Ошибка: <i>keep to ask</i>, <i>enjoy to read</i>. После keep инфинитива не бывает никогда.</p><h3>Список 3: глагол + дополнение + инфинитив</h3><p>Здесь между глаголом и инфинитивом обязательно стоит тот, кого просят/заставляют/разрешают:</p><p>allow, permit, ask, tell, want, advise, expect, force, order, encourage, remind, teach, warn, invite, enable</p><p>The development of communications <b>has permitted stock exchanges to attract</b> orders. (Развитие связи позволило биржам привлекать заказы.) I <b>want you to know</b> the truth. (Я хочу, чтобы ты знал правду.) She <b>told me not to say</b> anything. (Она велела мне ничего не говорить.) Ошибка двойная: во-первых, выбросить дополнение (<i>allowed to attract</i> — непонятно кому); во-вторых, поставить -ing (<i>allowed them attracting</i>). Схема жёсткая: <b>permit / allow somebody TO do something</b>.</p><p>Отдельно: <b>make</b> и <b>let</b> берут голый инфинитив без to — He made me wait (он заставил меня ждать), Let me help you (позволь помочь). Но в пассиве make возвращает to: He was made <b>to wait</b>.</p><h3>Список 4: меняют смысл</h3><table><thead><tr><th>Глагол</th><th>+ инфинитив</th><th>+ герундий</th></tr></thead><tbody><tr><td>remember</td><td>remember to lock — не забыть запереть (дело впереди)</td><td>remember locking — помнить, что запер (дело позади)</td></tr><tr><td>forget</td><td>forget to call — забыть позвонить</td><td>forget calling — забыть, что звонил</td></tr><tr><td>stop</td><td>stop to smoke — остановиться, чтобы покурить</td><td>stop smoking — бросить курить</td></tr><tr><td>try</td><td>try to open — попытаться открыть</td><td>try opening — попробовать открыть (как вариант)</td></tr><tr><td>regret</td><td>regret to say — с сожалением сообщаю</td><td>regret saying — жалею, что сказал</td></tr><tr><td>go on</td><td>go on to explain — перейти к объяснению</td><td>go on explaining — продолжать объяснять</td></tr></tbody></table><p>Логика простая: <b>инфинитив смотрит вперёд, герундий смотрит назад</b>. Ошибка: считать, что stop smoking и stop to smoke — одно и то же. Это противоположные вещи.</p><h3>Правило предлога: после предлога всегда -ing</h3><p>Это главное правило темы. <b>Любой предлог требует после себя герундия</b>, инфинитива после предлога не бывает.</p><p>I&#x27;m interested <b>in learning</b> French. (Мне интересно учить французский.) Thank you <b>for coming</b>. (Спасибо, что пришли.) She left <b>without saying</b> goodbye. (Она ушла, не попрощавшись.)</p><p>Сложность одна: предлог <b>to</b> выглядит как частица инфинитива. Проверка: подставь на его место «it». Если <b>to it</b> звучит нормально — это предлог, значит дальше -ing.</p><ul><li>objection <b>to</b> it → значит objection <b>to signing</b></li><li>look forward <b>to</b> it → looking forward <b>to seeing</b> you</li><li>be used <b>to</b> it → I&#x27;m used <b>to getting</b> up early (я привык рано вставать)</li><li>object <b>to</b> it → They object <b>to working</b> on Sunday (они возражают против работы в воскресенье)</li></ul><h3>Управление: слово + свой предлог</h3><p>Каждое слово тянет за собой конкретный предлог, и его надо запоминать вместе со словом.</p><table><thead><tr><th>Сочетание</th><th>Перевод</th><th>Пример</th></tr></thead><tbody><tr><td>an objection <b>to</b> doing</td><td>возражение против</td><td>Have you any objections <b>to signing</b> this document?</td></tr><tr><td>to object <b>to</b> doing</td><td>возражать против</td><td>They object <b>to changing</b> the rules.</td></tr><tr><td>to be aware <b>of</b></td><td>знать о, отдавать себе отчёт</td><td>She is aware <b>of the risk</b>.</td></tr><tr><td>to be capable <b>of</b> doing</td><td>быть способным</td><td>He is capable <b>of solving</b> it.</td></tr><tr><td>to insist <b>on</b> doing</td><td>настаивать на</td><td>They insisted <b>on paying</b>.</td></tr><tr><td>to succeed <b>in</b> doing</td><td>преуспеть в</td><td>He succeeded <b>in finding</b> the file.</td></tr><tr><td>to accuse somebody <b>of</b> doing</td><td>обвинять в</td><td>They accused him <b>of lying</b>.</td></tr><tr><td>to prevent somebody <b>from</b> doing</td><td>помешать</td><td>Rain prevented us <b>from going</b> out.</td></tr><tr><td>to apologise <b>for</b> doing</td><td>извиниться за</td><td>He apologised <b>for being</b> late.</td></tr><tr><td>to depend <b>on</b></td><td>зависеть от</td><td>It depends <b>on the weather</b>.</td></tr><tr><td>to belong <b>to</b></td><td>принадлежать</td><td>This money belongs <b>to</b> the fund.</td></tr><tr><td>to consist <b>of</b></td><td>состоять из</td><td>The course consists <b>of</b> ten lectures.</td></tr><tr><td>to result <b>in</b></td><td>приводить к</td><td>It resulted <b>in</b> a delay.</td></tr></tbody></table><p>Ошибка: подставлять русский предлог. «Возражение против» тянет за собой against, но по-английски правильно <b>objection to</b>. «Зависеть от» тянет from, а нужно <b>depend on</b>.</p><h3>Особые обороты</h3><p><b>It is worth doing</b> — стоит сделать. После worth — только герундий, ни to, ни придаточного. It is not <b>worth taking</b> this information into account. (Не стоит принимать эту информацию во внимание.)</p><p><b>It is no use / no good doing</b> — бесполезно. It&#x27;s no use arguing with him. (Спорить с ним бесполезно.)</p><p><b>can&#x27;t help doing</b> — не могу удержаться. I can&#x27;t help laughing. (Не могу удержаться от смеха.)</p><p><b>would rather do</b> — предпочёл бы (голый инфинитив, без to). I would rather stay home. (Я бы лучше осталась дома.)</p><p><b>had better do</b> — лучше бы (тоже без to). You had better see a doctor. (Тебе лучше сходить к врачу.)</p><p><b>Why do / Why not do</b> — риторический вопрос с голым инфинитивом. <b>Why keep asking</b> for my permission? (Зачем постоянно спрашивать разрешения?) Why not try again? (Почему бы не попробовать ещё раз?)</p><p><b>Инфинитив цели</b> — отвечает на «зачем». I came here <b>to help</b> you. (Я пришёл, чтобы помочь тебе.)</p><h3 class=\"prog\">Причастие I и II</h3><p>Правило: <b>Participle I (V-ing) — активное и одновременное действие, Participle II (третья форма) — пассивное и уже готовый результат.</b></p><table><thead><tr><th>Форма</th><th>Как выглядит</th><th>Смысл</th><th>Пример</th></tr></thead><tbody><tr><td>Participle I</td><td>working, speaking, writing</td><td>сам делает, делает сейчас</td><td>the man <b>speaking</b> to her — мужчина, говорящий с ней</td></tr><tr><td>Participle II</td><td>worked, spoken, written, broken</td><td>над ним сделали, результат</td><td>the letter <b>written</b> yesterday — письмо, написанное вчера</td></tr><tr><td>Perfect Participle</td><td>having written, having finished</td><td>сделал раньше главного действия</td><td><b>Having finished</b> the report, she went home. — Закончив отчёт, она пошла домой.</td></tr></tbody></table><p>Причастие как определение (какой?) стоит <b>после существительного</b>, если тянет за собой хвост из слов. По-русски мы ставим оборот перед словом, по-английски — после, и это главный источник ошибок.</p><ul><li>The woman <b>sitting</b> at the desk is our manager. — Женщина, сидящая за столом, — наш менеджер.</li><li>The goods <b>delivered</b> last week are still in the warehouse. — Товар, доставленный на прошлой неделе, всё ещё на складе.</li><li>Не ~~the sitting at the desk woman~~, не ~~the delivered last week goods~~.</li></ul><p>Одиночное причастие без хвоста ставится перед словом: a <b>broken</b> window, the <b>rising</b> prices.</p><p>Причастие как обстоятельство (когда? почему?) выносится в начало предложения через запятую. Форма выбирается по подлежащему: сам делает — -ing, с ним делают — третья форма.</p><ul><li><b>Working</b> in the bank, he learned a lot. — Работая в банке, он многому научился.</li><li><b>Asked</b> about it, he said nothing. — Когда его об этом спросили, он ничего не сказал.</li><li><b>Having signed</b> the contract, they left. — Подписав контракт, они ушли.</li></ul><p>Ловушка: <b>interesting против interested</b>. Оба причастия работают как прилагательные, но описывают разное. Форма на <b>-ing</b> описывает то, что вызывает чувство (вещь, книгу, работу), форма на <b>-ed</b> — того, кто это чувство испытывает (человека).</p><ul><li>The book is <b>boring</b>. — Книга скучная. / I am <b>bored</b>. — Мне скучно.</li><li>The results are <b>surprising</b>. — Результаты удивительные. / We are <b>surprised</b>. — Мы удивлены.</li><li>Так же: interesting / interested, tiring / tired, confusing / confused, exciting / excited.</li><li>Ошибка: ~~I am boring~~ — это «я скучный человек», а не «мне скучно».</li></ul><h3 class=\"prog\">Complex Object: сложное дополнение</h3><p>Правило: <b>подлежащее + глагол + дополнение + инфинитив. Переводится придаточным с «чтобы» или «что».</b></p><p>Схему «want somebody to do» ты уже видела в Списке 3 — у неё есть название: Complex Object. Три группы по форме инфинитива.</p><p><b>1. С to</b> — после want, expect, would like, ask, tell, allow, advise, consider, believe, know:</p><ul><li>I <b>want you to know</b> the truth. — Я хочу, чтобы ты знал правду.</li><li>We <b>expect the prices to rise</b>. — Мы ожидаем, что цены вырастут.</li></ul><p><b>2. Без to</b> — после make, let, have (в значении «заставить, позволить, распорядиться»):</p><ul><li>He <b>made me wait</b>. — Он заставил меня ждать. (не ~~made me to wait~~)</li><li><b>Let me help</b> you. — Позволь мне помочь.</li></ul><p><b>3. Без to</b> — после глаголов восприятия see, hear, watch, feel, notice. Здесь выбор между голым инфинитивом и -ing меняет смысл:</p><ul><li>I saw him <b>cross</b> the street. — Я видел, как он перешёл улицу. (действие целиком, от начала до конца)</li><li>I saw him <b>crossing</b> the street. — Я видел, как он переходил улицу. (процесс, застала в середине)</li></ul><p>Важно: <b>в пассиве голый инфинитив возвращает to</b>.</p><ul><li>He <b>was made to wait</b>. — Его заставили ждать.</li><li>He <b>was seen to leave</b> the building. — Видели, как он выходил из здания.</li></ul><h3 class=\"prog\">Complex Subject: сложное подлежащее</h3><p>Правило: <b>подлежащее + сказуемое (чаще в пассиве) + инфинитив. Переводится безличным «говорят, что…», «известно, что…».</b></p><ul><li>He <b>is said to be</b> rich. — Говорят, что он богат.</li><li>The company <b>is known to have</b> offices abroad. — Известно, что у компании есть офисы за рубежом.</li></ul><p>Два набора сказуемых, между которыми стоит выбор в заданиях:</p><table><thead><tr><th>В пассиве</th><th>В активе</th></tr></thead><tbody><tr><td>is said — говорят</td><td>seems — кажется</td></tr><tr><td>is reported — сообщают</td><td>appears — по-видимому</td></tr><tr><td>is known — известно</td><td>happens — случается</td></tr><tr><td>is believed — считают, полагают</td><td>turns out — оказывается</td></tr><tr><td>is expected — ожидается</td><td>is likely — вероятно</td></tr><tr><td>is considered — считается</td><td>is unlikely — вряд ли</td></tr><tr><td>is supposed — предполагается</td><td>is sure / is certain — наверняка</td></tr></tbody></table><p>Форма инфинитива показывает, когда происходит действие:</p><table><thead><tr><th>Инфинитив</th><th>Когда</th><th>Пример</th></tr></thead><tbody><tr><td>to be / to do</td><td>сейчас, вообще</td><td>He <b>is said to be</b> a good manager. — Говорят, он хороший руководитель.</td></tr><tr><td>to have been / to have done</td><td>раньше, чем говорят</td><td>He <b>is said to have been</b> a banker. — Говорят, он был банкиром.</td></tr><tr><td>to be doing</td><td>прямо в этот момент</td><td>He <b>is said to be working</b> on it. — Говорят, он сейчас над этим работает.</td></tr></tbody></table><p>Ошибка: перевести русское «Говорят, что…» через that-придаточное с пустым подлежащим — ~~It is said he is rich~~ грамматически возможно, но в заданиях проверяют именно схему <b>He is said to be rich</b>, где человек стоит в начале.</p><h3 class=\"prog\">Абсолютный причастный оборот</h3><p>Правило: <b>у оборота своё собственное подлежащее, отдельное от главного предложения; оборот отделяется запятой.</b></p><p>Обычное причастие относится к подлежащему главного предложения. В абсолютном обороте у причастия свой деятель, и он стоит прямо перед причастием.</p><ul><li>The weather <b>being</b> fine, we went out. — Так как погода была хорошая, мы вышли погулять.</li><li>The contract <b>having been signed</b>, the parties left. — После того как контракт был подписан, стороны разошлись.</li><li><b>The work finished</b>, they went home. — Когда работа была закончена, они пошли домой.</li></ul><p>Переводится придаточным с «так как», «когда», «после того как», «причём». Такой оборот типичен для письменных экономических и деловых текстов, в разговорной речи почти не встречается.</p><p>Ошибка: спутать с обычным причастным оборотом. Сравни: <b>Being</b> fine, the weather let us go out — здесь being относится к weather, подлежащему. А в The weather being fine, we went out подлежащее главного предложения — we, и у оборота свой субъект — the weather.</p><h3 class=\"prog\">Герундиальные комплексы</h3><p>Правило: <b>герундий может иметь своего деятеля, и тот ставится в притяжательной форме перед герундием.</b></p><ul><li>I don&#x27;t mind <b>his coming</b> late. — Я не против того, что он приходит поздно.</li><li><b>John&#x27;s signing</b> the contract surprised everyone. — То, что Джон подписал контракт, всех удивило.</li><li>I insist on <b>his paying</b> the bill. — Я настаиваю на том, чтобы платил он.</li></ul><p>Весь комплекс — это одно целое, и на русский он переводится придаточным с «что» или «чтобы», а не отдельными словами.</p><p>В разговорном варианте вместо притяжательной формы допускается объектная (him, her, them, John):</p><ul><li>I don&#x27;t mind <b>him</b> coming late. — то же самое, но менее формально.</li></ul><p>С существительным в формальном письме — притяжательный падеж с &#x27;s, в разговорном — просто существительное: <b>the manager&#x27;s signing</b> / the manager signing.</p><p>Разница с инфинитивной конструкцией — в предлоге. Если у слова есть свой предлог, после него идёт только герундиальный комплекс:</p><ul><li>I insist <b>on his paying</b>. — Я настаиваю, чтобы он заплатил. (не ~~insist him to pay~~)</li><li>Но: I <b>want him to pay</b>. — Хочу, чтобы он заплатил. (у want предлога нет, значит Complex Object)</li></ul><h3>Ловушки этой темы</h3><p><b>«objections of signing» — не тот предлог.</b> В en-0010 objection управляет только предлогом to. Of сюда не встаёт, against по-русски логичен, но по-английски избыточен. Проверка через «to it»: objection to it звучит — значит to и дальше -ing.</p><p><b>«no any objections to sign» — сразу три ошибки.</b> No и any в одном месте не сочетаются: либо no objections, либо not any objections. Плюс после предлога to нужен герундий signing, а не инфинитив sign. В вопросе со значением «есть ли вообще» ставится <b>any</b>, а не some.</p><p><b>«be taking» и «totake» после worth.</b> Форм таких нет. После worth стоит чистый герундий: worth <b>taking</b>. Ни be, ни to, ни if we took — придаточное после worth тоже невозможно.</p><p><b>«allowed stock exchanges attracting» — -ing вместо инфинитива.</b> Allow и permit строятся одинаково: <b>allow somebody to do</b>. Форма с -ing после дополнения неверна.</p><p><b>«has allowed to attract» — пропало дополнение.</b> Позволить можно только кому-то. Без дополнения конструкция разваливается: has permitted <b>stock exchanges</b> to attract.</p><p><b>«more easier» и «much more easier» — двойная степень сравнения.</b> Easier уже сравнительная форма, more к ней не приставляют. И обстоятельство относится к глаголу attract, значит нужно наречие: <b>more easily</b>, а не easier.</p><p><b>«keep to ask» и «keep ask» — после keep только герундий.</b> Ни инфинитива, ни голой формы. Только <b>keep asking</b>.</p><p><b>«a permission» — лишний артикль.</b> Permission неисчисляемо и артикля a не берёт. Здесь ещё и нужно притяжательное: <b>my permission</b>. Не путать с <b>permit</b> — это пропуск, документ, физическая бумажка.</p><h3>Чек-лист перед ответом</h3><ol><li>Посмотри на слово слева от пропуска — оно и решает.</li><li>Это предлог (of, on, in, for, from, about, to в значении «к»)? Значит -ing.</li><li>Это глагол из списка keep/enjoy/avoid/mind/suggest/consider? Значит -ing.</li><li>Это allow / permit / ask / tell / want? Значит дополнение + to + инфинитив.</li><li>Стоит worth, no use, can&#x27;t help? Только -ing.</li><li>Проверь артикли и исчисляемость: advice, information, permission — без a.</li><li>Причастный оборот с хвостом? Он идёт после существительного: the letter written yesterday, не наоборот.</li><li>Речь о вещи или о человеке? Вещь — -ing (boring, interesting), человек — -ed (bored, interested).</li><li>После make, let, have и глаголов восприятия (see, hear, watch) — инфинитив без to. Но в пассиве to возвращается: was made to wait.</li><li>Видишь is said / is known / is expected / seems / is likely? Дальше инфинитив: He is said to be rich.</li><li>Перед -ing стоит его собственный деятель (his, John&#x27;s)? Это герундиальный комплекс, переводи придаточным с «что» или «чтобы».</li></ol>", "3": "<h2>Простое предложение, придаточные и косвенная речь</h2><p>Эта тема отвечает на вопрос «кто что кому сказал и в каком порядке идут слова после этого». Ловушки почти всегда одинаковые: подставили say вместо tell, оставили вопросительный порядок слов там, где вопроса уже нет, или влепили второе отрицание.</p><h3>1. Четыре глагола говорения: say, tell, speak, talk</h3><p>Главное правило: <b>tell берёт человека сразу, без предлога; say — только через to.</b></p><table><thead><tr><th>Глагол</th><th>Схема</th><th>Пример</th><th>Перевод</th></tr></thead><tbody><tr><td>tell</td><td>tell <b>somebody</b> (something)</td><td>He told me the truth.</td><td>Он сказал мне правду.</td></tr><tr><td>say</td><td>say something (<b>to</b> somebody)</td><td>He said the truth to me.</td><td>Он сказал мне правду.</td></tr><tr><td>speak</td><td>speak <b>to/with</b> somebody, speak a language</td><td>She speaks French.</td><td>Она говорит по-французски.</td></tr><tr><td>talk</td><td>talk <b>to/with</b> somebody <b>about</b> something</td><td>We talked about work.</td><td>Мы говорили о работе.</td></tr></tbody></table><p>Ошибка: ~~He said me the truth~~, ~~He told to me~~. Заучи связку: <b>tell me — say to me</b>.</p><p>Устойчивое, что просто помнить: tell a story, tell the truth, tell a lie, tell the time, tell somebody&#x27;s name — только tell. Say hello, say a word, say nothing — только say.</p><p>Speak — про сам факт речи и про языки, более официально. Talk — про разговор, беседу, более разговорно: talk about something.</p><p><b>Пассив строится только от tell.</b> I was told to wait — «мне велели подождать». Формы ~~I was said~~ не существует вообще, потому что say не берёт адресата без предлога.</p><h3>2. Косвенное побуждение: приказ, просьба, запрет</h3><p>Формула: <b>tell / ask somebody TO do something</b>, отрицание — <b>not to do</b>.</p><ul><li>He told me to close the door. — Он велел мне закрыть дверь.</li><li>He told me <b>not to</b> close the door. — Он велел мне не закрывать дверь.</li><li>She asked me to help her. — Она попросила меня помочь ей.</li></ul><p>Ошибка: ~~told me don&#x27;t close~~, ~~told not close~~ (потеряли to), ~~told to me to close~~ (лишний to перед человеком).</p><p>Частицу not ставим <b>перед</b> to, а не после: not to say, а не ~~to not say~~.</p><h3>3. Одно отрицание на предложение</h3><p>Правило: <b>в английском предложении отрицание может быть только одно.</b> Если отрицание уже есть в глаголе или в местоимении, дальше идёт any-форма.</p><ul><li>I didn&#x27;t say <b>anything</b>. — Я ничего не сказал.</li><li>I said <b>nothing</b>. — Я ничего не сказал. (то же самое, но отрицание в местоимении)</li><li>I&#x27;ve been told <b>not</b> to say <b>anything</b>. — Мне велели ничего не говорить.</li></ul><p>Ошибка: ~~I didn&#x27;t say nothing~~, ~~told not to tell nobody~~. По-русски двойное отрицание нормально («никому ничего не сказал»), в английском — грубая ошибка. Как только видишь not или n&#x27;t, дальше ищи anything / anybody / anywhere.</p><h3>4. Сдвиг времён (согласование времён)</h3><p>Правило: <b>если глагол-«вводитель» стоит в прошедшем, время в придаточном сдвигается на шаг назад.</b></p><table><thead><tr><th>Прямая речь</th><th>Косвенная речь</th></tr></thead><tbody><tr><td>Present Simple: I work</td><td>Past Simple: he worked</td></tr><tr><td>Present Continuous: I am working</td><td>Past Continuous: he was working</td></tr><tr><td>Present Perfect / Past Simple: I have done / I did</td><td>Past Perfect: he had done</td></tr><tr><td>will do</td><td>would do</td></tr><tr><td>can do</td><td>could do</td></tr><tr><td>must do</td><td>had to do</td></tr></tbody></table><ul><li>&quot;I am busy,&quot; he said. → He said (that) he <b>was</b> busy. — Он сказал, что занят.</li><li>&quot;I will call you,&quot; she said. → She said she <b>would</b> call me. — Она сказала, что позвонит мне.</li></ul><p>Заодно едут указатели: now → then, today → that day, tomorrow → the next day, yesterday → the day before, here → there, this → that.</p><p>Сдвиг <b>не делаем</b>, если вводящий глагол в настоящем (He says he is busy) или если сказанное — вечная истина (He said water boils at 100°C).</p><h3>5. Косвенный вопрос: прямой порядок слов</h3><p>Это главная ловушка темы. Правило: <b>вопрос, спрятанный внутрь предложения, перестаёт быть вопросом — порядок слов становится прямым, вспомогательный do/does/did исчезает, вопросительный знак не ставится.</b></p><table><thead><tr><th>Прямой вопрос</th><th>Косвенный вопрос</th></tr></thead><tbody><tr><td>What did they talk about?</td><td>I couldn&#x27;t make out what <b>they were talking</b> about.</td></tr><tr><td>Where does she live?</td><td>Tell me where <b>she lives</b>.</td></tr><tr><td>When will he come?</td><td>I don&#x27;t know when <b>he will come</b>.</td></tr><tr><td>Is he ready?</td><td>I wonder <b>if/whether he is</b> ready.</td></tr></tbody></table><ul><li>I don&#x27;t know where <b>she works</b>. — Я не знаю, где она работает. (не ~~where does she work~~)</li><li>Could you tell me what time <b>it is</b>? — Не подскажете, который час? (не ~~what time is it~~)</li></ul><p>Ошибка: ~~I don&#x27;t know where does she work~~. Проверка: если перед вопросительным словом уже есть подлежащее и глагол (I don&#x27;t know..., Tell me..., I wonder...), то дальше — обычное повествовательное предложение.</p><p>Если вопроса-слова нет (ответ да/нет), союз — <b>if</b> или <b>whether</b>: I asked if he was at home.</p><p>Предлог в косвенном вопросе остаётся в конце и относится к вопросительному слову: what they were talking <b>about</b> — «о чём они говорили».</p><h3>6. Определительные придаточные: that / which / who</h3><p>Правило: <b>who — про людей, which — про вещи, that — и про то, и про другое.</b></p><ul><li>The man <b>who</b> called you is my brother. — Мужчина, который тебе звонил, — мой брат.</li><li>The book <b>which/that</b> you gave me is great. — Книга, которую ты мне дал, отличная.</li></ul><p>После <b>everything, all, something, nothing, the only, превосходной степени</b> ставится именно <b>that</b>, не which и не what:</p><ul><li>She will tell you everything <b>that</b> she knows. — Она расскажет вам всё, что знает.</li><li>It&#x27;s the best film <b>that</b> I&#x27;ve ever seen. — Это лучший фильм, что я видел.</li></ul><p>Ошибка: ~~everything what she knows~~. Русское «что» здесь переводится через that, а не what. What внутри придаточного бывает только в значении «то, что»: I heard what he said.</p><p><b>Когда союз можно выкинуть.</b> Если после союза сразу идёт новое подлежащее — союз опускается:</p><ul><li>everything (that) she knows — всё, что она знает</li><li>the book (which) I bought — книга, которую я купил</li></ul><p>Если союз сам является подлежащим придаточного — выкидывать нельзя: The man <b>who</b> called you (не ~~The man called you~~, это уже другое предложение).</p><h3 class=\"prog\">7. Строение простого предложения и порядок слов</h3><p>Правило: <b>в английском предложении смысл несёт порядок слов, а не окончания, поэтому переставлять члены предложения нельзя.</b></p><p>Члены предложения делятся на главные и второстепенные. Термины нужны только для того, чтобы понимать формулировки заданий:</p><table><thead><tr><th>Член предложения</th><th>Отвечает на вопрос</th><th>Пример</th></tr></thead><tbody><tr><td>Подлежащее (subject)</td><td>кто? что?</td><td><b>She</b> read the report.</td></tr><tr><td>Сказуемое (predicate)</td><td>что делает?</td><td>She <b>read</b> the report.</td></tr><tr><td>Дополнение (object)</td><td>кого? что? кому?</td><td>She read <b>the report</b>.</td></tr><tr><td>Определение (attribute)</td><td>какой? чей?</td><td>She read <b>the annual</b> report.</td></tr><tr><td>Обстоятельство (adverbial)</td><td>как? где? когда?</td><td>She read the report <b>at home</b>.</td></tr></tbody></table><p>Жёсткая формула английского порядка слов: <b>подлежащее — сказуемое — дополнение — обстоятельство образа действия — места — времени</b>.</p><ul><li>She read the report <b>carefully at home yesterday</b>. — Она внимательно прочитала отчёт дома вчера.</li><li>He speaks English <b>well</b>. — Он хорошо говорит по-английски.</li></ul><p>По-русски «Отчёт прочитала она» и «Она прочитала отчёт» — одно и то же, меняется только оттенок. В английском ~~The report read she~~ — это уже другое предложение, и оно бессмысленное. Кто стоит первым, тот и подлежащее.</p><p><b>Между подлежащим и глаголом ничего не вставляют.</b> Единственное исключение — наречия частотности (always, often, usually, never, sometimes, rarely):</p><ul><li>He <b>often</b> reads before bed. — Он часто читает перед сном.</li><li>I <b>never</b> eat late. — Я никогда не ем поздно.</li></ul><p>Но с глаголом be эти наречия идут <b>после</b> него: He <b>is always</b> late. — Он всегда опаздывает.</p><p>Обстоятельство времени можно вынести в самое начало, это единственная законная перестановка: <b>Yesterday</b> she read the report. Дополнение и подлежащее так двигать нельзя.</p><h3 class=\"prog\">8. Оборот there is / there are</h3><p>Правило: <b>there is / there are значит «есть, имеется, находится» и вводит новое, ещё не названное; глагол согласуется с первым существительным после оборота.</b></p><ul><li>There <b>is</b> a book on the table. — На столе лежит книга.</li><li>There <b>are</b> two books on the table. — На столе лежат две книги.</li><li>There <b>is</b> a table and two chairs in the room. — В комнате стол и два стула. (первое слово table — единственное число, поэтому is)</li></ul><p>Формы во всех временах строятся от глагола be:</p><table><thead><tr><th>Время</th><th>Форма</th><th>Пример</th></tr></thead><tbody><tr><td>Настоящее</td><td>there is / there are</td><td>There <b>is</b> no time.</td></tr><tr><td>Прошедшее</td><td>there was / there were</td><td>There <b>were</b> many people.</td></tr><tr><td>Будущее</td><td>there will be</td><td>There <b>will be</b> a meeting.</td></tr><tr><td>Perfect</td><td>there has been / there have been</td><td>There <b>have been</b> changes.</td></tr><tr><td>С модальными</td><td>there must be, there can be</td><td>There <b>must be</b> a mistake.</td></tr></tbody></table><p><b>Отрицание</b> — двумя способами, смысл одинаковый: there is <b>no</b> money = there <b>isn&#x27;t any</b> money. — Денег нет.</p><p><b>Вопрос</b> — переставляем be вперёд: <b>Is there</b> a bank near here? — Здесь рядом есть банк? Краткий ответ: Yes, there is / No, there isn&#x27;t.</p><p>Отличие от <b>it is</b>: there is сообщает, что предмет вообще существует или где-то находится; it is говорит, что это за предмет или какой он.</p><ul><li><b>There is</b> a book on the table. — На столе есть книга. (наличие)</li><li><b>It is</b> a book. — Это книга. (что это такое)</li></ul><p>Ошибка: ~~In the room is a table~~, ~~On the table is a book~~. Русское «В комнате стол» переводится только через there is.</p><h3 class=\"prog\">9. Безличные и неопределённо-личные предложения</h3><p>Правило: <b>в английском предложении подлежащее обязано быть, даже когда действующего лица нет — тогда его место занимает формальное it.</b></p><p>По-русски «Холодно» — полное предложение. По-английски ~~Is cold~~ невозможно, нужно <b>It is cold</b>.</p><p>Безличное it ставится, когда речь о погоде, времени, расстоянии, оценке ситуации:</p><ul><li><b>It is</b> cold today. — Сегодня холодно.</li><li><b>It</b> rains a lot in autumn. — Осенью часто идёт дождь.</li><li><b>It is</b> five o&#x27;clock. — Пять часов.</li><li><b>It is</b> two miles to the station. — До станции две мили.</li><li><b>It takes</b> an hour to get there. — Дорога туда занимает час.</li><li><b>It is</b> difficult to say. — Трудно сказать.</li></ul><p>Неопределённо-личные предложения — это русские «говорят», «считается», «никогда не знаешь». Подлежащее тоже обязательно, и в этой роли выступают <b>they, one, people, you</b>:</p><table><thead><tr><th>Английский</th><th>Перевод</th></tr></thead><tbody><tr><td><b>They</b> say he is rich.</td><td>Говорят, он богат.</td></tr><tr><td><b>People</b> believe it is true.</td><td>Считается, что это правда.</td></tr><tr><td><b>One</b> never knows.</td><td>Никогда не знаешь.</td></tr><tr><td><b>You</b> never can tell.</td><td>Кто его знает.</td></tr><tr><td><b>It is</b> said that he is rich.</td><td>Говорят, что он богат. (пассивный вариант)</td></tr></tbody></table><p>Местоимение <b>one</b> — книжное и требует глагола в форме третьего лица: one <b>knows</b>, one <b>is</b>. Ошибка: ~~one know~~.</p><h3 class=\"prog\">10. Отрицание</h3><p>Правило: <b>отрицание строится вспомогательным глаголом плюс not; смысловой глагол при этом теряет окончания и остаётся в первой форме.</b></p><ul><li>He does <b>not</b> work here. — Он здесь не работает. (не ~~he not works~~, не ~~he doesn&#x27;t works~~)</li><li>I did <b>not</b> go. — Я не пошёл. (не ~~didn&#x27;t went~~)</li><li>She has <b>not</b> seen it. — Она этого не видела.</li><li>They will <b>not</b> come. — Они не придут.</li></ul><p>Глаголы <b>be</b> и модальные (can, must, should) обходятся без вспомогательного: He <b>is not</b> here. I <b>cannot</b> come.</p><p><b>no против not any.</b> Оба варианта переводятся одинаково, но строятся по-разному: <b>no</b> ставится прямо перед существительным и заменяет собой отрицание глагола, <b>not any</b> требует отрицательного глагола.</p><ul><li>There is <b>no</b> money. = There <b>isn&#x27;t any</b> money. — Денег нет.</li><li>I have <b>no</b> time. = I <b>haven&#x27;t got any</b> time. — У меня нет времени.</li></ul><p>Ошибка: ~~There isn&#x27;t no money~~, ~~I haven&#x27;t no time~~ — это второе отрицание, а оно запрещено (см. раздел 3).</p><h3 class=\"prog\">11. Типы вопросов и краткие ответы</h3><p>Правило: <b>порядок в вопросе — вопросительное слово, вспомогательный глагол, подлежащее, смысловой глагол.</b></p><table><thead><tr><th>Тип</th><th>Пример</th><th>Что спрашиваем</th></tr></thead><tbody><tr><td>Общий</td><td><b>Do</b> you work here?</td><td>Да или нет</td></tr><tr><td>Специальный</td><td><b>What do</b> you do?</td><td>Конкретную информацию</td></tr><tr><td>Альтернативный</td><td><b>Tea or coffee?</b></td><td>Выбор из двух</td></tr><tr><td>Разделительный (tag)</td><td>You work here, <b>don&#x27;t you</b>?</td><td>Подтверждение</td></tr><tr><td>К подлежащему</td><td><b>Who</b> wrote this?</td><td>Кто именно сделал</td></tr></tbody></table><p><b>Краткий ответ</b> на общий вопрос повторяет вспомогательный глагол, а не смысловой:</p><ul><li>Do you work here? — Yes, I <b>do</b> / No, I <b>don&#x27;t</b>.</li><li>Is she ready? — Yes, she <b>is</b> / No, she <b>isn&#x27;t</b>.</li><li>Have you seen it? — Yes, I <b>have</b> / No, I <b>haven&#x27;t</b>.</li></ul><p>Ошибка: ~~Yes, I work~~, ~~Yes, I am~~ в ответ на вопрос с do.</p><p><b>Разделительный вопрос</b> строится по правилу «плюс к минусу, минус к плюсу»: если основная часть утвердительная, хвостик отрицательный, и наоборот.</p><ul><li>You work here, <b>don&#x27;t you</b>? — Ты ведь здесь работаешь?</li><li>She isn&#x27;t ready, <b>is she</b>? — Она ведь не готова?</li></ul><p>Особые случаи, которые надо знать наизусть:</p><table><thead><tr><th>Начало</th><th>Хвостик</th><th>Пример</th></tr></thead><tbody><tr><td>I am …</td><td><b>aren&#x27;t I</b></td><td>I am right, <b>aren&#x27;t I</b>?</td></tr><tr><td>Let&#x27;s …</td><td><b>shall we</b></td><td>Let&#x27;s go, <b>shall we</b>?</td></tr><tr><td>Повелительное</td><td><b>will you</b></td><td>Close the door, <b>will you</b>?</td></tr><tr><td>There is …</td><td><b>isn&#x27;t there</b></td><td>There is a problem, <b>isn&#x27;t there</b>?</td></tr></tbody></table><p><b>Вопрос к подлежащему</b> — регулярная ловушка. Вопросительное слово who или what само стоит на месте подлежащего, поэтому вспомогательный do/does/did <b>не нужен</b>, а порядок слов прямой.</p><ul><li><b>Who wrote</b> this letter? — Кто написал это письмо? (не ~~Who did write~~)</li><li><b>What happened</b>? — Что случилось? (не ~~What did happen~~)</li></ul><p>Сравни: Who <b>called</b> you? (кто звонил — вопрос к подлежащему) и Who <b>did</b> you call? (кому ты звонил — вопрос к дополнению, тут do нужен).</p><p>Глагол в вопросе к подлежащему стоит в третьем лице единственного числа: Who <b>works</b> here?</p><h3 class=\"prog\">12. Повелительное предложение</h3><p>Правило: <b>приказ и просьба строятся глаголом в первой форме без подлежащего; отрицание — через Don&#x27;t.</b></p><ul><li><b>Open</b> the door. — Открой дверь.</li><li><b>Don&#x27;t be</b> late. — Не опаздывай.</li><li><b>Don&#x27;t</b> worry. — Не волнуйся.</li><li><b>Let&#x27;s</b> start. — Давай начнём. (побуждение к совместному действию)</li><li><b>Let him</b> try. — Пусть он попробует.</li></ul><p>Отрицание для let&#x27;s — <b>let&#x27;s not</b>: Let&#x27;s not argue. — Давай не будем спорить.</p><p>Слово please смягчает просьбу и стоит в начале или в конце: <b>Please</b> close the window. / Close the window, <b>please</b>.</p><h3 class=\"prog\">13. Инверсия: когда она обязательна</h3><p>Правило: <b>если предложение начинается с отрицательного или ограничительного наречия, за ним идёт вспомогательный глагол, и только потом подлежащее.</b></p><p>Это единственный случай, когда прямой порядок слов законно нарушается.</p><ul><li><b>Never have I</b> seen anything like it. — Никогда я не видел ничего подобного.</li><li><b>Hardly had he</b> arrived when the phone rang. — Едва он приехал, как зазвонил телефон.</li><li><b>Not only did she</b> call, she also came. — Она не только позвонила, но и приехала.</li><li><b>Only then did I</b> understand. — Только тогда я понял.</li><li><b>Seldom do we</b> get such a chance. — Редко нам выпадает такой шанс.</li></ul><p>Схема одинаковая: отрицательное наречие — вспомогательный (have, had, did, do) — подлежащее — смысловой глагол. Если своего вспомогательного в предложении нет, появляется do/did, как в вопросе.</p><p>Инверсия также обязательна в коротких откликах <b>So do I / Neither do I</b>:</p><ul><li>I like coffee. — <b>So do I.</b> — И я тоже.</li><li>I don&#x27;t like coffee. — <b>Neither do I.</b> — И я тоже нет.</li><li>She was tired. — <b>So was I.</b></li></ul><p>И в оборотах с here/there в начале, если подлежащее — существительное: <b>Here comes</b> the bus. — Вот и автобус. Но с местоимением инверсии нет: <b>Here it comes</b>.</p><p>Важное ограничение: <b>инверсия касается только главного предложения.</b> В придаточном после such, that, when порядок слов остаётся прямым: Not only <b>did she</b> call, but she also said <b>she was</b> coming. И в конструкции «чем …, тем …» инверсия запрещена совсем — там всегда the more you read (см. памятку 06).</p><h3 class=\"prog\">14. Обороты с вводным it</h3><p>Правило: <b>конструкция it is … that / who выделяет одно слово в предложении, переводится русским «именно».</b></p><ul><li><b>It was John who</b> called. — Именно Джон звонил.</li><li><b>It was yesterday that</b> we met. — Именно вчера мы встретились.</li><li><b>It is money that</b> they want. — Им нужны именно деньги.</li></ul><p>Схема: it is/was — выделяемое слово — that (или who для людей) — остальное предложение. Обрати внимание: сам смысл предложения не меняется, меняется только акцент. Обычный вариант John called сообщает факт, It was John who called возражает тому, кто думал иначе.</p><p>Второй оборот — <b>it is … since</b> в значении «прошло столько-то времени с тех пор, как»:</p><ul><li><b>It is</b> two years <b>since</b> we met. — Прошло два года с тех пор, как мы виделись.</li><li><b>It was</b> a long time <b>since</b> he had been there. — Прошло много времени с тех пор, как он там был.</li></ul><p>После since время прошедшее, а в главной части — настоящее. Русское «прошло» переводится настоящим временем: не ~~it passed~~, а it <b>is</b>.</p><h3 class=\"prog\">15. Сложносочинённое предложение и виды придаточных</h3><p>Правило: <b>сочинение соединяет два равноправных предложения, подчинение делает одно зависимым от другого.</b></p><p>Союзы сочинения: <b>and</b> (и), <b>but</b> (но), <b>or</b> (или), <b>so</b> (поэтому), <b>yet</b> (однако), <b>both … and</b> (и то, и другое), <b>either … or</b> (либо … либо), <b>neither … nor</b> (ни … ни).</p><ul><li>I called him, <b>but</b> he didn&#x27;t answer. — Я звонил ему, но он не ответил.</li><li><b>Either</b> you go <b>or</b> I do. — Либо ты идёшь, либо я.</li></ul><p>Согласование сказуемого в парных союзах: глагол согласуется с <b>ближайшим</b> к нему подлежащим.</p><ul><li><b>Neither</b> he <b>nor</b> they <b>are</b> ready. — Ни он, ни они не готовы. (ближе стоит they)</li><li><b>Neither</b> they <b>nor</b> he <b>is</b> ready. — Ни они, ни он не готовы.</li><li><b>Both</b> he <b>and</b> she <b>are</b> here. — И он, и она здесь. (both … and всегда множественное)</li></ul><p>Виды придаточных предложений:</p><table><thead><tr><th>Вид</th><th>Союзы</th><th>Пример</th></tr></thead><tbody><tr><td>Определительное</td><td>who, which, that</td><td>The man <b>who</b> called (см. раздел 6)</td></tr><tr><td>Дополнительное</td><td>that, if, whether, what</td><td>I know <b>that</b> he is right.</td></tr><tr><td>Времени</td><td>when, while, as soon as, until, before, after</td><td>Call me <b>when</b> you arrive.</td></tr><tr><td>Условия</td><td>if, unless, in case</td><td><b>If</b> it rains, we&#x27;ll stay (см. памятку 02)</td></tr><tr><td>Причины</td><td>because, as, since</td><td>He left <b>because</b> he was tired.</td></tr><tr><td>Цели</td><td>so that, in order to</td><td>I came early <b>so that</b> we could talk.</td></tr><tr><td>Уступки</td><td>although, though, despite the fact that</td><td><b>Although</b> it was late, he called.</td></tr><tr><td>Следствия</td><td>so … that, such … that</td><td>It was <b>so</b> cold <b>that</b> we stayed in.</td></tr></tbody></table><p>Разница so и such: <b>so</b> ставится перед прилагательным или наречием, <b>such</b> — перед существительным. It was <b>so</b> cold. / It was <b>such</b> a cold day.</p><p><b>Важнейшее правило темы: после союзов времени и условия будущее время не ставится, вместо него — настоящее.</b></p><ul><li><b>When he comes</b>, I&#x27;ll tell him. — Когда он придёт, я ему скажу. (не ~~when he will come~~)</li><li><b>As soon as I finish</b>, I&#x27;ll call you. — Как только закончу, позвоню тебе.</li><li>I&#x27;ll wait <b>until she arrives</b>. — Я подожду, пока она не придёт.</li><li><b>If it rains</b>, we&#x27;ll stay at home. — Если пойдёт дождь, останемся дома.</li></ul><p>Правило работает только тогда, когда when и if вводят придаточное времени или условия. Если when — вопросительное слово или вводит дополнительное придаточное, будущее время сохраняется: I don&#x27;t know <b>when he will come</b>. — Я не знаю, когда он придёт.</p><h3>Ловушки этой темы (из банка)</h3><p><b>en-0001. I couldn&#x27;t make ... what ... about.</b> — «Я не мог разобрать, о чём они говорили». Верно: <b>out ... they were talking</b>. Два пропуска, два правила.</p><ul><li>Фразовый глагол: make <b>out</b> — «разобрать, разглядеть, расслышать». Вариантов make in и make through не существует, make off — это «сбежать».</li><li>Второй пропуск — косвенный вопрос. Варианты «did the talk» и «were they talking» дают вопросительный порядок слов, а вопроса тут уже нет. Нужен прямой: they were talking.</li><li>Почему were, а не are: главное couldn&#x27;t в прошедшем, значит и придаточное едет в прошедшее. «they are talking» отпадает по согласованию времён.</li></ul><p><b>en-0006. I&#x27;ve been ... anything about the results.</b> — «Мне велели ничего не говорить о результатах». Верно: <b>told not to say</b>. Три ловушки сразу.</p><ul><li>said not to tell — пассива от say не бывает, только I&#x27;ve been <b>told</b>.</li><li>told not say — потеряли частицу to, а формула жёсткая: not <b>to</b> do.</li><li>said to say nobody about — двойная беда: и say вместо tell, и say не берёт человека без предлога.</li><li>«not to tell nobody» — двойное отрицание, за него в английском ставят минус автоматически. Раз есть not, дальше только anything.</li></ul><p><b>en-0013. If asked the assistant will tell ... she knows.</b> — «Помощница расскажет вам всё, что знает». Верно: <b>you everything</b>.</p><ul><li>to you everything what — лишний to (tell не берёт предлог) и what вместо that.</li><li>it to you all what — снова предлог и снова what.</li><li>everything that — грамматически чисто, но выпал адресат: tell требует, чтобы было сказано, кому. Плюс полное правильное предложение как раз показывает, что that после everything обычно опускают: everything she knows.</li></ul><h3>Мини-чек перед ответом</h3><ol><li>Кому сказали? Если человек стоит сразу за глаголом — только tell. Есть to — say.</li><li>Пассив? Только I was told.</li><li>Есть not или n&#x27;t? Дальше — anything/anybody, не nothing/nobody.</li><li>Вопросительное слово внутри предложения? Убери do/does/did и поставь подлежащее перед глаголом.</li><li>Главный глагол в прошедшем? Сдвинь время в придаточном назад.</li><li>После everything / all / the only — только that.</li><li>Порядок слов: подлежащее — сказуемое — дополнение — как — где — когда. Между подлежащим и глаголом только наречия частотности.</li><li>Русское «есть, имеется» — только there is / there are, и глагол по первому существительному.</li><li>Русское «холодно», «говорят» — подставь формальное подлежащее: it is cold, they say.</li><li>Вопрос со словом who или what о том, кто действует? Никакого do, порядок слов прямой.</li><li>После when, as soon as, until, if будущего времени нет — ставь настоящее.</li></ol>", "4": "<h2>Местоимения, определители, артикли</h2><p>Эта тема про маленькие слова перед существительным: a, the, this, some, any, nobody. Экзамен почти всегда бьёт в одну точку — исчисляемость. Половина неверных вариантов ломается на том, что слово вроде advice или money в английском нельзя посчитать.</p><h3>1. Исчисляемые и неисчисляемые существительные</h3><p>Правило: <b>неисчисляемое существительное не имеет множественного числа и не берёт артикль a/an.</b></p><p>Список, который надо просто выучить — по-русски они считаются, по-английски нет:</p><table><thead><tr><th>Слово</th><th>Перевод</th><th>Нельзя</th><th>Можно</th></tr></thead><tbody><tr><td>advice</td><td>совет</td><td>~~an advice, advices~~</td><td>a piece of advice, some advice</td></tr><tr><td>information</td><td>информация</td><td>~~an information, informations~~</td><td>a piece of information</td></tr><tr><td>news</td><td>новость</td><td>~~a news, newses~~</td><td>a piece of news</td></tr><tr><td>money</td><td>деньги</td><td>~~a money, moneys~~</td><td>some money, a sum of money</td></tr><tr><td>knowledge</td><td>знания</td><td>~~knowledges~~</td><td>some knowledge</td></tr><tr><td>permission</td><td>разрешение</td><td>~~a permission~~</td><td>permission to do</td></tr><tr><td>furniture</td><td>мебель</td><td>~~a furniture, furnitures~~</td><td>a piece of furniture</td></tr><tr><td>luggage / baggage</td><td>багаж</td><td>~~a luggage~~</td><td>a piece of luggage</td></tr><tr><td>work</td><td>работа (труд)</td><td>~~a work, works~~</td><td>a job (вот это считается)</td></tr><tr><td>research, progress, weather, hair, bread, water</td><td>—</td><td>без a и без -s</td><td>some / a piece of</td></tr></tbody></table><ul><li>Can I give you <b>a piece of advice</b>? — Можно дать вам совет?</li><li>He gave me <b>some information</b> about the course. — Он дал мне информацию о курсе.</li></ul><p>Ошибка: ~~an advice~~, ~~some advices~~, ~~a few advice~~. Партитив «a piece of» — универсальная отмычка: артикль лепится к слову piece, а не к неисчисляемому.</p><p><b>Согласование.</b> Неисчисляемое — всегда единственное число, даже если по-русски множественное:</p><ul><li>This money <b>belongs</b> to the fund. — Эти деньги принадлежат фонду.</li><li>The news <b>is</b> good. — Новости хорошие.</li></ul><p>Ошибка: ~~these money belong~~, ~~the news are~~.</p><h3>2. much / many / few / little / some / any</h3><p>Правило: <b>many и few — к исчисляемым, much и little — к неисчисляемым.</b></p><table><thead><tr><th>Исчисляемые</th><th>Неисчисляемые</th></tr></thead><tbody><tr><td>many books — много книг</td><td>much money — много денег</td></tr><tr><td>a few books — несколько книг</td><td>a little money — немного денег</td></tr><tr><td>few books — мало книг (почти нет)</td><td>little money — мало денег (почти нет)</td></tr><tr><td>How many?</td><td>How much?</td></tr></tbody></table><p>Разница a few / few принципиальная: <b>a few — «немного, но есть», few — «мало, почти ничего»</b>. I have a few friends — у меня есть несколько друзей. I have few friends — у меня почти нет друзей. То же с a little / little.</p><ul><li>I need <b>a little</b> advice. — Мне нужен небольшой совет. (не ~~a few advice~~)</li></ul><p><b>some / any</b>: some — в утверждениях и вежливых предложениях, any — в вопросах и отрицаниях. I have <b>some</b> money. Do you have <b>any</b> money? I don&#x27;t have <b>any</b> money.</p><p>Some — определитель, ему нужно существительное следом (some people). Один, без существительного, подлежащим он быть не может.</p><h3>3. Указательные: this / that / these / those</h3><p>Правило: <b>this-these — «это, вот здесь», that-those — «то, там»; this-that — единственное число, these-those — множественное.</b></p><table><thead><tr><th></th><th>Единственное</th><th>Множественное</th></tr></thead><tbody><tr><td>Ближе / сейчас</td><td>this book</td><td>these books</td></tr><tr><td>Дальше / тогда</td><td>that book</td><td>those books</td></tr></tbody></table><ul><li><b>This</b> money belongs to the fund. — Эти деньги принадлежат фонду. (money — единственное!)</li><li><b>These</b> books are mine. — Эти книги мои.</li></ul><p>Ошибка: ~~these money~~, ~~this books~~. Смотри не на русский перевод, а на английское число слова.</p><h3>4. Неопределённые и отрицательные местоимения</h3><table><thead><tr><th>some- (утверждение)</th><th>any- (вопрос, отрицание)</th><th>no- (отрицание в самом слове)</th><th>every-</th></tr></thead><tbody><tr><td>somebody / someone</td><td>anybody / anyone</td><td>nobody / no one</td><td>everybody</td></tr><tr><td>something</td><td>anything</td><td>nothing</td><td>everything</td></tr><tr><td>somewhere</td><td>anywhere</td><td>nowhere</td><td>everywhere</td></tr></tbody></table><p>Два правила, которые дают почти все баллы в этой теме.</p><p><b>Правило одного отрицания.</b> В английском предложении отрицание может быть только одно.</p><ul><li><b>Nobody</b> has lived here for a long time. — Здесь давно никто не живёт.</li><li>То же самое иначе: <b>Anybody</b> hasn&#x27;t lived — так нельзя, это классическая ошибка.</li><li>I don&#x27;t know <b>anything</b>. = I know <b>nothing</b>. Но не ~~I don&#x27;t know nothing~~.</li></ul><p>Логика: либо отрицание в глаголе (don&#x27;t + anything), либо в местоимении (nothing + утвердительный глагол). Никогда одновременно.</p><p><b>Согласование в единственном числе.</b> Все слова на -body, -one, -thing — единственное число, глагол с -s.</p><ul><li>Nobody <b>has</b> lived here. Everybody <b>is</b> ready. Something <b>looks</b> strange.</li></ul><p>Ошибка: ~~Nobody have lived~~, ~~Everybody are~~.</p><p>Ещё разница: <b>-body/-one — только о людях, -thing — только о предметах</b>. Something has lived in this house нельзя, потому что живут люди.</p><h3>5. Артикли a / an / the / нулевой</h3><p><b>a/an</b> — предмет исчисляемый, в единственном числе, упоминается впервые или как «один из класса».</p><ul><li>I saw <b>a</b> dog. — Я увидел собаку (какую-то).</li><li>an перед гласным звуком: an apple, an hour (h не читается), но a university (звучит «ю»).</li></ul><p><b>the</b> — предмет уже известен, единственный в своём роде, или уточнён определением.</p><ul><li>I saw a dog. <b>The</b> dog was black. — Собака (та самая) была чёрная.</li><li><b>the</b> sun, <b>the</b> moon, <b>the</b> Internet — единственные в мире.</li><li><b>the</b> best film, <b>the</b> first day — с превосходной степенью и порядковыми числительными всегда the.</li><li><b>the</b> results <b>of</b> the examination — есть уточнение через of, значит the.</li></ul><p><b>Нулевой артикль</b> (ничего не ставим): множественное число в общем смысле (Books are expensive); неисчисляемые в общем смысле (Money is important); имена, города, страны (кроме the USA, the UK); приёмы пищи (have breakfast); языки и предметы (speak English, study history).</p><p>Ошибка: ~~The books are expensive~~, когда речь о книгах вообще.</p><h3>6. Устойчивые сочетания с местом</h3><p>Правило: <b>если речь о функции места, артикля нет; если о здании как объекте — the.</b></p><table><thead><tr><th>Без артикля (функция)</th><th>С артиклем (здание/объект)</th></tr></thead><tbody><tr><td>at home — дома</td><td>in the house — в доме (внутри строения)</td></tr><tr><td>at school — учится</td><td>in the school — внутри здания школы</td></tr><tr><td>at work — на работе</td><td>at the office — в офисе</td></tr><tr><td>in bed — спит</td><td>on the bed — на кровати</td></tr><tr><td>go to hospital — лечится</td><td>go to the hospital — пришёл в здание</td></tr><tr><td>by car, by bus, on foot</td><td>in the car, on the bus</td></tr></tbody></table><ul><li>She is <b>at home</b>. — Она дома. (не ~~in home~~, не ~~at the home~~)</li><li>The keys are <b>in the house</b>. — Ключи в доме.</li></ul><p>Связки со временем: at night, in the morning, at the weekend, on Monday, in June, at 5 o&#x27;clock.</p><h3>7. such и so (тоже часть этой темы)</h3><p>Правило: <b>есть существительное — such; нет существительного — so.</b></p><ul><li>It&#x27;s <b>such an</b> interesting film. — Это такой интересный фильм.</li><li>The film is <b>so</b> interesting. — Фильм такой интересный.</li></ul><p>Порядок жёсткий: <b>such + a/an + прилагательное + существительное</b>. Артикль идёт после such, не перед.</p><p>Ошибка: ~~a such interesting film~~, ~~so interesting film~~.</p><p>С неисчисляемым и множественным артикль просто исчезает: such good advice, such interesting films.</p><h3 class=\"prog\">8. Личные и притяжательные местоимения</h3><p>Правило: <b>личное местоимение меняет форму в зависимости от того, подлежащее оно или дополнение.</b></p><table><thead><tr><th>Подлежащее (кто?)</th><th>Дополнение (кого, кому?)</th><th>Притяжательное прилагательное (чей? + существительное)</th><th>Абсолютная форма (чей? без существительного)</th></tr></thead><tbody><tr><td>I — я</td><td>me — меня, мне</td><td>my — мой</td><td>mine — мой</td></tr><tr><td>you — ты, вы</td><td>you — тебя, вас</td><td>your — твой</td><td>yours — твой</td></tr><tr><td>he — он</td><td>him — его, ему</td><td>his — его</td><td>his — его</td></tr><tr><td>she — она</td><td>her — её, ей</td><td>her — её</td><td>hers — её</td></tr><tr><td>it — оно (предмет)</td><td>it — его (предмет)</td><td>its — его, её</td><td>its (почти не используется)</td></tr><tr><td>we — мы</td><td>us — нас, нам</td><td>our — наш</td><td>ours — наш</td></tr><tr><td>they — они</td><td>them — их, им</td><td>their — их</td><td>theirs — их</td></tr></tbody></table><ul><li><b>I</b> know <b>him</b>, but <b>he</b> doesn&#x27;t know <b>me</b>. — Я знаю его, а он меня не знает.</li><li><b>She</b> gave <b>us</b> the documents. — Она дала нам документы.</li></ul><p>Разница двух притяжательных форм: <b>после my/your/his обязательно идёт существительное, после mine/yours/his — ничего.</b></p><ul><li>This is <b>my</b> book. — Это моя книга.</li><li>This book is <b>mine</b>. — Эта книга моя. (не ~~is my~~, не ~~is my book mine~~)</li><li><b>Our</b> office is bigger than <b>theirs</b>. — Наш офис больше, чем их.</li></ul><p>Ошибка: ~~a my friend~~. Артикль и притяжательное местоимение вместе не ставятся, вместо этого — двойной падеж: <b>a friend of mine</b> — один мой друг.</p><p><b>Три ловушки на письме.</b> Слова звучат одинаково, но значат разное:</p><table><thead><tr><th>Форма</th><th>Что это</th><th>Пример</th></tr></thead><tbody><tr><td>its</td><td>притяжательное «его, её» (о предмете)</td><td>The company increased <b>its</b> profit. — Компания увеличила свою прибыль.</td></tr><tr><td>it&#x27;s</td><td>сокращение it is / it has</td><td><b>It&#x27;s</b> a good idea. — Это хорошая идея.</td></tr><tr><td>their</td><td>их (чей?)</td><td><b>Their</b> report is ready. — Их отчёт готов.</td></tr><tr><td>there</td><td>там; there is/are — есть</td><td><b>There</b> are two options. — Есть два варианта.</td></tr><tr><td>they&#x27;re</td><td>сокращение they are</td><td><b>They&#x27;re</b> late. — Они опаздывают.</td></tr><tr><td>whose</td><td>чей</td><td>The man <b>whose</b> car was stolen. — Человек, чью машину угнали.</td></tr><tr><td>who&#x27;s</td><td>сокращение who is / who has</td><td><b>Who&#x27;s</b> responsible? — Кто отвечает?</td></tr></tbody></table><p>Проверка одна: подставь полную форму. Если «it is» на месте — пиши it&#x27;s, если нет — its. Апостроф в этих словах всегда означает пропущенный глагол, а не принадлежность.</p><h3 class=\"prog\">9. Возвратные местоимения (-self / -selves)</h3><p>Правило: <b>возвратное местоимение ставится, когда действие возвращается на того, кто его совершает.</b></p><table><thead><tr><th>Единственное число</th><th>Множественное число</th></tr></thead><tbody><tr><td>myself — себя, сам</td><td>ourselves — себя, сами</td></tr><tr><td>yourself — себя, сам</td><td>yourselves — себя, сами</td></tr><tr><td>himself / herself / itself</td><td>themselves</td></tr></tbody></table><ul><li>He hurt <b>himself</b>. — Он поранился (сам себя).</li><li>Compare: He hurt <b>him</b>. — Он поранил его (другого человека).</li><li>We introduced <b>ourselves</b>. — Мы представились.</li></ul><p><b>Усилительное значение</b> — «сам, лично». Тогда местоимение можно убрать, и предложение не сломается:</p><ul><li>The manager <b>himself</b> signed the contract. — Договор подписал сам директор.</li><li>I spoke to the director <b>herself</b>. — Я говорил с самой директрисой.</li></ul><p><b>Оборот by + себя</b> = самостоятельно, без чужой помощи, или в одиночестве:</p><ul><li>She did it <b>by herself</b>. — Она сделала это сама.</li><li>I live <b>by myself</b>. — Я живу один.</li></ul><p>Ловушка. Часть английских глаголов возвратными не бывает вообще, хотя по-русски там стоит «-ся». Это feel, relax, concentrate, wash, dress, shave, hurry, meet:</p><ul><li>I <b>feel</b> well. — Я чувствую себя хорошо. (не ~~I feel myself well~~ — грубая калька с русского)</li><li>He <b>washed</b> and <b>dressed</b> quickly. — Он умылся и оделся.</li><li>Try to <b>concentrate</b>. — Постарайся сосредоточиться.</li></ul><h3 class=\"prog\">10. Взаимные местоимения: each other / one another</h3><p>Правило: <b>each other и one another значат «друг друга»; строго each other о двоих, one another о многих, но в современном языке разница почти стёрлась.</b></p><ul><li>The two managers help <b>each other</b>. — Двое руководителей помогают друг другу.</li><li>The students in the group support <b>one another</b>. — Студенты в группе поддерживают друг друга.</li></ul><p>Притяжательная форма — с апострофом на конце:</p><ul><li>They read <b>each other&#x27;s</b> reports. — Они читают отчёты друг друга.</li><li>The colleagues respect <b>one another&#x27;s</b> opinions. — Коллеги уважают мнения друг друга.</li></ul><p>Не путай с возвратными: <b>They looked at themselves</b> — каждый смотрел на себя (в зеркало); <b>They looked at each other</b> — они посмотрели друг на друга.</p><h3 class=\"prog\">11. Слово-заместитель one / ones</h3><p>Правило: <b>one заменяет уже названное исчисляемое существительное в единственном числе, ones — во множественном, чтобы не повторять слово дважды.</b></p><ul><li>I don&#x27;t like the red car, I prefer the blue <b>one</b>. — Мне не нравится красная машина, я предпочитаю синюю.</li><li>These shoes are cheaper than <b>the ones</b> in the window. — Эти туфли дешевле тех, что на витрине.</li><li>Which book do you want? — The <b>one</b> on the table. — Ту, что на столе.</li></ul><p>Артикль перед one ставится по общему правилу: <b>the one</b>, если предмет уточнён (the one in the window), <b>a … one</b> после прилагательного (I need a new one).</p><p>С неисчисляемыми one не работает: ~~I have advice, do you need one?~~ — там просто some: Do you need <b>some</b>?</p><p>Не путай с двумя другими one:</p><ul><li>Обобщающее <b>one</b> = «человек вообще», книжный стиль: <b>One</b> never knows. — Никогда не знаешь. The better educated <b>one</b> is… — Чем лучше человек образован… Это уже встречалось в теме сравнения.</li><li>Числительное <b>one</b> = «один»: I have only <b>one</b> question. — У меня только один вопрос.</li></ul><h3 class=\"prog\">12. Вопросительно-относительные местоимения</h3><p>Правило: <b>who — о людях, which — о предметах, that — и о тех, и о других; whose — принадлежность, whom — форма дополнения.</b></p><table><thead><tr><th>Слово</th><th>Значение</th><th>Пример</th></tr></thead><tbody><tr><td>who</td><td>кто; который (о человеке)</td><td>The man <b>who</b> called you is here. — Человек, который звонил, здесь.</td></tr><tr><td>whom</td><td>кого, кому (книжная форма дополнения)</td><td>The man <b>whom</b> we invited. — Человек, которого мы пригласили.</td></tr><tr><td>whose</td><td>чей</td><td>The student <b>whose</b> essay won. — Студент, чьё эссе победило.</td></tr><tr><td>which</td><td>какой из; который (о предмете)</td><td>The report <b>which</b> you sent. — Отчёт, который ты прислал.</td></tr><tr><td>that</td><td>который (и люди, и предметы)</td><td>The book <b>that</b> I read. — Книга, которую я прочитал.</td></tr><tr><td>what</td><td>что; какой (набор открыт)</td><td><b>What</b> do you want? — Чего ты хочешь?</td></tr></tbody></table><p><b>whom</b> нужен там, где местоимение — дополнение, особенно после предлога: To <b>whom</b> did you speak? В разговорной речи вместо него ставят who, но в экзаменационных заданиях после предлога правильный вариант — whom.</p><p><b>what против which</b> — разница в выборе:</p><ul><li><b>What</b> colour do you like? — Какой цвет тебе нравится? (любой из всех, набор не ограничен)</li><li><b>Which</b> colour do you prefer, red or blue? — Какой цвет ты предпочитаешь, красный или синий? (выбор из закрытого набора)</li><li><b>Which</b> of these books is yours? — Которая из этих книг твоя? (перед of всегда which, не what)</li></ul><h3 class=\"prog\">13. Существительное: число и падеж</h3><p>Правило: <b>множественное число обычно образуется через -s, но группа частотных слов делает это не по правилам, и их надо знать наизусть.</b></p><p>Регулярные способы:</p><table><thead><tr><th>Случай</th><th>Как</th><th>Пример</th></tr></thead><tbody><tr><td>Обычное слово</td><td>+ s</td><td>book — book<b>s</b></td></tr><tr><td>После s, x, ch, sh, o</td><td>+ es</td><td>box — box<b>es</b>, watch — watch<b>es</b>, potato — potato<b>es</b></td></tr><tr><td>Согласная + y</td><td>y → ies</td><td>company — compan<b>ies</b>, city — cit<b>ies</b></td></tr><tr><td>Гласная + y</td><td>просто + s</td><td>day — day<b>s</b>, key — key<b>s</b></td></tr><tr><td>f / fe</td><td>→ ves</td><td>leaf — lea<b>ves</b>, life — li<b>ves</b>, wife — wi<b>ves</b></td></tr></tbody></table><p>Неправильные формы:</p><table><thead><tr><th>Единственное</th><th>Множественное</th><th>Единственное</th><th>Множественное</th></tr></thead><tbody><tr><td>man</td><td>men</td><td>foot</td><td>feet</td></tr><tr><td>woman</td><td>women</td><td>tooth</td><td>teeth</td></tr><tr><td>child</td><td>children</td><td>mouse</td><td>mice</td></tr><tr><td>person</td><td>people</td><td>goose</td><td>geese</td></tr></tbody></table><p>Латинские и греческие формы — они постоянно встречаются в академических текстах, а экзамен любит спрашивать именно их:</p><table><thead><tr><th>Единственное</th><th>Множественное</th><th>Перевод</th></tr></thead><tbody><tr><td>phenomenon</td><td>phenomena</td><td>явление</td></tr><tr><td>criterion</td><td>criteria</td><td>критерий</td></tr><tr><td>datum</td><td>data</td><td>данные</td></tr><tr><td>medium</td><td>media</td><td>средство, СМИ</td></tr><tr><td>analysis</td><td>analyses</td><td>анализ</td></tr><tr><td>crisis</td><td>crises</td><td>кризис</td></tr><tr><td>basis</td><td>bases</td><td>основа</td></tr><tr><td>thesis</td><td>theses</td><td>тезис, диссертация</td></tr><tr><td>index</td><td>indices (indexes)</td><td>показатель, индекс</td></tr><tr><td>appendix</td><td>appendices</td><td>приложение</td></tr></tbody></table><ul><li>These <b>data</b> are reliable. — Эти данные надёжны.</li><li>The <b>criteria</b> <b>are</b> clear. — Критерии ясны. (не ~~criterias~~, не ~~criteria is~~)</li></ul><p>Слова, у которых обе формы совпадают: <b>sheep, deer, fish, means, series, species, aircraft</b>. Число видно только по глаголу: This <b>means</b> is effective. These <b>means</b> <b>are</b> effective.</p><p><b>Притяжательный падеж.</b> Правило: <b>&#x27;s ставится к одушевлённым, для неодушевлённых используется of.</b></p><table><thead><tr><th>Случай</th><th>Форма</th><th>Пример</th></tr></thead><tbody><tr><td>Единственное число</td><td>&#x27;s</td><td>the manager<b>&#x27;s</b> report — отчёт руководителя</td></tr><tr><td>Множественное на -s</td><td>&#x27; (только апостроф)</td><td>the managers<b>&#x27;</b> reports — отчёты руководителей</td></tr><tr><td>Неправильное множественное</td><td>&#x27;s</td><td>the children<b>&#x27;s</b> books, women<b>&#x27;s</b> rights</td></tr><tr><td>Имя на -s</td><td>&#x27;s или &#x27;</td><td>Charles<b>&#x27;s</b> car / Charles<b>&#x27;</b> car</td></tr><tr><td>Неодушевлённое</td><td>of</td><td>the roof <b>of</b> the house — крыша дома</td></tr></tbody></table><p>Ошибка: ~~the house&#x27;s roof~~ в нейтральном тексте, ~~the childrens&#x27; books~~ (children уже множественное, апостроф идёт перед s).</p><p><b>Двойной падеж</b> — когда нужны и принадлежность, и неопределённость. Артикль с &#x27;s не сочетается, поэтому конструкция разбивается через of:</p><ul><li><b>a friend of my father&#x27;s</b> — один из друзей моего отца (не ~~a my father&#x27;s friend~~)</li><li><b>a colleague of mine</b> — один мой коллега</li></ul><p>Обороты со временем и мерой берут &#x27;s, хотя это не одушевлённые слова:</p><ul><li><b>today&#x27;s</b> news — сегодняшние новости</li><li><b>a week&#x27;s</b> holiday — недельный отпуск</li><li><b>two hours&#x27;</b> delay — задержка на дв
